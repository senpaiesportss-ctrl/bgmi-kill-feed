<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BGMI Kill Feed Admin</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:radial-gradient(circle at 10% 0,#182536,#070a0f 45%);
  color:#f5f7fb;
  font:14px Segoe UI,Arial
}

.wrap{
  max-width:1100px;
  margin:auto;
  padding:28px 20px
}

.card{
  background:#10161f;
  border:1px solid #293444;
  border-radius:18px;
  padding:20px;
  margin:15px 0
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center
}

.brand{
  display:flex;
  gap:12px;
  align-items:center
}

.mark{
  width:45px;
  height:45px;
  border-radius:13px;
  background:#f5c542;
  color:#111;
  display:grid;
  place-items:center;
  font-weight:1000
}

h1{font-size:24px;margin:0}
h2{margin:0 0 6px}

.mut{color:#909cac}

.teams{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px
}

.team{
  background:#090e15;
  border:1px solid #222d3b;
  border-radius:14px;
  padding:13px
}

.head{
  display:flex;
  gap:9px;
  align-items:center
}

.logo{
  width:54px;
  height:54px;
  object-fit:contain;
  border-radius:10px;
  background:#070b10;
  border:1px solid #2a3544
}

.teamname{flex:1}

.num{
  font-size:11px;
  color:#f5c542;
  font-weight:900;
  text-transform:uppercase
}

input{
  width:100%;
  background:#080c12;
  color:#fff;
  border:1px solid #2a3544;
  border-radius:9px;
  padding:10px;
  outline:0
}

.players{
  display:grid;
  gap:7px;
  margin-top:10px
}

.prow{
  display:flex;
  gap:7px
}

.prow input{flex:1}

.btn{
  border:0;
  border-radius:9px;
  padding:10px 13px;
  font-weight:800;
  cursor:pointer;
  background:#1b2532;
  color:#fff
}

.gold{
  background:#f5c542;
  color:#111
}

.red{
  background:#30171d;
  color:#ff9ba5
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:13px
}

.region{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px
}

.hide{display:none}

.login{
  max-width:420px;
  margin:18vh auto
}

.info{
  display:grid;
  gap:8px
}

.info div{
  display:flex;
  justify-content:space-between;
  background:#090e15;
  padding:11px;
  border-radius:9px
}

.status{
  margin-top:12px;
  padding:12px;
  border-radius:9px;
  background:#090e15;
  border:1px solid #293444
}

@media(max-width:750px){
  .teams{grid-template-columns:1fr}
  .region{grid-template-columns:1fr 1fr}
}
</style>
</head>

<body>

<div id="login" class="card login">
  <h2>Private Tournament Room</h2>
  <p class="mut">Enter your room code.</p>

  <input id="roomInput" placeholder="Room code">

  <div class="actions">
    <button class="btn gold" onclick="login()">Open Admin</button>
  </div>

  <p id="err" class="mut"></p>
</div>


<div id="app" class="wrap hide">

  <div class="top">
    <div class="brand">
      <div class="mark">KF</div>

      <div>
        <h1>BGMI Tournament Kill Feed</h1>
        <div class="mut">Permanent cloud control panel</div>
      </div>
    </div>

    <div>🟢 Cloud online</div>
  </div>


  <section class="card">

    <h2>Teams & Players</h2>

    <p class="mut">
      Add roster and upload logos.
    </p>

    <div id="teams" class="teams"></div>

    <div class="actions">
      <button class="btn" onclick="addTeam()">＋ Team</button>
      <button class="btn gold" onclick="save()">Save Roster</button>
    </div>

  </section>


  <section class="card">

    <h2>Capture Area</h2>

    <div class="region">
      <input id="l" type="number" placeholder="Left">
      <input id="t" type="number" placeholder="Top">
      <input id="w" type="number" placeholder="Width">
      <input id="h" type="number" placeholder="Height">
    </div>

    <div class="actions">
      <button class="btn gold" onclick="saveRegion()">
        Save Region
      </button>

      <button class="btn" onclick="testKill()">
        Preview Kill
      </button>
    </div>

  </section>


  <section class="card">

    <h2>OBS</h2>

    <div class="info">

      <div>
        <span>Overlay</span>
        <b id="url"></b>
      </div>

      <div>
        <span>Canvas</span>
        <b>1920 × 1080</b>
      </div>

    </div>

    <div id="status" class="status">
      Loading cloud state...
    </div>

  </section>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="supabase.js"></script>


<script>

let cfg={teams:[]};

const $=x=>document.getElementById(x);

function esc(s){
  return String(s).replace(
    /[&<>"']/g,
    m=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[m])
  );
}


/* LOGIN */

async function login(){

  const r=$("roomInput").value.trim();

  if(!r){
    $("err").textContent="Room code enter karo.";
    return;
  }

  localStorage.setItem("kf_room",r);

  try{

    cfg=await getState();

    $("login").classList.add("hide");
    $("app").classList.remove("hide");

    load();

    $("status").textContent=
      "CLOUD CONNECTED ✅  |  Teams: "+
      ((cfg.teams||[]).length);

  }catch(e){

    localStorage.removeItem("kf_room");

    $("err").textContent=
      "Cloud Error: "+(e.message||e);

  }
}


/* LOAD SAVED CLOUD STATE */

async function boot(){

  const r=localStorage.getItem("kf_room");

  if(!r){

    $("status").textContent=
      "Room code required.";

    return;
  }

  try{

    cfg=await getState();

    if(!cfg){

      throw new Error("Cloud se config nahi mili.");

    }

    $("login").classList.add("hide");
    $("app").classList.remove("hide");

    load();

    $("status").textContent=
      "CLOUD STATE LOADED ✅  |  Teams: "+
      ((cfg.teams||[]).length)+
      "  |  Capture: "+
      JSON.stringify(cfg.capture_region||{});

  }catch(e){

    $("login").classList.remove("hide");
    $("app").classList.add("hide");

    $("err").textContent=
      "CLOUD ERROR: "+(e.message||e);

    console.error("Cloud error:",e);

  }
}


/* LOAD UI */

function load(){

  $("l").value=
    cfg.capture_region?.left ?? 105;

  $("t").value=
    cfg.capture_region?.top ?? 220;

  $("w").value=
    cfg.capture_region?.width ?? 420;

  $("h").value=
    cfg.capture_region?.height ?? 45;

  $("url").textContent=
    location.origin+"/overlay";

  render();
}


/* RENDER TEAMS */
function load(){$("l").value=cfg.capture_region?.left??105;$("t").value=cfg.capture_region?.top??220;$("w").value=cfg.capture_region?.width??420;$("h").value=cfg.capture_region?.height??45;$("url").textContent=location.origin+"/overlay";render()}
function render(){

  const d=$("teams");

  d.innerHTML="";

  (cfg.teams||[]).forEach((t,i)=>{

    const e=document.createElement("div");

    e.className="team";

    e.innerHTML=`

      <div class="head">

        <div>
          ${
            t.logo
            ? `<img class="logo" src="${t.logo}">`
            : `<div class="logo"></div>`
          }
        </div>

        <div class="teamname">

          <div class="num">
            Team ${i+1}
          </div>

          <input
            class="tn"
            value="${esc(t.name||"")}"
          >

        </div>

        <button
          class="btn"
          onclick="logo(${i})">
          Logo
        </button>

      </div>


      <div class="players">

        ${(t.players||[]).map(p=>`

          <div class="prow">

            <input
              class="pn"
              value="${esc(p)}"
            >

            <button
              class="btn red"
              onclick="this.parentElement.remove()">
              ×
            </button>

          </div>

        `).join("")}

      </div>


      <div class="actions">

        <button
          class="btn"
          onclick="player(${i})">
          ＋ Player
        </button>

        <button
          class="btn red"
          onclick="cfg.teams.splice(${i},1);render()">
          Remove
        </button>

      </div>

    `;

    d.appendChild(e);

  });

}


/* ADD TEAM */

function addTeam(){

  cfg.teams.push({
    name:"NEW TEAM",
    players:["Player 1"],
    logo:""
  });

  render();

}


/* ADD PLAYER */

function player(i){

  cfg.teams[i].players.push(
    "Player "+(cfg.teams[i].players.length+1)
  );

  render();

}


/* SYNC UI → CONFIG */

function sync(){

  document.querySelectorAll(".team").forEach((e,i)=>{

    cfg.teams[i].name=
      e.querySelector(".tn").value;

    cfg.teams[i].players=
      [...e.querySelectorAll(".pn")]
      .map(x=>x.value.trim())
      .filter(Boolean);

  });

}


/* SAVE ROSTER */

async function save(){

  try{

    sync();

    await setState(cfg);

    $("status").textContent=
      "ROSTER SAVED TO CLOUD ✅  |  Teams: "+
      cfg.teams.length;

    alert("Roster Saved ✅");

  }catch(e){

    alert(
      "SAVE ERROR ❌\n\n"+
      (e.message||e)
    );

  }

}


/* SAVE CAPTURE REGION */

async function saveRegion(){

  try{

    cfg.capture_region={
      left:+$("l").value,
      top:+$("t").value,
      width:+$("w").value,
      height:+$("h").value
    };

    await setState(cfg);

    $("status").textContent=
      "CAPTURE REGION SAVED ✅";

    alert("Region Saved ✅");

  }catch(e){

    alert(
      "SAVE REGION ERROR ❌\n\n"+
      (e.message||e)
    );

  }

}


/* UPLOAD LOGO */

function logo(i){

  const x=document.createElement("input");

  x.type="file";
  x.accept="image/*";

  x.onchange=()=>{

    const f=x.files[0];

    if(!f)return;

    const r=new FileReader();

    r.onload=()=>{

      cfg.teams[i].logo=r.result;

      render();

      save();

    };

    r.readAsDataURL(f);

  };

  x.click();

}


/* TEST KILL */

async function testKill(){

  try{

    await addEvent(
      "SXUNYA",
      "Enemy",
      ""
    );

    alert("Preview Kill Sent ✅");

  }catch(e){

    alert(
      "TEST KILL ERROR ❌\n\n"+
      (e.message||e)
    );

  }

}


/* START */

boot();

</script>

</body>
</html>
