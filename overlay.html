<!doctype html><meta charset="utf-8"><style>*{box-sizing:border-box}html,body{margin:0;background:transparent;overflow:hidden;font-family:Arial;color:#fff}#feed{position:absolute;left:35px;top:35px;width:760px;display:flex;flex-direction:column;gap:10px}.row{height:72px;display:flex;align-items:center;background:linear-gradient(90deg,#05080df7,#121720f0 72%,#05080dc0);border:1px solid #ffffff20;border-left:4px solid #f5c542;border-radius:4px;animation:in .22s ease-out;box-shadow:0 9px 28px #0007}.logo{width:54px;height:54px;margin:7px 11px 7px 8px;border-radius:8px;object-fit:contain;background:#080c11;border:1px solid #ffffff1a}.name,.victim{font-size:21px;font-weight:900;white-space:nowrap;text-shadow:0 2px 4px #000}.name{min-width:235px;text-align:right}.victim{min-width:235px}.gun{font-size:25px;margin:0 16px}@keyframes in{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}</style><div id=feed></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase.js"></script><script>
let shown=new Map();async function tick(){try{let [c,all]=await Promise.all([getState(),getEvents()]),hold=+(c.event_hold_seconds||4),now=Date.now(),r={};(c.teams||[]).forEach(t=>(t.players||[]).forEach(p=>r[p.toLowerCase()]={logo:t.logo||""}));for(let [id,el] of shown){let e=all.find(x=>x.id===id);if(!e||now-Date.parse(e.time)>hold*1000){el.remove();shown.delete(id)}}all.slice(-5).forEach(e=>{let id=e.id;if(shown.has(id)||now-Date.parse(e.time)>hold*1000)return;let a=r[(e.killer||"").toLowerCase()]||{},b=r[(e.victim||"").toLowerCase()]||{},x=document.createElement("div");x.className="row";x.innerHTML=`<img class=logo src="${a.logo}" onerror="this.style.visibility='hidden'"><div class=name>${esc(e.killer)}</div><div class=gun>${e.weapon||"🔫"}</div><div class=victim>${esc(e.victim)}</div><img class=logo src="${b.logo}" onerror="this.style.visibility='hidden'">`;feed.prepend(x);shown.set(id,x);setTimeout(()=>{if(shown.get(id)===x){x.style.animation="none";x.style.opacity=0;x.style.transition="opacity .28s";setTimeout(()=>x.remove(),280);shown.delete(id)}},hold*1000)})}catch(e){}}function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}tick();setInterval(tick,700);
</script>
