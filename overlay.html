<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920,height=1080">
<title>Senpai Esports • BGMI Broadcast</title>

<script src="/config.js"></script>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:transparent;
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
}

#stage{
  position:relative;
  width:1920px;
  height:1080px;
  transform-origin:top left;
}

@media(max-width:1920px){
  #stage{
    transform:scale(calc(100vw / 1920));
  }
}

@media(max-height:1080px){
  #stage{
    transform:scale(
      min(
        calc(100vw / 1920),
        calc(100vh / 1080)
      )
    );
  }
}

:root{
  --blue:#087dff;
  --cyan:#19cfff;
  --deep:#050914;
  --panel:rgba(4,10,22,.95);
  --gold:#ffd52b;
  --white:#f7fbff;
  --muted:#93a9c7;
  --line:rgba(35,166,255,.5);
}

.tech{
  background:
    linear-gradient(
      90deg,
      rgba(5,12,26,.98),
      rgba(7,18,38,.96),
      rgba(5,12,26,.98)
    );

  border:1px solid rgba(25,170,255,.45);
  position:relative;
}

.tech:before{
  content:"";
  position:absolute;
  left:0;
  right:0;
  top:-1px;
  height:2px;

  background:
    linear-gradient(
      90deg,
      transparent,
      #16bfff,
      #fff,
      #16bfff,
      transparent
    );

  box-shadow:0 0 10px #09bfff;
}

.glow{
  box-shadow:
    0 0 18px rgba(0,150,255,.22),
    inset 0 0 20px rgba(0,100,255,.05);
}

.topbar{
  position:absolute;
  left:50%;
  top:24px;
  width:520px;
  height:54px;

  transform:translateX(-50%);

  display:flex;
  align-items:center;
  justify-content:center;

  gap:16px;
  padding:0 22px;

  clip-path:
    polygon(
      4% 0,
      96% 0,
      100% 50%,
      96% 100%,
      4% 100%,
      0 50%
    );
}

.live{
  display:flex;
  align-items:center;
  gap:8px;

  background:#c91525;
  padding:7px 13px;

  font-size:15px;
  font-weight:1000;
  letter-spacing:2px;
}

.live i{
  width:8px;
  height:8px;
  background:#fff;
  border-radius:50%;

}

.matchblock{
  line-height:1.05;
  text-align:center;
}

.matchtitle{
  font-size:21px;
  font-weight:1000;
  letter-spacing:1px;
  display:inline;
}

.group{
  display:inline;
  font-size:14px;
  color:var(--gold);
  font-weight:900;
  letter-spacing:2px;
  margin-left:5px;
}

.day{
  display:inline;
  font-size:9px;
  color:#8ca8ca;
  font-weight:900;
  margin-left:8px;
  letter-spacing:1px;
}

.map{
  display:inline;
  font-size:9px;
  color:#8ca8ca;
  font-weight:900;
  margin-left:7px;
  letter-spacing:1px;
}

.feedWrap{
  position:absolute;
  left:22px;
  top:82px;
  width:370px;

  background:var(--panel);
  border:1px solid rgba(25,170,255,.55);

  box-shadow:
    0 0 18px rgba(0,150,255,.22);

  overflow:hidden;

  transition:
    opacity .25s ease,
    transform .25s ease;
}

.feedWrap.hidden{
  opacity:0;
  transform:translateX(-15px);
  pointer-events:none;
}

.feedHeader{
  height:38px;

  display:flex;
  align-items:center;

  padding:0 12px;

  border-bottom:
    1px solid rgba(25,170,255,.35);

  font-size:13px;
  font-weight:1000;
  letter-spacing:1.5px;
}

.feedHeader:before{
  content:"";

  width:3px;
  height:17px;

  margin-right:8px;

  background:var(--cyan);

  box-shadow:
    0 0 8px var(--cyan);
}

#feedRows{
  padding:7px;
}

.killRow{
  height:47px;

  display:grid;

  grid-template-columns:
    30px
    minmax(0,1fr)
    55px
    minmax(0,1fr)
    30px;

  align-items:center;

  gap:5px;
  padding:0 5px;

  background:
    linear-gradient(
      90deg,
      rgba(12,28,49,.97),
      rgba(7,14,27,.95)
    );

  border:
    1px solid rgba(70,150,220,.18);

  animation:
    killIn .22s ease-out;
}

@keyframes killIn{
  from{
    opacity:0;
    transform:translateX(-12px);
  }

  to{
    opacity:1;
    transform:translateX(0);
  }
}

.killLogo{

  height:27px;
  object-fit:contain;
}

.killer{

}

.victim{

  font-size:9px;

  text-overflow:ellipsis;
}

.weapon{

  padding:12px 12px 10px;
  overflow:hidden;
}

.pointsHeader{

  align-items:center;

  position:relative;
}

.pointsHeader:before{

  height:18px;

  box-shadow:

}

.pointsTitle{
  font-size:16px;
  font-weight:1000;
  letter-spacing:1.4px;
}

.pointsMini{
  font-size:9px;

  letter-spacing:1.5px;
  margin-top:3px;
}

.liveTag{

  font-size:9px;

.columns,
.prow{

    1fr

}

.columns{

  font-size:8px;

.columns div{

.prow{

}

.prow:first-child{

.prow:first-child .rank{

.team img{

.team b{

  overflow:hidden;
  text-overflow:ellipsis;

.elimTag{
  flex:0 0 auto;
  margin-left:3px;
  font-size:7px;

  color:#ff8d9a;
  white-space:nowrap;
}

.num{
  font-size:10px;
  font-weight:1000;

}

.pts{
  font-size:12px;
  font-weight:1000;
  color:var(--gold);

#elimBanner{
  position:absolute;

  left:50%;
  top:92px;

  transform:translateX(-50%);

    linear-gradient(

#elimLogo{

#elimTag{

#elimName{

#status{

#loading{

<style id="premium-broadcast-ui-only">

html,body{-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision} #stage{backface-visibility:hidden;-webkit-backface-visibility:hidden;transform-origin:top left;will-change:transform} .tech{backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 0 24px rgba(0,140,255,.16),inset 0 1px 0 rgba(255,255,255,.04)} .glow{will-change:transform,opacity;backface-visibility:hidden} .topbar,.live,#pointsPanel,#killFeed,#elimBanner{backface-visibility:hidden;-webkit-backface-visibility:hidden;transform-style:preserve-3d} table tr{backface-visibility:hidden} @media(prefers-reduced-motion:no-preference){.topbar,.live,#pointsPanel,#killFeed,#elimBanner{will-change:transform,opacity}}

<script>

const CFG =
  window.KF_CONFIG || {};

const SUPABASE_URL =
  CFG.SUPABASE_URL ||
  "https://nuywberanlfvngjnjcpx.supabase.co";

const SUPABASE_KEY =
  CFG.SUPABASE_PUBLISHABLE_KEY || "";

const ROOM =
  localStorage.getItem("kf_room") ||
  "ADITYA8029";

const sb =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

const $ =
  id =>
    document.getElementById(id);

function esc(v){

  return String(v ?? "")
    .replace(
      /[&<>"']/g,
      m =>
        ({
          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#039;"
        }[m])
    );

}

function arr(v){

  return Array.isArray(v)
    ? v
    : [];

}

async function rpc(
  name,
  params
){

  const r =
    await sb.rpc(
      name,
      params
    );

  if(r.error)
    throw r.error;

  return r.data;

}

async function getState(){
  const data = await rpc("kf_get_state", {p_room_code:ROOM});
  if(data && typeof data === "object" && data.config && typeof data.config === "object") return data.config;
  if(data && typeof data === "object" && data.state && typeof data.state === "object") return data.state;
  return data || {teams:[]};
}

async function getEvents(){

  return rpc(
    "kf_events",
    {
      p_room_code:ROOM
    }
  );

}

function teamsFromConfig(c){

  const t =
    c?.teams;

  if(Array.isArray(t))
    return t;

  if(
    t &&
    typeof t === "object"
  ){

    return Object.entries(t)
      .map(
        ([key,val]) => {

          if(
            val &&
            typeof val === "object"
          ){

            return {
              ...val,

              name:
                val.name ||
                key,

              short:
                val.short ||
                val.tag ||
                val.abbr ||
                key
            };

          }

          return {
            name:key,
            short:key
          };

        }
      );

  }

  return [];

}

function teamName(t){

  return (
    t?.name ||
    t?.team ||
    t?.short ||
    t?.tag ||
    "UNKNOWN"
  );

}

function teamShort(t){

  return (
    t?.short ||
    t?.tag ||
    t?.abbr ||
    teamName(t)
  );

}

function teamLogo(t){

  return (
    t?.logo ||
    t?.logo_url ||
    t?.image ||
    t?.image_url ||
    ""
  );

}

function teamPlayers(t){

  const p =
    t?.players ??
    t?.members ??
    t?.roster ??
    [];

  if(Array.isArray(p)){

    return p
      .map(
        x =>
          typeof x === "string"
          ? x
          : (
              x?.name ||
              x?.ign ||
              x?.player ||
              ""
            )
      )
      .filter(Boolean);

  }

  if(
    p &&
    typeof p === "object"
  ){

    return Object.values(p)
      .map(
        x =>
          typeof x === "string"
          ? x
          : (
              x?.name ||
              x?.ign ||
              x?.player ||
              ""
            )
      )
      .filter(Boolean);

  }

  return [];

}

function findTeam(
  c,
  player
){

  const p =
    String(player || "")
      .trim()
      .toLowerCase();

  if(!p)
    return null;

  const teams =
    teamsFromConfig(c);

  const exact =
    teams.find(
      t =>
        teamPlayers(t)
          .some(
            x =>
              String(x)
                .trim()
                .toLowerCase()
              === p
          )
    );

  if(exact)
    return exact;

  const partial =
    teams.find(
      t =>
        teamPlayers(t)
          .some(
            x => {

              const a = p;

              const b =
                String(x)
                  .trim()
                  .toLowerCase();

              return (
                a.includes(b) ||
                b.includes(a)
              );

            }
          )
    );

  return partial || null;

}

function eventTime(e){
  const raw = e?.time ?? e?.created_at ?? e?.timestamp ?? 0;
  if(typeof raw === "number") return raw < 100000000000 ? raw * 1000 : raw;
  const n = Number(raw);
  if(Number.isFinite(n) && n > 0) return n < 100000000000 ? n * 1000 : n;
  return new Date(raw || 0).getTime() || 0;
}

function eventKiller(e){

  return (
    e?.killer ||
    e?.p_killer ||
    e?.killer_name ||
    e?.attacker ||
    e?.killerName ||
    e?.data?.killer ||
    ""
  );

}

function eventVictim(e){

  return (
    e?.victim ||
    e?.p_victim ||
    e?.victim_name ||
    e?.target ||
    e?.victimName ||
    e?.data?.victim ||
    ""
  );

}

function eventRawWeapon(e){
  return (
    e?.weapon ||
    e?.p_weapon ||
    e?.weapon_name ||
    e?.weaponName ||
    e?.data?.weapon ||
    "GUN"
  );
}

function manualEventMeta(e){
  const raw=String(eventRawWeapon(e)||"");
  const m=raw.match(/^__KF_MANUAL__(\d+)__(.*)$/);
  if(!m) return null;
  let weapon="GUN";
  try{ weapon=decodeURIComponent(m[2]||"GUN") || "GUN"; }
  catch(_){ weapon=m[2]||"GUN"; }
  return {teamIndex:Number(m[1]),weapon};
}

function eventWeapon(e){
  const meta=manualEventMeta(e);
  return meta ? meta.weapon : eventRawWeapon(e);
}

function normalizeEvents(raw){

  if(raw && typeof raw === "object" && raw.events && typeof raw.events === "object" && !Array.isArray(raw.events)) raw = raw.events;
  if(Array.isArray(raw))
    return raw;

  if(
    raw &&
    Array.isArray(raw.events)
  )
    return raw.events;

  if(
    raw &&
    Array.isArray(raw.data)
  )
    return raw.data;

  if(
    raw &&
    Array.isArray(raw.result)
  )
    return raw.result;

  return [];

}

function eventsAfterReset(c, events){
  const resetAt = Number(c?.match_reset_at || 0);
  const resetIds = new Set((Array.isArray(c?.match_reset_event_ids) ? c.match_reset_event_ids : []).map(String));
  if(!resetAt && !resetIds.size) return events;
  return events.filter(e => {
    const id=e?.id;
    if(id !== undefined && id !== null && resetIds.has(String(id))) return false;
    const t=eventTime(e);
    // Timestamped events are authoritative. Untimestamped events are kept
    // here and handled by the reset-baseline ledger below.
    return !resetAt || !t || t >= resetAt;
  });
}

function eventKey(e){

  if(
    e?.id !== undefined &&
    e?.id !== null
  ){

    return "ID:" +
      String(e.id);

  }

  return [
    eventTime(e),
    eventKiller(e),
    eventVictim(e),
    eventWeapon(e)
  ].join("|");

}

function uniqueEvents(raw){

  const source =
    normalizeEvents(raw);

  const seen =
    new Set();

  const out = [];

  for(
    const e of source
  ){

    const key =
      eventKey(e);

    if(
      seen.has(key)
    )
      continue;

    seen.add(key);
    out.push(e);

  }

  return out;

}

function sortedEvents(raw){

  return uniqueEvents(raw)
    .sort(
      (a,b) =>
        eventTime(b) -
        eventTime(a)
    );

}

let feedTimer =
  null;

let lastFeedKey =
  "";

function hideFeed(){

  $("feedWrap")
    .classList
    .add("hidden");

}

function showKillFeed(
  c,
  raw
){

  // Admin controls this without changing the overlay design.
  if(c?.show_kill_feed === false || c?.broadcast?.kill_feed_enabled === false){
    hideFeed();
    return;
  }

  const events =
    sortedEvents(raw);

  if(!events.length){

    hideFeed();

    return;

  }

  const e =
    events[0];

  const key =
    eventKey(e);

  if(
    key === lastFeedKey
  )
    return;

  lastFeedKey =
    key;

  const killer =
    eventKiller(e);

  const victim =
    eventVictim(e);

  const weapon =
    eventWeapon(e);

  const manualMeta = manualEventMeta(e);

  const killerTeam =
    manualMeta && Number.isInteger(manualMeta.teamIndex)
      ? teamsFromConfig(c)[manualMeta.teamIndex]
      : findTeam(
          c,
          killer
        );

  const victimTeam =
    findTeam(
      c,
      victim
    );

  const killerLogo =
    teamLogo(
      killerTeam
    );

  const victimLogo =
    teamLogo(
      victimTeam
    );

  $("feedRows").innerHTML = `

    <div class="killRow">

      ${
        killerLogo
        ?
        `
        <img
          class="killLogo"
          src="${esc(killerLogo)}"
          onerror="
            this.style.visibility='hidden'
          "
        >
        `
        :
        `<div></div>`
      }

      <div
        class="killer"
        title="${esc(killer)}">

        ${esc(
          killer ||
          "UNKNOWN"
        )}

      </div>

      <div
        class="weapon"
        title="${esc(weapon)}">

        ${esc(
          weapon ||
          "GUN"
        )}

      </div>

      <div
        class="victim"
        title="${esc(victim)}">

        ${esc(
          victim ||
          "UNKNOWN"
        )}

      </div>

      ${
        victimLogo
        ?
        `
        <img
          class="killLogo"
          src="${esc(victimLogo)}"
          onerror="
            this.style.visibility='hidden'
          "
        >
        `
        :
        `<div></div>`
      }

    </div>

  `;

  $("feedWrap")
    .classList
    .remove("hidden");

  clearTimeout(
    feedTimer
  );

  feedTimer =
    setTimeout(
      () => {
        hideFeed();
      },
      5000
    );

}

// Persistent match kill ledger.
// The events RPC may return only a rolling/latest window; therefore we
// NEVER rebuild the scoreboard from only the currently returned events.
// Every event is counted once and kept until the Admin presses RESET MATCH.
function getKillCounts(c, raw){
  const resetKey=String(c?.match_reset_nonce || c?.match_reset_at || "NO_RESET");
  const resetAt=Number(c?.match_reset_at || 0);
  const storageKey="bgmi_kill_ledger:"+ROOM;
  const all=uniqueEvents(raw);
  let ledger=null;
  try{ ledger=JSON.parse(localStorage.getItem(storageKey)||"null"); }catch(e){ ledger=null; }

  const freshReset=!ledger || ledger.resetKey!==resetKey;
  if(freshReset){
    ledger={resetKey,seen:{},counts:{}};
    // Establish a zero-count baseline for events already present at reset.
    // Timestamped events after reset remain eligible to count immediately.
    for(const e of all){
      const t=eventTime(e);
      if(!t || (resetAt && t < resetAt)) ledger.seen[eventKey(e)]=1;
    }
  }

  const events=eventsAfterReset(c,all);
  for(const e of events){
    const key=eventKey(e);
    if(!key || ledger.seen[key]) continue;
    const t=eventTime(e);
    if(freshReset && !t){
      // An event without a timestamp that was not in the first baseline fetch
      // is treated as new from this point onward.
    }
    const killer=eventKiller(e);
    const manualMeta=manualEventMeta(e);
    const teams=teamsFromConfig(c);
    const team=manualMeta && Number.isInteger(manualMeta.teamIndex)
      ? teams[manualMeta.teamIndex]
      : findTeam(c,killer);
    if(!team){ ledger.seen[key]=1; continue; }
    const name=teamName(team);
    ledger.counts[name]=(Number(ledger.counts[name])||0)+1;
    ledger.seen[key]=1;
  }

  try{ localStorage.setItem(storageKey,JSON.stringify(ledger)); }catch(e){}

  // Admin can remove accidental kills without deleting historical events.
  // Negative adjustments are clamped to zero at display time.
  const adjusted={...ledger.counts};
  const adj=c?.kill_adjustments || {};
  for(const [teamName,value] of Object.entries(adj)){
    adjusted[teamName]=Math.max(0,(Number(adjusted[teamName])||0)+(Number(value)||0));
  }
  return adjusted;
}

function getEliminationState(c, raw){

  const resetKey = String(
    c?.match_reset_nonce ||
    c?.match_reset_at ||
    "NO_RESET"
  ) + "|ELIM|" + String(
    c?.elimination_reset_nonce ||
    c?.elimination_reset_at ||
    "0"
  );

  const storageKey =
    "bgmi_elimination_ledger:" + ROOM;

  let ledger = {
    resetKey,
    seen: {},
    victims: {}
  };

  try{
    const saved = JSON.parse(
      localStorage.getItem(storageKey) || "null"
    );

    if(saved && saved.resetKey === resetKey){
      ledger = saved;
    }else{
      localStorage.removeItem(storageKey);
    }
  }catch(e){}

  const allEvents = uniqueEvents(raw);
  const baseEvents = eventsAfterReset(c, allEvents);
  const elimResetAt = Number(c?.elimination_reset_at || 0);
  const freshElimReset = !ledger || ledger.resetKey !== resetKey;
  if(freshElimReset && elimResetAt){
    // Baseline victims that existed before the elimination reset.
    for(const e of allEvents){
      const t=eventTime(e);
      if(!t || t < elimResetAt) ledger.seen[eventKey(e)]=1;
    }
  }
  const events = elimResetAt ? baseEvents.filter(e => {
    const t=eventTime(e);
    return !t || t >= elimResetAt;
  }) : baseEvents;

  for(const e of events){

    const key = eventKey(e);

    if(!key || ledger.seen[key])
      continue;

    const victim = eventVictim(e);
    if(!victim){
      ledger.seen[key] = 1;
      continue;
    }

    const victimTeam = eliminationFindTeam(c, victim);

    if(victimTeam){

      const name = teamName(victimTeam);

      if(!ledger.victims[name])
        ledger.victims[name] = {};

      ledger.victims[name][
        eliminationNorm(victim)
      ] = 1;
    }

    ledger.seen[key] = 1;
  }

  try{
    localStorage.setItem(
      storageKey,
      JSON.stringify(ledger)
    );
  }catch(e){}

  return ledger;
}

function num(
  v,
  fallback=0
){

  const n =
    Number(v);

  return Number.isFinite(n)
    ? n
    : fallback;

}

function placementPoints(t){

  return num(
    t?.placement ??
    t?.placement_points ??
    t?.place_points ??
    0
  );

}

function broadcast(c){

  const b =
    c?.broadcast || {};

  return {

    match:
      b.match ||
      c?.match ||
      c?.match_name ||
      "MATCH 1",

    group:
      b.group ||
      c?.group ||
      c?.group_name ||
      "GROUP A × B",

    day:
      b.day ||
      c?.day ||
      "DAY 1",

    map:
      b.map ||
      c?.map ||
      "ERANGEL"

  };

}

function manualPoints(t){
  return num(t?.manual_points || 0);
}

function renderTable(
  c,
  raw
){

  const teams =
    teamsFromConfig(c);

  if(!teams.length){

    $("table").innerHTML =
      `
      <div style="
        height:50px;
        display:flex;
        align-items:center;
        justify-content:center;
        color:#6684a8;
        font-size:9px;
        font-weight:1000;
        letter-spacing:2px;
      ">
        NO TEAM DATA
      </div>
      `;

    return;

  }

  const kills =
    getKillCounts(
      c,
      raw
    );

  const eliminatedTeams = new Set(
    getEliminatedTeams(c, raw)
      .map(t => eliminationNorm(teamName(t)))
      .filter(Boolean)
  );

  const rows =
    teams.map(
      (t,index) => {

        const name =
          teamName(t);

        const k =
          kills[name] || 0;

        const placement =
          placementPoints(t);

        const manual =
          manualPoints(t);

        return {

          t,
          name,
          kills:k,
          placement,
          manual,

          total:
            k + placement + manual,

          index

        };

      }
    );

  rows.sort(
    (a,b) =>
      b.total -
      a.total ||

      b.kills -
      a.kills ||

      a.index -
      b.index
  );

  $("table").innerHTML =
    rows
      .slice(0,16)
      .map(
        (r,index) => {

          const logo =
            teamLogo(r.t);

          return `

          <div class="prow ${eliminatedTeams.has(eliminationNorm(r.name)) ? "eliminated" : ""}">

            <div class="rank">
              ${index + 1}
            </div>

            <div class="team">

              ${
                logo
                ?
                `
                <img
                  src="${esc(logo)}"
                  onerror="
                    this.style.visibility='hidden'
                  "
                >
                `
                :
                ""
              }

              <b
                title="${esc(r.name)}">

                ${esc(
                  teamShort(r.t)
                )}

              </b>

              ${
                eliminatedTeams.has(eliminationNorm(r.name))
                ?
                `<span class="elimTag">ELIMINATED</span>`
                :
                ""
              }

            </div>

            <div class="num">
              ${r.kills}
            </div>

            <div class="num">
              ${r.placement}
            </div>

            <div class="pts" title="Kills ${r.kills} + Placement ${r.placement} + Manual ${r.manual}">
              ${r.total}
            </div>

          </div>

          `;

        }
      )
      .join("");

}

const eliminatedShown = new Set();
let elimTimer = null;
let lastResetNonce = "";

function eliminationNorm(v){
  return String(v ?? "").trim().toLowerCase().replace(/[^a-z0-9]/g,"");
}

function eliminationFindTeam(c, player){
  const p = String(player ?? "").trim().toLowerCase();
  const pn = eliminationNorm(player);
  if(!p && !pn) return null;
  const teams = teamsFromConfig(c);

  const exact = teams.find(t =>
    teamPlayers(t).some(x => String(x ?? "").trim().toLowerCase() === p)
  );
  if(exact) return exact;

  const normalized = teams.find(t =>
    teamPlayers(t).some(x => eliminationNorm(x) === pn)
  );
  if(normalized) return normalized;

  return teams.find(t =>
    teamPlayers(t).some(x => {
      const xn = eliminationNorm(x);
      return pn.length >= 4 && xn.length >= 4 &&
        (pn.includes(xn) || xn.includes(pn));
    })
  ) || null;
}

function teamExplicitlyEliminated(t){
  const status = String(t?.status ?? t?.state ?? t?.team_status ?? "")
    .trim().toLowerCase();
  return (
    t?.eliminated === true ||
    t?.is_eliminated === true ||
    status === "eliminated" ||
    Number(t?.alive) === 0
  );
}

function getEliminatedTeams(c, raw){

  const teams = teamsFromConfig(c);
  const ledger = getEliminationState(c, raw);

  const result = [];

  teams.forEach(t => {

    const name = teamName(t);
    const victims =
      ledger.victims[name] || {};

    const uniqueVictims =
      Object.keys(victims).filter(Boolean).length;

    if(
      teamExplicitlyEliminated(t) ||
      uniqueVictims >= 4
    ){
      result.push(t);
    }
  });

  // Admin manual/test elimination signal.
  const test = c?.test_elimination;

  if(
    test &&
    Number(test.expires_at || 0) > Date.now()
  ){

    const target =
      eliminationNorm(test.team);

    const testTeam =
      teams.find(
        t => eliminationNorm(teamName(t)) === target
      ) ||
      teams.find(t => {
        const n = eliminationNorm(teamName(t));
        return n && target &&
          (n.includes(target) || target.includes(n));
      });

    if(
      testTeam &&
      !result.some(
        t => teamName(t) === teamName(testTeam)
      )
    ){
      result.push(testTeam);
    }
  }

  return result;
}

function showElimination(t){
  const logo = teamLogo(t);
  const logoEl = $("elimLogo");

  if(logo){
    logoEl.src = logo;
    logoEl.style.visibility = "visible";
  }else{
    logoEl.removeAttribute("src");
    logoEl.style.visibility = "hidden";
  }

  $("elimName").textContent = teamName(t);
  $("elimBanner").style.display = "flex";

  clearTimeout(elimTimer);
  elimTimer = setTimeout(() => {
    $("elimBanner").style.display = "none";
  }, 5000);
}

function checkEliminations(c, raw){

  const resetNonce = String(c?.elimination_reset_nonce || c?.elimination_reset_at || "");
  if(resetNonce && resetNonce !== lastResetNonce){
    lastResetNonce = resetNonce;
    eliminatedShown.clear();
    clearTimeout(elimTimer);
    $("elimBanner").style.display = "none";
  }

  raw = eventsAfterReset(c, uniqueEvents(raw));

  // TEST ELIMINATION is a direct cloud signal.
  // Do NOT require the team roster lookup to succeed.
  // This is what makes the Admin test banner reliable even if
  // OCR/player-name matching is imperfect.
  const test = c?.test_elimination;
  if(
    test &&
    Number(test.expires_at || 0) > Date.now() &&
    String(test.team || "").trim()
  ){
    const testName = String(test.team).trim();
    const testKey = "__TEST_ELIM__|" + testName + "|" + String(test.nonce || "");

    if(!eliminatedShown.has(testKey)){
      const teams = teamsFromConfig(c);
      const target = eliminationNorm(testName);

      const testTeam =
        teams.find(t => eliminationNorm(teamName(t)) === target) ||
        teams.find(t => {
          const n = eliminationNorm(teamName(t));
          return n && target && (n.includes(target) || target.includes(n));
        }) ||
        {
          name:testName,
          short:testName,
          logo:""
        };

        eliminatedShown.add(testKey);
      // Mark the same key as already shown so the realtime/state reconciliation
      // cannot fire the elimination banner a second time.
      eliminatedShown.add("__REAL_ELIM__|" + teamName(testTeam));
      showElimination(testTeam);
    }
  }

  // REAL MATCH elimination: 4 unique victims.
  const eliminated = getEliminatedTeams(c, raw);

  for(const t of eliminated){
    const name = teamName(t);
    const key = "__REAL_ELIM__|" + name;

    if(eliminatedShown.has(key))
      continue;

    eliminatedShown.add(key);
    showElimination(t);
  }
}

let updating = false;
let cachedConfig = null;
let cachedEvents = [];
let lastStateFetch = 0;
let refreshTimer = null;

async function update(opts = {}){

  if(updating) return;
  updating = true;

  try{
    const now = performance.now();
    const forceState = !!opts.forceState;
    const forceEvents = opts.forceEvents !== false;

    // State changes are relatively rare. Keep it cached so rapid kill events
    // do not wait for a second RPC call every time. Realtime still refreshes it.
    if(forceState || !cachedConfig || now - lastStateFetch > 4000){
      const state = await getState();
      cachedConfig = state?.config ?? state?.state ?? state;
      if(cachedConfig && cachedConfig.config && typeof cachedConfig.config === "object") cachedConfig = cachedConfig.config;
      lastStateFetch = now;
    }

    if(forceEvents){
      const rawEvents = await getEvents();
      cachedEvents = eventsAfterReset(
        cachedConfig,
        normalizeEvents(rawEvents)
      );
    }

    const c = cachedConfig || {};
    const events = cachedEvents;
    const b = broadcast(c);

    $("matchTitle").textContent = b.match;
    $("groupTitle").textContent = b.group;
    $("dayTitle").textContent = b.day;
    $("mapTitle").textContent = b.map;
    $("mapMini").textContent = b.map;

    renderTable(c, events);
    showKillFeed(c, events);
    checkEliminations(c, events);
    $("loading").style.display = "none";

  }catch(err){
    console.error("BGMI OVERLAY ERROR:", err);
    $("status").textContent = "LIVE DATA CONNECTION ERROR • RETRYING...";
    $("loading").textContent = "RECONNECTING...";
  }

  updating = false;
}

// Lightweight fallback polling. Realtime triggers immediate refreshes; polling is only a safety net.
// Realtime/BroadcastChannel triggers an immediate refresh when available.
update({forceState:true, forceEvents:true});
setInterval(() => update({forceEvents:true}), 500);

// Instant live trigger for state/event changes.
// Polling is intentionally slower to avoid hammering Supabase and OBS browser rendering.
try{
  const scheduleRealtimeRefresh = (forceState=false) => {
    clearTimeout(refreshTimer);
    refreshTimer = setTimeout(() => update({forceState, forceEvents:true}), 20);
  };

  const liveChannel = sb.channel("bgmi-kill-feed-live-overlay");

  liveChannel
    .on("postgres_changes", {
      event:"*", schema:"public", table:"killfeed_state"
    }, payload => {
      // State changes (placement/elimination/broadcast/reset) are applied
      // immediately from realtime instead of waiting for the next poll.
      const next = payload?.new?.config;
      if(next && typeof next === "object"){
        cachedConfig = next;
        lastStateFetch = performance.now();
      }
      scheduleRealtimeRefresh(false);
    })
    .on("postgres_changes", {
      event:"INSERT", schema:"public", table:"killfeed_events"
    }, payload => {
      // Use the realtime INSERT directly. This makes the kill feed/scoreboard
      // react immediately and avoids waiting for a full events RPC round trip.
      const incoming = payload?.new;
      if(incoming && typeof incoming === "object"){
        const merged = uniqueEvents([incoming, ...cachedEvents]);
        cachedEvents = eventsAfterReset(cachedConfig || {}, merged);
        renderTable(cachedConfig || {}, cachedEvents);
        showKillFeed(cachedConfig || {}, cachedEvents);
        checkEliminations(cachedConfig || {}, cachedEvents);
      }else{
        scheduleRealtimeRefresh(false);
      }
    })
    .subscribe(status => {
      if(status === "SUBSCRIBED"){
        // Reconcile once after realtime is live so no event is missed between
        // initial page load and subscription.
        scheduleRealtimeRefresh(true);
      }
    });
}catch(e){
  console.warn("Realtime trigger unavailable:", e);
}

try{
  const instantElimination = (data) => {
    const d=data||{};
    const name=String(d.team||"").trim();
    if(!name) return;

    // Show the banner locally FIRST. No Supabase round-trip required.
    const teams=teamsFromConfig(cachedConfig||{});
    const target=eliminationNorm(name);
    const team=
      teams.find(t=>eliminationNorm(teamName(t))===target) ||
      {name:name, short:name, logo:String(d.logo||"")};

    if(d.logo && !team.logo) team.logo=d.logo;
    const instantKey = "__REAL_ELIM__|" + teamName(team);
    eliminatedShown.add(instantKey);
    showElimination(team);
  };

  // Supabase Broadcast is the reliable cross-process path (OBS + Admin).
  try{
    // Dedicated low-latency admin bus. Subscribe immediately; it is the
    // primary path for Admin -> OBS actions and does not wait for state RPCs.
    sb.channel("bgmi-kill-feed-admin-bus", { config: { broadcast: { ack: true } } })
      .on("broadcast", {event:"admin_action"}, msg => {
        const m=msg?.payload||{};
        const d=m?.data||{};
        if(d?.config && typeof d.config === "object"){
          cachedConfig = d.config;
          lastStateFetch = performance.now();
          renderTable(cachedConfig, cachedEvents);
        }
        if(m.type === "elimination") {
          if(d?.config && typeof d.config === "object") {
            // Apply the elimination to the scoreboard FIRST, without waiting
            // for postgres_changes/polling.
            cachedConfig = d.config;
            const target = eliminationNorm(d.team);
            if(Array.isArray(cachedConfig.teams)) {
              const et = cachedConfig.teams.find(t => eliminationNorm(teamName(t)) === target);
              if(et) {
                et.eliminated = true;
                et.is_eliminated = true;
                et.status = "ELIMINATED";
                et.alive = 0;
              }
            }
            renderTable(cachedConfig, cachedEvents);
          }
          instantElimination(d);
          return;
        }
        if(m.type === "event" && d?.killer && d?.victim){
          // Optimistic kill-feed display. The INSERT realtime event will
          // reconcile/deduplicate the same kill later.
          const optimistic = {
            id: "admin_"+String(m.t||Date.now()),
            killer: d.killer, victim: d.victim, weapon: d.weapon || "GUN",
            created_at: new Date().toISOString()
          };
          cachedEvents = uniqueEvents([optimistic, ...cachedEvents]);
          renderTable(cachedConfig || {}, cachedEvents);
          showKillFeed(cachedConfig || {}, cachedEvents);
          checkEliminations(cachedConfig || {}, cachedEvents);
          return;
        }
        // Placement/reset/broadcast/etc: state is already in the message.
        if(d?.config) {
          renderTable(cachedConfig || {}, cachedEvents);
          checkEliminations(cachedConfig || {}, cachedEvents);
        } else {
          update({forceState:true, forceEvents:true});
        }
      })
      .subscribe();
  }catch(e){ console.warn("Supabase broadcast unavailable:", e); }

  if("BroadcastChannel" in window){
    const liveChannel = new BroadcastChannel("bgmi-kill-feed-live");
    liveChannel.onmessage = msg => {
      const m=msg?.data||{};
      if(m.type==="elimination") instantElimination(m.data);
      else update({forceEvents:true});
    };
  }

  window.addEventListener("storage", e => {
    if(e.key !== "kf_live_ping") return;
    try{
      const m=JSON.parse(e.newValue||"{}");
      if(m.type==="elimination") instantElimination(m.data);
      else update({forceEvents:true});
    }catch(_){
      update({forceEvents:true});
    }
  });
}catch(e){
  console.warn("Live trigger unavailable:", e);
}
</script>
