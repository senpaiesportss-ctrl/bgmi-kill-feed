<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920,height=1080">
<title>BGMI Esports Overlay</title>

<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:transparent;
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
}

#stage{
  position:relative;
  width:1920px;
  height:1080px;
  transform-origin:top left;
}

@media(max-width:1920px){
  #stage{
    transform:scale(calc(100vw / 1920));
  }
}

@media(max-height:1080px){
  #stage{
    transform:scale(
      min(
        calc(100vw / 1920),
        calc(100vh / 1080)
      )
    );
  }
}

:root{
  --blue:#087dff;
  --cyan:#19cfff;
  --gold:#ffd52b;
  --panel:rgba(4,10,22,.95);
  --muted:#93a9c7;
}

/* =========================================================
   TOP BAR
========================================================= */

.topbar{
  position:absolute;

  left:50%;
  top:24px;

  width:520px;
  height:54px;

  transform:translateX(-50%);

  display:flex;
  align-items:center;
  justify-content:center;

  gap:15px;

  padding:0 22px;

  background:
    linear-gradient(
      90deg,
      rgba(5,12,26,.98),
      rgba(7,18,38,.96),
      rgba(5,12,26,.98)
    );

  border:1px solid rgba(25,170,255,.45);

  clip-path:
    polygon(
      4% 0,
      96% 0,
      100% 50%,
      96% 100%,
      4% 100%,
      0 50%
    );

  box-shadow:
    0 0 18px rgba(0,150,255,.22);
}

.live{
  display:flex;
  align-items:center;

  gap:8px;

  background:#c91525;

  padding:7px 13px;

  font-size:15px;
  font-weight:1000;

  letter-spacing:2px;
}

.live i{
  width:8px;
  height:8px;

  background:#fff;

  border-radius:50%;

  box-shadow:0 0 9px #fff;
}

.matchblock{
  line-height:1;
  white-space:nowrap;
}

.matchtitle{
  font-size:20px;
  font-weight:1000;
  letter-spacing:1px;
}

.group{
  color:var(--gold);

  font-size:13px;
  font-weight:1000;

  margin-left:6px;

  letter-spacing:1.5px;

.day{
  color:#8fa9c8;

.map{
  color:#8fa9c8;

  font-size:9px;

  letter-spacing:1px;

/* =========================================================
   KILL FEED
========================================================= */

.feed{
  position:absolute;

  left:22px;
  top:82px;

  width:370px;

  background:var(--panel);

  border:1px solid rgba(25,170,255,.55);

  box-shadow:
    0 0 18px rgba(0,150,255,.22);
}

.feedHeader{
  height:38px;

  display:flex;
  align-items:center;

  padding:0 12px;

  border-bottom:
    1px solid rgba(25,170,255,.35);

  font-size:13px;
  font-weight:1000;

  letter-spacing:1.5px;
}

.feedHeader:before{

  width:3px;
  height:17px;

  margin-right:8px;

  background:var(--cyan);

  box-shadow:
    0 0 8px var(--cyan);
}

#feedRows{
  padding:7px;
}

.kill{
  height:47px;

  display:grid;

  grid-template-columns:
    30px
    minmax(0,1fr)
    48px
    minmax(0,1fr)
    30px;

  align-items:center;

  gap:5px;

  margin-bottom:5px;

  padding:0 5px;

  background:
    linear-gradient(

      rgba(12,28,49,.95),
      rgba(7,14,27,.90)

}

.logo{

  height:27px;

  object-fit:contain;

  background:transparent;
}

.killer{
  text-align:right;

  font-size:9px;
  font-weight:1000;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.victim{
  text-align:left;

  font-size:9px;
  font-weight:1000;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.weapon{
  text-align:center;

  color:var(--gold);

  font-size:8px;
  font-weight:1000;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.waiting{
  height:48px;

  align-items:center;
  justify-content:center;

  font-size:9px;
  font-weight:1000;

  background:var(--panel);

}

.pointsHeader{
  height:46px;

  display:flex;
  align-items:center;

  padding:0 12px;

}

.pointsHeader:before{

.pointsTitle{

  font-weight:1000;

}

.pointsMini{
  color:#7797bd;

  font-size:8px;
  font-weight:900;

  margin-top:3px;

  letter-spacing:1px;
}

.liveTag{
  margin-left:auto;

  color:#ff5360;

  font-size:8px;
  font-weight:1000;

  letter-spacing:1px;
}

.columns,
.row{
  display:grid;

  grid-template-columns:
    28px
    1fr
    48px
    68px
    55px;

  align-items:center;
}

.columns{
  height:27px;

  color:#7797bd;

  font-size:8px;
  font-weight:1000;

  border-bottom:
    1px solid rgba(255,255,255,.08);
}

.columns div{
  text-align:center;
}

.columns div:nth-child(2){
  text-align:left;
}

#table{
  padding:5px 7px 7px;
}

.row{
  height:38px;

  margin:2px 0;

  padding:0 5px;

  background:
    linear-gradient(
      90deg,
      rgba(9,23,43,.95),
      rgba(7,14,28,.72)

}

.row:first-child{

  background:

.rank{

  font-size:10px;
  font-weight:1000;

}

.row:first-child .rank{
  color:var(--gold);
}

.team{
  display:flex;
  align-items:center;

  gap:7px;

  min-width:0;
}

.team img{
  width:27px;
  height:27px;

  object-fit:contain;
}

.teamName{
  min-width:0;

  font-size:9px;
  font-weight:1000;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.num{
  text-align:center;

  font-size:10px;
  font-weight:1000;
}

.pts{
  text-align:center;

  color:var(--gold);

  font-size:12px;
  font-weight:1000;
}

.noData{
  height:50px;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#6684a8;

  font-size:9px;
  font-weight:1000;

  letter-spacing:2px;
}


/* =========================================================
   TEAM ELIMINATED
========================================================= */

#elimBanner{
  position:absolute;

  left:50%;
  top:92px;

  transform:translateX(-50%);

  width:720px;
  height:120px;

  display:none;

  align-items:center;
  justify-content:center;

  background:
    linear-gradient(

}

#elimLogo{

#elimTag{

  left:150px;

  text-align:center;

  color:#ff304e;

  font-size:9px;
  font-weight:1000;

  letter-spacing:3px;
}

#elimName{
  position:absolute;

  left:150px;
  right:90px;
  top:68px;

  transform:translateY(-50%);

  text-align:center;

  color:#fff;

  font-size:23px;
  font-weight:1000;

  letter-spacing:1.2px;

  text-shadow:
    0 2px 8px #000;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;

/* =========================================================

========================================================= */

#status{
  position:absolute;

  left:22px;
  bottom:25px;

  color:#587594;

  font-size:9px;
  font-weight:800;

  letter-spacing:1.5px;
}
</style>

<body>

<div id="stage">

<section class="points">

  CONNECTING...

<script>

/* =========================================================
   SUPABASE
========================================================= */

const CFG =
  window.KF_CONFIG || {};

const SUPABASE_URL =
  CFG.SUPABASE_URL ||
  "https://nuywberanlfvngjnjcpx.supabase.co";

const SUPABASE_KEY =
  CFG.SUPABASE_PUBLISHABLE_KEY || "";

const ROOM =
  localStorage.getItem("kf_room") ||
  "ADITYA8029";

const sb =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

const $ =
  id => document.getElementById(id);


/* =========================================================
   HELPERS
========================================================= */

function esc(value){

  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      x => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[x])
    );

}

function arr(value){

  return Array.isArray(value)
    ? value
    : [];

}


/* =========================================================
   RPC
========================================================= */

async function rpc(
  name,
  params
){

  const r =
    await sb.rpc(
      name,
      params
    );

  if(r.error)
    throw r.error;

  return r.data;
}


async function getState(){

  return rpc(
    "kf_get_state",
    {
      p_room_code:ROOM
    }
  );

}


async function getEvents(){

  return rpc(
    "kf_events",
    {
      p_room_code:ROOM
    }
  );

}


/* =========================================================
   TEAM DATA
========================================================= */

function teamsFromConfig(c){

  const t =
    c?.teams;

  if(Array.isArray(t))
    return t;


  if(
    t &&
    typeof t === "object"
  ){

    return Object.entries(t)
      .map(
        ([key,val]) => {

          if(
            val &&
            typeof val === "object"
          ){

            return {
              ...val,

              name:
                val.name ||
                key,

              short:
                val.short ||
                val.tag ||
                key
            };

          }

          return {
            name:key,
            short:key
          };

        }
      );

  }

  return [];
}


function teamName(t){

  return (
    t?.name ||
    t?.team ||
    t?.short ||
    t?.tag ||
    "UNKNOWN"
  );

}


function teamShort(t){

  return (
    t?.short ||
    t?.tag ||
    t?.abbr ||
    teamName(t)
  );

}


function teamLogo(t){

  return (
    t?.logo ||
    t?.logo_url ||
    t?.image ||
    t?.image_url ||
    ""
  );

}


function teamPlayers(t){

  const p =
    t?.players ??
    t?.members ??
    t?.roster ??
    [];

  if(Array.isArray(p)){

    return p
      .map(
        x =>
          typeof x === "string"
          ? x
          : (
              x?.name ||
              x?.ign ||
              x?.player ||
              ""
            )
      )
      .filter(Boolean);

  }


  if(
    p &&
    typeof p === "object"
  ){

    return Object.values(p)
      .map(
        x =>
          typeof x === "string"
          ? x
          : (
              x?.name ||
              x?.ign ||
              x?.player ||
              ""
            )
      )
      .filter(Boolean);

  }

  return [];
}


/* =========================================================
   PLAYER -> TEAM
========================================================= */

function findTeam(
  c,
  player
){

  const p =
    String(player || "")
      .trim()
      .toLowerCase();

  if(!p)
    return null;


  const all =
    teamsFromConfig(c);


  /* EXACT MATCH */

  const exact =
    all.find(
      t =>
        teamPlayers(t)
          .some(
            x =>
              String(x)
                .trim()
                .toLowerCase()
              === p
          )
    );


  if(exact)
    return exact;


  /* PARTIAL MATCH */

  const partial =
    all.find(
      t =>
        teamPlayers(t)
          .some(
            x => {

              const a =
                p;

              const b =
                String(x)
                  .trim()
                  .toLowerCase();

              return (
                a.includes(b) ||
                b.includes(a)
              );

            }
          )
    );


  return partial || null;
}


/* =========================================================
   EVENT HELPERS
========================================================= */

function eventKiller(e){

  return (
    e?.killer ||
    e?.p_killer ||
    e?.killer_name ||
    e?.attacker ||
    e?.killerName ||
    e?.data?.killer ||
    ""
  );

}


function eventVictim(e){

  return (
    e?.victim ||
    e?.p_victim ||
    e?.victim_name ||
    e?.target ||
    e?.victimName ||
    e?.data?.victim ||
    ""
  );

}


function eventWeapon(e){

  return (
    e?.weapon ||
    e?.p_weapon ||
    e?.weapon_name ||
    e?.weaponName ||
    e?.data?.weapon ||
    "GUN"
  );

}


function eventTime(e){

  return (
    e?.created_at ||
    e?.time ||
    e?.timestamp ||
    e?.createdAt ||
    ""
  );

}


/* =========================================================
   NORMALIZE EVENTS
========================================================= */

function normalizeEvents(raw){

  if(Array.isArray(raw))
    return raw;


  if(
    raw &&
    Array.isArray(raw.events)
  )
    return raw.events;


  if(
    raw &&
    Array.isArray(raw.data)
  )
    return raw.data;


  if(
    raw &&
    Array.isArray(raw.result)
  )
    return raw.result;


  return [];
}


/* =========================================================
   UNIQUE CURRENT EVENTS
========================================================= */

function eventKey(e){

  /*
    IMPORTANT FIX:

    We DO NOT use localStorage anymore.

    Every event gets one unique key.
  */

  if(
    e?.id !== undefined &&
    e?.id !== null
  ){

    return "ID:" +
      String(e.id);

  }


  return [
    eventTime(e),
    eventKiller(e),
    eventVictim(e),
    eventWeapon(e)
  ].join("|");

}


function uniqueEvents(raw){

  const source =
    normalizeEvents(raw);

  const seen =
    new Set();

  const result = [];

  for(
    const e of source
  ){

    const key =
      eventKey(e);

    if(
      seen.has(key)
    )
      continue;

    seen.add(key);

    result.push(e);

  }

  return result;
}


/* =========================================================
   KILL FEED
========================================================= */

function renderFeed(
  c,
  rawEvents
){

  const events =
    uniqueEvents(
      rawEvents
    );


  const rows =
    events.slice(0,7);


  if(!rows.length){

    $("feedRows").innerHTML =
      `
      <div class="waiting">
        WAITING FOR KILLS...
      </div>
      `;

    return;
  }


  $("feedRows").innerHTML =
    rows.map(
      e => {

        const killer =
          eventKiller(e);

        const victim =
          eventVictim(e);

        const weapon =
          eventWeapon(e);


        const killerTeam =
          findTeam(
            c,
            killer
          );

        const victimTeam =
          findTeam(
            c,
            victim
          );


        const killerLogo =
          teamLogo(
            killerTeam
          );

        const victimLogo =
          teamLogo(
            victimTeam
          );


        return `

        <div class="kill">

          ${
            killerLogo
            ?
            `
            <img
              class="logo"
              src="${esc(killerLogo)}"
              onerror="
                this.style.visibility='hidden'
              "
            >
            `
            :
            `<div></div>`
          }


          <div
            class="killer"
            title="${esc(killer)}">

            ${esc(
              killer ||
              "UNKNOWN"
            )}

          </div>


          <div
            class="weapon"
            title="${esc(weapon)}">

            ${esc(
              weapon
            )}

          </div>


          <div
            class="victim"
            title="${esc(victim)}">

            ${esc(
              victim ||
              "UNKNOWN"
            )}

          </div>


          ${
            victimLogo
            ?
            `
            <img
              class="logo"
              src="${esc(victimLogo)}"
              onerror="
                this.style.visibility='hidden'
              "
            >
            `
            :
            `<div></div>`
          }

        </div>

        `;

      }
    ).join("");

}


/* =========================================================
   CURRENT KILL COUNTS
========================================================= */

function calculateKills(
  c,
  rawEvents
){

  const counts = {};

  const events =
    uniqueEvents(
      rawEvents
    );


  /*
    IMPORTANT FIX:

    Count directly from the events returned
    by Supabase.

    NO localStorage.
    NO old match totals.
    NO 514 carry-over.
  */

  events.forEach(
    e => {

      const killer =
        eventKiller(e);


      const team =
        findTeam(
          c,
          killer
        );


      if(!team)
        return;


      const name =
        teamName(team);


      counts[name] =
        (counts[name] || 0) + 1;

    }
  );


  return counts;
}


/* =========================================================
   NUMBERS
========================================================= */

function num(
  value,
  fallback=0
){

  const n =
    Number(value);

  return Number.isFinite(n)
    ? n
    : fallback;

}


function placementPoints(t){

  return num(
    t?.placement ??
    t?.placement_points ??
    t?.place_points ??
    0
  );

}


/* =========================================================
   POINTS TABLE
========================================================= */

function renderTable(
  c,
  rawEvents
){

  const teams =
    teamsFromConfig(c);


  if(!teams.length){

    $("table").innerHTML =
      `
      <div class="noData">
        NO TEAM DATA
      </div>
      `;

    return;
  }


  const killCounts =
    calculateKills(
      c,
      rawEvents
    );


  const rows =
    teams.map(
      (t,index) => {

        const name =
          teamName(t);


        const kills =
          killCounts[name] || 0;


        const placement =
          placementPoints(t);


        const total =
          kills +
          placement;


        return {

          t,

          name,

          kills,

          placement,

          total,

          index

        };

      }
    );


  rows.sort(
    (a,b) =>
      b.total -
      a.total ||

      b.kills -
      a.kills ||

      a.index -
      b.index
  );


  $("table").innerHTML =
    rows
      .slice(0,16)
      .map(
        (r,index) => {

          const logo =
            teamLogo(r.t);


          return `

          <div class="row">

            <div class="rank">
              ${index + 1}
            </div>


            <div class="team">

              ${
                logo
                ?
                `
                <img
                  src="${esc(logo)}"
                  onerror="
                    this.style.visibility='hidden'
                  "
                >
                `
                :
                ""
              }


              <div
                class="teamName"
                title="${esc(r.name)}">

                ${esc(
                  teamShort(r.t)
                )}

              </div>

            </div>


            <div class="num">
              ${r.kills}
            </div>


            <div class="num">
              ${r.placement}
            </div>


            <div class="pts">
              ${r.total}
            </div>

          </div>

          `;

        }
      )
      .join("");

}


/* =========================================================
   BROADCAST
========================================================= */

function broadcast(c){

  const b =
    c?.broadcast || {};


  return {

    match:
      b.match ||
      c?.match ||
      c?.match_name ||
      "MATCH 1",


    group:
      b.group ||
      c?.group ||
      c?.group_name ||
      "GROUP A × B",


    day:
      b.day ||
      c?.day ||
      "DAY 1",


    map:
      b.map ||
      c?.map ||
      "ERANGEL"

  };

}


/* =========================================================
   TEAM ELIMINATION
========================================================= */

function isEliminated(t){

  if(
    t?.eliminated === true
  )
    return true;


  if(
    t?.is_eliminated === true
  )
    return true;


  if(
    String(
      t?.status || ""
    ).toLowerCase()
    === "eliminated"
  )
    return true;


  const alive =
    t?.alive ??
    t?.alive_count ??
    t?.players_alive ??
    t?.alivePlayers;


  if(
    alive !== undefined &&
    alive !== null &&
    alive !== ""
  ){

    if(
      Number(alive) <= 0
    )
      return true;

  }


  return false;
}


const shownElims =
  new Set();

let elimTimer =
  null;


function showElimination(t){

  const logo =
    teamLogo(t);


  if(logo){

    $("elimLogo").src =
      logo;

    $("elimLogo")
      .style.visibility =
      "visible";

  }else{

    $("elimLogo")
      .style.visibility =
      "hidden";

  }


  $("elimName")
    .textContent =
    teamName(t);


  $("elimBanner")
    .style.display =
    "flex";


  clearTimeout(
    elimTimer
  );


  elimTimer =
    setTimeout(
      () => {

        $("elimBanner")
          .style.display =
          "none";

      },
      5000
    );

}


function checkEliminations(c){

  const all =
    teamsFromConfig(c);


  all.forEach(
    t => {

      if(
        !isEliminated(t)
      )
        return;


      const name =
        teamName(t);


      if(
        shownElims.has(name)
      )
        return;


      shownElims.add(name);


      showElimination(t);

    }
  );

}


/* =========================================================
   MAIN LOOP
========================================================= */

let updating =
  false;


async function update(){

  if(updating)
    return;


  updating = true;


  try{

    const [
      state,
      rawEvents
    ] =
      await Promise.all([

        getState(),

        getEvents()

      ]);


    /*
      kf_get_state may return config
      directly OR wrapped.
    */

    const c =
      state?.config ??
      state?.state ??
      state;


    const events =
      normalizeEvents(
        rawEvents
      );


    /* BROADCAST */

    const b =
      broadcast(c);


    $("matchTitle")
      .textContent =
      b.match;


    $("groupTitle")
      .textContent =
      b.group;


    $("dayTitle")
      .textContent =
      b.day;


    $("mapTitle")
      .textContent =
      b.map;


    $("pointsMap")
      .textContent =
      b.map;


    /* KILL FEED */

    renderFeed(
      c,
      events
    );


    /* POINTS */

    renderTable(
      c,
      events
    );


    /* ELIMINATION */

    checkEliminations(c);


    $("status")
      .textContent =
      "LIVE SYNC • ROOM " +
      ROOM +
      " • AUTO UPDATE";


  }catch(error){

    console.error(
      "BGMI OVERLAY ERROR:",
      error
    );


    $("status")
      .textContent =
      "LIVE DATA CONNECTION ERROR • RETRYING...";

  }


  updating = false;
}


/* =========================================================
   START
========================================================= */

update();

setInterval(
  update,
  1000
);

</script>
