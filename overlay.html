<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BGMI Broadcast Overlay</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  background:transparent!important;
  font-family:Arial,Helvetica,sans-serif;color:#fff
}
#stage{
  position:relative;width:1920px;height:1080px;
  background:transparent;overflow:hidden
}

/* ================= TOP ================= */

.top{
  position:absolute;
  top:16px;left:50%;
  transform:translateX(-50%);
  height:42px;
  padding:0 25px;
  min-width:430px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:13px;
  background:rgba(2,10,21,.78);
  border:1px solid rgba(0,166,255,.65);
  box-shadow:0 0 16px rgba(0,130,255,.18);
  clip-path:polygon(4% 0,96% 0,100% 50%,96% 100%,4% 100%,0 50%);
  z-index:50
}
.dot{
  width:8px;height:8px;border-radius:50%;
  background:#ff2348;
  box-shadow:0 0 10px #ff2348;
  animation:p 1s infinite
}
@keyframes p{50%{opacity:.3}}
.match{font-size:16px;font-weight:900;letter-spacing:1px}
.gold{color:#ffd800}
.meta{font-size:11px;color:#86afd0;font-weight:900}

/* ================= KILL FEED ================= */

.killPanel{
  position:absolute;
  left:18px;top:78px;
  width:360px;
  background:rgba(2,10,20,.58);
  border-left:2px solid rgba(0,153,255,.6);
  border-right:1px solid rgba(0,153,255,.28);
  border-top:1px solid rgba(0,153,255,.4);
  border-bottom:1px solid rgba(0,153,255,.25);
  overflow:hidden
}

.feedTitle{
  height:35px;
  display:flex;
  align-items:center;
  padding:0 11px;
  background:rgba(3,20,39,.75);
  border-bottom:1px solid rgba(0,145,255,.3);
  font-size:12px;
  font-weight:900;
  letter-spacing:1.5px
}
.bar{
  width:3px;height:16px;
  margin-right:8px;
  background:#00aaff;
  box-shadow:0 0 8px #00aaff
}
#feed{padding:7px}

.kill{
  position:relative;
  height:50px;
  margin-bottom:5px;
  display:grid;
  grid-template-columns:34px minmax(0,1fr) 42px minmax(0,1fr) 34px;
  align-items:center;
  padding:2px 5px;
  background:rgba(3,17,33,.72);
  border-bottom:1px solid rgba(0,145,255,.20);
  animation:kin .25s ease
}
@keyframes kin{
  from{opacity:0;transform:translateX(-10px)}
  to{opacity:1;transform:none}
}
.killLogo{
  width:29px;height:29px;
  object-fit:contain;
  padding:1px;
  background:transparent;
  border:0
}
.player{
  min-width:0;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  font-size:10px;
  font-weight:900
}
.killer{text-align:right;padding-right:6px}
.victim{padding-left:6px}
.weapon{text-align:center;color:#ffd800}
.weaponIcon{font-size:17px;line-height:17px}
.weaponName{
  font-size:6px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}
.killTime{
  position:absolute;
  right:3px;bottom:1px;
  color:#567895;font-size:6px
}
.wait{
  height:65px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#55738d;
  font-size:9px;
  font-weight:900;
  letter-spacing:1px
}

/* ================= POINTS TABLE ================= */

.points{
  position:absolute;
  right:17px;top:150px;
  width:325px;
  background:rgba(2,10,20,.66);
  border:1px solid rgba(0,153,255,.5);
  box-shadow:0 0 15px rgba(0,100,255,.10);
  overflow:hidden
}
.pointsTitle{
  height:38px;
  display:flex;
  align-items:center;
  padding:0 11px;
  background:rgba(3,22,43,.82);
  border-bottom:1px solid rgba(0,145,255,.3);
  font-size:12px;
  font-weight:900;
  letter-spacing:1.2px
}
.head,.row{
  display:grid;
  grid-template-columns:25px 1fr 42px 62px 65px;
  align-items:center
}
.head{
  height:27px;
  padding:0 7px;
  background:rgba(3,17,33,.85);
  color:#79a7c9;
  font-size:7px;
  font-weight:900
}
.row{
  position:relative;
  height:39px;
  padding:0 7px;
  border-bottom:1px solid rgba(90,140,180,.10);
  background:rgba(2,12,24,.58);
  font-size:9px;
  font-weight:900
}
.row:nth-child(even){background:rgba(5,21,39,.62)}
.rank{font-size:11px;color:#88a8c2}
.team{
  min-width:0;
  display:flex;
  align-items:center;
  gap:6px
}
.tableLogo{
  width:25px;height:25px;
  object-fit:contain;
  background:transparent;
  padding:1px
}
.teamName{
  min-width:0;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis
}
.stat{text-align:center}
.total{color:#ffd800;font-size:12px}
.r1{
  background:rgba(255,216,0,.09)!important
}
.r1:before,.r2:before,.r3:before{
  content:"";
  position:absolute;
  left:0;top:0;bottom:0;width:3px
}
.r1:before{background:#ffd800;box-shadow:0 0 8px #ffd800}
.r2:before{background:#cbd5df}
.r3:before{background:#bd7b42}
.dead{opacity:.38;background:rgba(170,10,30,.12)!important}
.dead .teamName{text-decoration:line-through;color:#808c96}
.elimTag{
  position:absolute;
  right:3px;bottom:1px;
  color:#ff3152;font-size:5px
}

/* ================= ELIMINATION ================= */

#elim{
  display:none;
  position:absolute;
  top:70px;left:50%;
  transform:translateX(-50%);
  min-width:500px;height:62px;
  align-items:center;
  padding:0 16px;
  background:rgba(12,3,8,.93);
  border:1px solid #ff2448;
  box-shadow:0 0 22px rgba(255,20,60,.45);
  z-index:100;
  animation:ein .4s ease
}
@keyframes ein{
  from{opacity:0;transform:translate(-50%,-18px)}
  to{opacity:1;transform:translate(-50%,0)}
}
.elimLogo{
  width:43px;height:43px;
  object-fit:contain;
  margin-right:12px
}
.elimSmall{
  color:#ff3152;
  font-size:7px;font-weight:900;
  letter-spacing:2px
}
.elimTeam{
  margin-top:2px;
  font-size:17px;font-weight:1000
}
.elimWord{
  margin-left:auto;
  color:#ff2448;
  font-size:18px;font-weight:1000
}
</style>
</head>

<body>
<div id="stage">

  <!-- TOP -->
  <div class="top">
    <span class="dot"></span>
    <span class="match">
      <span id="matchTitle">MATCH 1</span>
      <span> | </span>
      <span id="groupTitle" class="gold">GROUP A × B</span>
    </span>
    <span id="dayTitle" class="meta">DAY 1</span>
    <span id="mapTitle" class="meta">ERANGEL</span>
  </div>

  <!-- KILL FEED -->
  <section class="killPanel">
    <div class="feedTitle">
      <span class="bar"></span>
      KILL FEED
    </div>
    <div id="feed">
      <div class="wait">WAITING FOR KILLS...</div>
    </div>
  </section>

  <!-- POINTS -->
  <section class="points">

    <div class="pointsTitle">
      <span class="bar"></span>
      LIVE POINTS TABLE
    </div>

    <div class="head">
      <div>#</div>
      <div>TEAM</div>
      <div class="stat">KILLS</div>
      <div class="stat">PLACEMENT</div>
      <div class="stat">TOTAL</div>
    </div>

    <div id="table"></div>

  </section>

  <!-- ELIMINATION -->
  <div id="elim">

    <img id="elimLogo" class="elimLogo">

    <div>
      <div class="elimSmall">TEAM ELIMINATED</div>
      <div id="elimTeam" class="elimTeam">TEAM</div>
    </div>

    <div class="elimWord">ELIMINATED</div>

  </div>

</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>

/* =========================================================
   HELPERS
========================================================= */

const $=id=>document.getElementById(id);

const FALLBACK=
"data:image/svg+xml;charset=UTF-8,"+
encodeURIComponent(`
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100">
<text x="50" y="60" text-anchor="middle"
fill="#527895" font-size="30">—</text>
</svg>`);

function esc(v){
  return String(v??"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


/* =========================================================
   TEAMS
========================================================= */

function getTeams(c){

  const t=c?.teams;

  if(Array.isArray(t))
    return t;

  if(t && typeof t==="object"){
    return Object.entries(t).map(([k,v])=>{
      if(v && typeof v==="object")
        return {...v,name:v.name||k};
      return {name:k};
    });
  }

  return [];
}

function teamName(t){
  return t?.name ||
         t?.team ||
         t?.short ||
         t?.tag ||
         "UNKNOWN";
}

function teamLogo(t){
  return t?.logo ||
         t?.logo_url ||
         t?.image ||
         t?.image_url ||
         FALLBACK;
}

function players(t){

  const p=t?.players||
          t?.members||
          t?.roster||
          [];

  if(Array.isArray(p))
    return p.map(x=>
      typeof x==="string"
      ?x
      :(x?.name||x?.ign||x?.player||"")
    ).filter(Boolean);

  return [];
}


/* =========================================================
   FIND TEAM
========================================================= */

function findTeam(c,name){

  if(!name)return null;

  const target=
    String(name).trim().toLowerCase();

  for(const t of getTeams(c)){

    const aliases=[
      teamName(t),
      t?.short,
      t?.tag,
      t?.abbr,
      ...players(t)
    ].filter(Boolean);

    if(
      aliases.some(x=>
        String(x).trim().toLowerCase()
        ===target
      )
    ){
      return t;
    }
  }

  return null;
}


/* =========================================================
   EVENT DATA
========================================================= */

function killer(e){
  return e?.killer||
         e?.killer_name||
         e?.p_killer||
         e?.attacker||
         "";
}

function victim(e){
  return e?.victim||
         e?.victim_name||
         e?.p_victim||
         e?.target||
         "";
}

function weapon(e){
  return e?.weapon||
         e?.weapon_name||
         e?.p_weapon||
         "GUN";
}

function timeOf(e){
  return e?.time||
         e?.created_at||
         e?.timestamp||
         "";
}


/* =========================================================
   WEAPON ICON
========================================================= */

function weaponIcon(w){

  w=String(w||"").toLowerCase();

  if(
    w.includes("awm")||
    w.includes("kar")||
    w.includes("m24")||
    w.includes("sniper")
  )return "🎯";

  if(
    w.includes("grenade")||
    w.includes("frag")
  )return "💥";

  if(
    w.includes("uzi")||
    w.includes("ump")||
    w.includes("vector")||
    w.includes("smg")
  )return "⚡";

  return "🔫";
}


/* =========================================================
   KILL TOTAL MEMORY
========================================================= */

const ROOM=
  localStorage.getItem("kf_room")
  ||"ADITYA8029";

const KILL_KEY=
  "bgmi_kills_"+ROOM;

let totals={};

try{
  totals=
    JSON.parse(
      localStorage.getItem(KILL_KEY)||"{}"
    )||{};
}catch{
  totals={};
}

function saveTotals(){

  try{
    localStorage.setItem(
      KILL_KEY,
      JSON.stringify(totals)
    );
  }catch{}

}

function collectKills(c,events){

  if(!Array.isArray(events))
    return;

  for(const e of events){

    const id=
      String(
        e?.id||
        (
          timeOf(e)+"|"+
          killer(e)+"|"+
          victim(e)
        )
      );

    if(totals[id])
      continue;

    const t=
      findTeam(c,killer(e));

    if(!t)
      continue;

    const name=
      teamName(t);

    totals[id]=name;

  }

  saveTotals();
}

function teamKills(t){

  const name=teamName(t);

  let count=0;

  for(const id in totals){

    if(
      totals[id]===name
    ){
      count++;
    }

  }

  if(
    t?.kills!==undefined &&
    count===0
  ){
    return Number(t.kills)||0;
  }

  return count;
}


/* =========================================================
   PLACEMENT
========================================================= */

function placement(t){

  return Number(
    t?.placement||
    t?.placement_points||
    t?.finish||
    t?.finish_points||
    t?.place_points||
    t?.position_points||
    0
  )||0;

}


/* =========================================================
   TOTAL
========================================================= */

function totalPoints(t,kills){

  if(
    t?.total_points!==undefined
  ){
    return Number(
      t.total_points
    )||0;
  }

  if(
    t?.points!==undefined
  ){
    return Number(
      t.points
    )||0;
  }

  return kills+placement(t);
}


/* =========================================================
   KILL FEED
========================================================= */

function renderFeed(c,events){

  const box=$("feed");

  if(
    !Array.isArray(events)||
    !events.length
  ){

    box.innerHTML=
      `<div class="wait">
        WAITING FOR KILLS...
      </div>`;

    return;
  }

  const list=
    [...events]
    .sort((a,b)=>
      new Date(timeOf(b)||0)-
      new Date(timeOf(a)||0)
    )
    .slice(0,6);


  box.innerHTML=
    list.map(e=>{

      const k=killer(e);
      const v=victim(e);
      const w=weapon(e);

      const kt=findTeam(c,k);
      const vt=findTeam(c,v);

      let tm="";

      if(timeOf(e)){

        const d=
          new Date(timeOf(e));

        if(!isNaN(d)){

          tm=d.toLocaleTimeString(
            [],
            {
              hour:"2-digit",
              minute:"2-digit",
              second:"2-digit"
            }
          );

        }

      }


      return `
        <div class="kill">

          <img
            class="killLogo"
            src="${esc(teamLogo(kt))}"
            onerror="
              this.src='${esc(FALLBACK)}'
            "
          >

          <div class="player killer">
            ${esc(k||"UNKNOWN")}
          </div>

          <div class="weapon">
            <div class="weaponIcon">
              ${weaponIcon(w)}
            </div>
            <div class="weaponName">
              ${esc(w)}
            </div>
          </div>

          <div class="player victim">
            ${esc(v||"UNKNOWN")}
          </div>

          <img
            class="killLogo"
            src="${esc(teamLogo(vt))}"
            onerror="
              this.src='${esc(FALLBACK)}'
            "
          >

          <div class="killTime">
            ${esc(tm)}
          </div>

        </div>
      `;

    }).join("");

}


/* =========================================================
   ELIMINATION
========================================================= */

let oldElims=new Set();

function eliminated(t){

  return(
    t?.eliminated===true||
    t?.is_eliminated===true||
    String(t?.status||"")
      .toLowerCase()==="eliminated"
  );

}

function checkElimination(c){

  const now=new Set();

  for(const t of getTeams(c)){

    if(!eliminated(t))
      continue;

    const name=teamName(t);

    now.add(name);

    if(!oldElims.has(name))
      showElimination(t);

  }

  oldElims=now;
}

let elimTimer;

function showElimination(t){

  $("elimLogo").src=
    teamLogo(t);

  $("elimTeam").textContent=
    teamName(t);

  $("elim").style.display=
    "flex";

  clearTimeout(elimTimer);

  elimTimer=
    setTimeout(()=>{
      $("elim").style.display=
        "none";
    },5000);

}


/* =========================================================
   POINTS TABLE
========================================================= */

function renderTable(c){

  const box=$("table");

  let rows=
    getTeams(c).map(t=>{

      const kills=
        teamKills(t);

      const placementPts=
        placement(t);

      const total=
        totalPoints(
          t,
          kills
        );

      return{
        t,
        kills,
        placement:placementPts,
        total,
        eliminated:eliminated(t)
      };

    });


  rows.sort((a,b)=>{

    if(b.total!==a.total)
      return b.total-a.total;

    return b.kills-a.kills;

  });


  rows=rows.slice(0,16);


  box.innerHTML=
    rows.map((r,i)=>{

      let rank="";

      if(i===0)rank="r1";
      if(i===1)rank="r2";
      if(i===2)rank="r3";


      return `
        <div class="
          row ${rank}
          ${r.eliminated?"dead":""}
        ">

          <div class="rank">
            ${i+1}
          </div>

          <div class="team">

            <img
              class="tableLogo"
              src="${esc(teamLogo(r.t))}"
              onerror="
                this.src='${esc(FALLBACK)}'
              "
            >

            <div class="teamName">
              ${esc(teamName(r.t))}
            </div>

            ${
              r.eliminated
              ?
              `<div class="elimTag">
                ELIMINATED
              </div>`
              :""
            }

          </div>

          <div class="stat">
            ${r.kills}
          </div>

          <div class="stat">
            ${r.placement}
          </div>

          <div class="stat total">
            ${r.total}
          </div>

        </div>
      `;

    }).join("");

}


/* =========================================================
   BROADCAST
========================================================= */

function renderBroadcast(c){

  const b=c?.broadcast||{};

  $("matchTitle").textContent=
    b.match||
    c?.match||
    "MATCH 1";

  $("groupTitle").textContent=
    b.group||
    c?.group||
    "GROUP A × B";

  $("dayTitle").textContent=
    b.day||
    c?.day||
    "DAY 1";

  $("mapTitle").textContent=
    b.map||
    c?.map||
    "ERANGEL";

}


/* =========================================================
   UPDATE
========================================================= */

async function update(){

  try{

    const state=
      await getState();

    const events=
      await getEvents();

    renderBroadcast(state);

    collectKills(
      state,
      events
    );

    renderFeed(
      state,
      events
    );

    renderTable(
      state
    );

    checkElimination(
      state
    );

  }catch(err){

    console.error(
      "OVERLAY:",
      err
    );

  }

}

update();

setInterval(
  update,
  1000
);

</script>

</body>
</html>
