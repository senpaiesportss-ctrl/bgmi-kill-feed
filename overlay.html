<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BGMI Esports Overlay</title>

<style>

/* =========================================================
   GLOBAL
========================================================= */

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:transparent;
  font-family:Inter,Segoe UI,Arial,sans-serif;
  color:#fff;
}

body{
  user-select:none;
}

#stage{
  position:relative;
  width:1920px;
  height:1080px;
  transform-origin:top left;
  overflow:hidden;
}

@media(max-width:1920px){
  #stage{
    transform:scale(calc(100vw / 1920));
  }
}

@media(max-height:1080px){
  #stage{
    transform:scale(
      min(
        calc(100vw / 1920),
        calc(100vh / 1080)
      )
    );
  }
}


/* =========================================================
   BACKGROUND
========================================================= */

.bg{
  position:absolute;
  inset:0;
  background:
    radial-gradient(
      circle at 50% 42%,
      rgba(0,110,255,.20),
      transparent 42%
    ),
    linear-gradient(
      180deg,
      rgba(2,8,18,.97),
      rgba(3,12,27,.98)
    );
}

.bg::before{
  content:"";
  position:absolute;
  inset:0;

  background:
    radial-gradient(
      ellipse at 15% 20%,
      rgba(0,125,255,.16),
      transparent 35%
    ),
    radial-gradient(
      ellipse at 85% 70%,
      rgba(0,110,255,.13),
      transparent 35%
    );
}

.bg::after{
  content:"";
  position:absolute;
  inset:0;

  background:
    repeating-linear-gradient(
      135deg,
      transparent 0px,
      transparent 80px,
      rgba(0,130,255,.025) 81px,
      transparent 82px
    );
}


/* =========================================================
   TOP BAR
========================================================= */

.topbar{
  position:absolute;
  left:28px;
  right:28px;
  top:24px;
  height:78px;

  display:flex;
  align-items:center;

  background:
    linear-gradient(
      90deg,
      rgba(2,8,17,.98),
      rgba(5,19,39,.97),
      rgba(2,8,17,.98)
    );

  border:1px solid rgba(0,157,255,.55);

  box-shadow:
    0 0 25px rgba(0,100,255,.20),
    inset 0 0 25px rgba(0,100,255,.06);

  clip-path:polygon(
    0 0,
    98% 0,
    100% 50%,
    98% 100%,
    0 100%,
    2% 50%
  );
}

.liveBox{
  width:190px;
  height:100%;

  display:flex;
  align-items:center;
  justify-content:center;
  gap:13px;

  font-size:24px;
  font-weight:900;
  letter-spacing:3px;
}

.liveDot{
  width:13px;
  height:13px;
  border-radius:50%;
  background:#ff2147;

  box-shadow:
    0 0 10px #ff2147,
    0 0 25px rgba(255,33,71,.7);

  animation:livePulse 1.1s infinite;
}

@keyframes livePulse{
  0%,100%{
    opacity:1;
    transform:scale(1);
  }
  50%{
    opacity:.45;
    transform:scale(.7);
  }
}

.matchInfo{
  flex:1;
  text-align:center;

  font-size:27px;
  font-weight:1000;
  letter-spacing:2px;
  color:#fff;
}

.matchInfo .gold{
  color:#ffd900;
}

.topRight{
  width:360px;
  height:100%;

  display:flex;
  justify-content:center;
  align-items:center;
  gap:18px;
}

.badge{
  padding:11px 25px;

  background:
    linear-gradient(
      180deg,
      #0b315d,
      #061a32
    );

  border:1px solid #168fff;

  color:#fff;
  font-size:18px;
  font-weight:900;
  letter-spacing:1px;

  clip-path:polygon(
    8% 0,
    100% 0,
    92% 100%,
    0 100%
  );

  box-shadow:
    0 0 15px rgba(0,120,255,.25);
}


/* =========================================================
   MAIN PANELS
========================================================= */

.main{
  position:absolute;
  left:30px;
  right:30px;
  top:130px;
  bottom:32px;

  display:grid;
  grid-template-columns: 47% 53%;
  gap:0;
}


/* =========================================================
   PANEL COMMON
========================================================= */

.panel{
  position:relative;

  background:
    linear-gradient(
      180deg,
      rgba(5,18,35,.97),
      rgba(2,10,22,.98)
    );

  border:1px solid rgba(0,140,255,.48);

  box-shadow:
    inset 0 0 35px rgba(0,100,255,.06),
    0 12px 35px rgba(0,0,0,.45);

  overflow:hidden;
}

.panel::before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:3px;

  background:
    linear-gradient(
      90deg,
      transparent,
      #00aaff,
      #fff,
      #00aaff,
      transparent
    );

  box-shadow:0 0 15px #008cff;
}

.panelTitle{
  position:relative;

  height:68px;

  display:flex;
  align-items:center;

  padding:0 25px;

  font-size:24px;
  font-weight:1000;
  letter-spacing:2px;

  background:
    linear-gradient(
      90deg,
      rgba(7,34,64,.95),
      rgba(4,15,30,.7)
    );

  border-bottom:1px solid rgba(0,140,255,.25);
}

.panelTitle::before{
  content:"";
  width:6px;
  height:30px;

  margin-right:14px;

  background:#00a8ff;

  box-shadow:0 0 15px #00a8ff;
}


/* =========================================================
   KILL FEED
========================================================= */

.feedPanel{
  border-right:none;
}

#feed{
  padding:17px;
}

.kill{
  position:relative;

  height:78px;
  margin-bottom:11px;

  display:grid;
  grid-template-columns:62px 1fr 100px 1fr 62px;
  align-items:center;

  padding:0 13px;

  background:
    linear-gradient(
      90deg,
      rgba(7,25,48,.98),
      rgba(3,13,27,.96)
    );

  border:1px solid rgba(0,120,220,.32);

  box-shadow:
    inset 0 0 15px rgba(0,100,255,.04);

  animation:killIn .35s ease-out;
}

.kill::before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:4px;

  background:#00a8ff;

  box-shadow:0 0 12px #008cff;
}

@keyframes killIn{
  from{
    opacity:0;
    transform:translateX(-30px);
  }
  to{
    opacity:1;
    transform:translateX(0);
  }
}

.teamLogo{
  width:49px;
  height:49px;

  object-fit:contain;

  border:1px solid rgba(0,160,255,.5);

  background:#020b16;

  padding:4px;
}

.player{
  min-width:0;

  font-size:18px;
  font-weight:900;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.player.killer{
  text-align:right;
  padding-right:15px;
}

.player.victim{
  text-align:left;
  padding-left:15px;
}

.weapon{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  color:#ffd900;

  font-size:13px;
  font-weight:900;
  letter-spacing:.5px;
}

.weaponIcon{
  font-size:25px;
  line-height:25px;
}

.weaponName{
  margin-top:2px;
  font-size:10px;
  opacity:.85;
}

.killTime{
  position:absolute;
  right:8px;
  bottom:4px;

  font-size:9px;
  color:#6d91b9;
}


/* =========================================================
   EMPTY FEED
========================================================= */

.emptyFeed{
  height:250px;

  display:flex;
  justify-content:center;
  align-items:center;

  color:#456582;

  font-size:18px;
  font-weight:800;
  letter-spacing:2px;
}


/* =========================================================
   POINTS TABLE
========================================================= */

.tablePanel{
  border-left:1px solid rgba(0,170,255,.65);
}

.tableHeader{
  height:50px;

  display:grid;
  grid-template-columns:55px 1fr 90px 85px 95px 95px;

  align-items:center;

  padding:0 15px;

  color:#76a9d6;

  font-size:14px;
  font-weight:1000;
  letter-spacing:1px;

  background:
    linear-gradient(
      90deg,
      rgba(4,20,39,.98),
      rgba(7,29,54,.9)
    );

  border-bottom:1px solid rgba(0,130,255,.28);
}

.tableRow{
  position:relative;

  height:54px;

  display:grid;
  grid-template-columns:55px 1fr 90px 85px 95px 95px;

  align-items:center;

  padding:0 15px;

  border-bottom:1px solid rgba(100,150,200,.11);

  font-size:15px;
  font-weight:800;

  transition:.2s;
}

.tableRow:nth-child(even){
  background:rgba(5,20,37,.42);
}

.tableRow:hover{
  background:rgba(0,105,210,.12);
}

.rank{
  font-size:18px;
  color:#86a8c7;
}

.teamCell{
  display:flex;
  align-items:center;
  gap:12px;

  min-width:0;
}

.tableLogo{
  width:34px;
  height:34px;

  object-fit:contain;

  padding:2px;

  background:#020a14;
}

.teamName{
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.stat{
  text-align:center;
}

.points{
  color:#ffd900;
  font-size:19px;
  font-weight:1000;
}

.top1{
  background:
    linear-gradient(
      90deg,
      rgba(255,213,0,.12),
      rgba(255,213,0,.025)
    );
}

.top1::before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:4px;

  background:#ffd900;
  box-shadow:0 0 12px #ffd900;
}

.top2::before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:3px;

  background:#c8d3df;
}

.top3::before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:3px;

  background:#cd8a42;
}


/* =========================================================
   ELIMINATION ALERT
========================================================= */

#eliminationLayer{
  position:absolute;
  left:50%;
  top:114px;

  transform:translateX(-50%);

  z-index:1000;

  pointer-events:none;

  display:none;
}

.elimination{
  min-width:760px;
  height:105px;

  display:flex;
  align-items:center;

  padding:0 30px;

  background:
    linear-gradient(
      90deg,
      rgba(3,9,18,.98),
      rgba(18,5,11,.98),
      rgba(3,9,18,.98)
    );

  border:2px solid #ff2147;

  clip-path:polygon(
    3% 0,
    97% 0,
    100% 50%,
    97% 100%,
    3% 100%,
    0 50%
  );

  box-shadow:
    0 0 25px rgba(255,20,60,.55),
    inset 0 0 25px rgba(255,20,60,.12);

  animation:elimIn .55s cubic-bezier(.2,.8,.2,1);
}

@keyframes elimIn{
  0%{
    opacity:0;
    transform:translateY(-60px) scale(.8);
  }

  60%{
    opacity:1;
    transform:translateY(8px) scale(1.04);
  }

  100%{
    transform:translateY(0) scale(1);
  }
}

.elimLogo{
  width:72px;
  height:72px;

  object-fit:contain;

  margin-right:22px;

  background:#03070d;

  border:1px solid rgba(255,255,255,.35);

  padding:5px;
}

.elimText{
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.elimSmall{
  color:#ff375b;

  font-size:15px;
  font-weight:1000;
  letter-spacing:4px;
}

.elimTeam{
  margin-top:4px;

  font-size:32px;
  font-weight:1000;

  text-transform:uppercase;

  letter-spacing:1px;
}

.elimWord{
  margin-left:auto;

  font-size:34px;
  font-weight:1000;

  color:#ff2147;

  letter-spacing:2px;

  text-shadow:
    0 0 15px rgba(255,30,70,.75);
}


/* =========================================================
   ELIMINATED TABLE ROW
========================================================= */

.eliminatedRow{
  opacity:.42;

  background:
    linear-gradient(
      90deg,
      rgba(255,20,50,.10),
      transparent
    ) !important;
}

.eliminatedRow .teamName{
  text-decoration:line-through;
  color:#8492a0;
}

.eliminatedTag{
  margin-left:auto;

  padding:4px 8px;

  color:#ff3658;

  border:1px solid rgba(255,30,70,.45);

  font-size:9px;
  font-weight:1000;
}


/* =========================================================
   SCAN / BROADCAST EFFECT
========================================================= */

.scan{
  position:absolute;
  left:0;
  right:0;

  height:1px;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(0,160,255,.55),
      transparent
    );

  opacity:.2;

  animation:scan 5s linear infinite;

  pointer-events:none;
}

@keyframes scan{
  from{
    top:0;
  }

  to{
    top:100%;
  }
}


/* =========================================================
   CORNER DECORATIONS
========================================================= */

.corner{
  position:absolute;

  width:65px;
  height:65px;

  pointer-events:none;

  border-color:#008fff;
  border-style:solid;
}

.corner.tl{
  top:0;
  left:0;
  border-width:3px 0 0 3px;
}

.corner.tr{
  top:0;
  right:0;
  border-width:3px 3px 0 0;
}

.corner.bl{
  bottom:0;
  left:0;
  border-width:0 0 3px 3px;
}

.corner.br{
  bottom:0;
  right:0;
  border-width:0 3px 3px 0;
}

</style>
</head>

<body>

<div id="stage">

  <div class="bg"></div>

  <!-- =====================================================
       TOP BAR
  ====================================================== -->

  <div class="topbar">

    <div class="liveBox">

      LIVE

</div>


<!-- =========================================================
     EXISTING SUPABASE CONNECTION
========================================================= -->

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>


<script>

/* =========================================================
   HELPERS
========================================================= */

const $ = id => document.getElementById(id);

let previousEvents = [];
let eliminationTimer = null;

const FALLBACK_LOGO =
  "data:image/svg+xml;charset=UTF-8," +
  encodeURIComponent(`
    <svg xmlns="http://www.w3.org/2000/svg"
         width="100"
         height="100"
         viewBox="0 0 100 100">
      <rect width="100" height="100" fill="#061321"/>
      <text x="50"
            y="57"
            text-anchor="middle"
            fill="#4c7194"
            font-size="30"
            font-family="Arial"
            font-weight="bold">—</text>
    </svg>
  `);


/* =========================================================
   SAFE VALUE HELPERS
========================================================= */

function text(v, fallback=""){
  if(v === null || v === undefined) return fallback;
  return String(v);
}

function num(v, fallback=0){
  const n = Number(v);
  return Number.isFinite(n) ? n : fallback;
}

function logoOf(team){
  if(!team) return FALLBACK_LOGO;

  return (
    team.logo ||
    team.logo_url ||
    team.image ||
    team.image_url ||
    FALLBACK_LOGO
  );
}

function teamNameOf(team){
  if(!team) return "UNKNOWN TEAM";

  return (
    team.name ||
    team.team_name ||
    team.title ||
    "UNKNOWN TEAM"
  );
}


/* =========================================================
   TEAM DATA
========================================================= */

function getTeams(c){

  if(!c) return [];

  if(Array.isArray(c.teams))
    return c.teams;

  if(Array.isArray(c.roster))
    return c.roster;

  if(Array.isArray(c.teamList))
    return c.teamList;

  return [];
}


/* =========================================================
   TEAM LOOKUP
========================================================= */

function findTeam(c, name){

  const teams = getTeams(c);

  if(!name) return null;

  const target = String(name).trim().toLowerCase();

  return teams.find(t => {

    const candidates = [
      t.name,
      t.team_name,
      t.title,
      t.short,
      t.tag
    ]
    .filter(Boolean)
    .map(x => String(x).trim().toLowerCase());

    return candidates.includes(target);

  }) || null;
}


/* =========================================================
   PLAYER → TEAM LOOKUP
========================================================= */

function playersOf(team){

  if(!team) return [];

  const p =
    team.players ||
    team.roster ||
    team.members ||
    [];

  if(!Array.isArray(p))
    return [];

  return p.map(x => {

    if(typeof x === "string")
      return x;

    return (
      x.name ||
      x.player_name ||
      x.username ||
      x.ign ||
      ""
    );

  }).filter(Boolean);

}


function findTeamByPlayer(c, playerName){

  if(!playerName) return null;

  const target =
    String(playerName).trim().toLowerCase();

  for(const team of getTeams(c)){

    const players = playersOf(team);

    for(const p of players){

      if(
        String(p).trim().toLowerCase()
        === target
      ){
        return team;
      }

    }

  }

  return null;
}


/* =========================================================
   EVENT FIELD HELPERS
========================================================= */

function killerOf(e){

  return (
    e.killer ||
    e.killer_name ||
    e.p_killer ||
    e.attacker ||
    e.player ||
    ""
  );

}

function victimOf(e){

  return (
    e.victim ||
    e.victim_name ||
    e.p_victim ||
    e.target ||
    ""
  );

}

function weaponOf(e){

  return (
    e.weapon ||
    e.weapon_name ||
    e.p_weapon ||
    ""
  );

}

function eventTime(e){

  return (
    e.time ||
    e.created_at ||
    e.timestamp ||
    null
  );

}


/* =========================================================
   WEAPON DISPLAY
========================================================= */

function weaponIcon(weapon){

  const w =
    String(weapon || "").toLowerCase();

  if(
    w.includes("m416") ||
    w.includes("scar") ||
    w.includes("aug") ||
    w.includes("groza") ||
    w.includes("akm") ||
    w.includes("ar")
  ){
    return "🔫";
  }

  if(
    w.includes("awm") ||
    w.includes("kar") ||
    w.includes("m24") ||
    w.includes("sniper")
  ){
    return "🎯";
  }

  if(
    w.includes("uzi") ||
    w.includes("vector") ||
    w.includes("ump") ||
    w.includes("smg")
  ){
    return "⚡";
  }

  if(
    w.includes("grenade") ||
    w.includes("frag")
  ){
    return "💥";
  }

  return "⚔";
}


/* =========================================================
   TIME
========================================================= */

function formatTime(v){

  if(!v)
    return "";

  const d = new Date(v);

  if(Number.isNaN(d.getTime()))
    return "";

  return d.toLocaleTimeString(
    [],
    {
      hour:"2-digit",
      minute:"2-digit",
      second:"2-digit"
    }
  );

}


/* =========================================================
   KILL FEED RENDER
========================================================= */

function renderFeed(c, events){

  const feed = $("feed");

  if(!feed)
    return;

  if(!Array.isArray(events) || !events.length){

    feed.innerHTML = `
      <div class="emptyFeed">
        WAITING FOR KILLS...
      </div>
    `;

    return;
  }

  const latest =
    [...events]
    .sort(
      (a,b) =>
        new Date(eventTime(b) || 0)
        -
        new Date(eventTime(a) || 0)
    )
    .slice(0,6);


  feed.innerHTML =
    latest.map(e => {

      const killer = killerOf(e);
      const victim = victimOf(e);
      const weapon = weaponOf(e);

      const killerTeam =
        findTeam(c,killer) ||
        findTeamByPlayer(c,killer);

      const victimTeam =
        findTeam(c,victim) ||
        findTeamByPlayer(c,victim);

      return `

        <div class="kill">

          <img
            class="teamLogo"
            src="${escapeAttr(
              logoOf(killerTeam)
            )}"
            onerror="this.src='${escapeAttr(FALLBACK_LOGO)}'"
          >

          <div class="player killer">
            ${escapeHtml(killer || "UNKNOWN")}
          </div>

          <div class="weapon">

            <div class="weaponIcon">
              ${weaponIcon(weapon)}
            </div>

            <div class="weaponName">
              ${escapeHtml(
                weapon || "GUN"
              )}
            </div>

          </div>

          <div class="player victim">
            ${escapeHtml(victim || "UNKNOWN")}
          </div>

          <img
            class="teamLogo"
            src="${escapeAttr(
              logoOf(victimTeam)
            )}"
            onerror="this.src='${escapeAttr(FALLBACK_LOGO)}'"
          >

          <div class="killTime">
            ${formatTime(eventTime(e))}
          </div>

        </div>

      `;

    }).join("");

}


/* =========================================================
   POINT CALCULATION
========================================================= */

function calculateKills(c, events, team){

  const teamName =
    teamNameOf(team)
    .trim()
    .toLowerCase();

  let kills = 0;

  for(const e of events || []){

    const killer = killerOf(e);

    const kt =
      findTeam(c,killer) ||
      findTeamByPlayer(c,killer);

    if(
      kt &&
      teamNameOf(kt)
        .trim()
        .toLowerCase()
        === teamName
    ){
      kills++;
    }

  }

  return kills;
}


/* =========================================================
   TEAM FINISH / PLACE / POINTS
========================================================= */

function finishOf(team){

  return num(
    team.finish ??
    team.finish_points ??
    team.placement_points ??
    team.place_points ??
    team.position_points ??
    0
  );

}

function placeOf(team){

  return (
    team.place ??
    team.position ??
    team.rank ??
    team.finish_position ??
    "-"
  );

}

function pointsOf(team, kills){

  if(
    team.points !== undefined
  ){
    return num(team.points);
  }

  if(
    team.total_points !== undefined
  ){
    return num(team.total_points);
  }

  if(
    team.score !== undefined
  ){
    return num(team.score);
  }

  return (
    finishOf(team) +
    kills
  );

}


/* =========================================================
   ELIMINATION DETECTION
========================================================= */

function isTeamEliminated(c, team, events){

  if(!team)
    return false;

  if(
    team.eliminated === true ||
    team.is_eliminated === true
  ){
    return true;
  }

  const players = playersOf(team);

  if(!players.length)
    return false;

  const deadPlayers = new Set();

  for(const e of events || []){

    const victim = victimOf(e);

    if(!victim)
      continue;

    const v =
      String(victim)
        .trim()
        .toLowerCase();

    for(const p of players){

      if(
        String(p)
          .trim()
          .toLowerCase()
        === v
      ){
        deadPlayers.add(v);
      }

    }

  }

  return deadPlayers.size >= players.length;

}


/* =========================================================
   POINTS TABLE
========================================================= */

function renderTable(c, events){

  const table = $("table");

  if(!table)
    return;

  const teams = getTeams(c);

  if(!teams.length){

    table.innerHTML = `
      <div class="emptyFeed">
        NO TEAMS CONFIGURED
      </div>
    `;

    return;
  }


  const rows =
    teams.map(team => {

      const kills =
        calculateKills(
          c,
          events,
          team
        );

      const finish =
        finishOf(team);

      const points =
        pointsOf(
          team,
          kills
        );

      const eliminated =
        isTeamEliminated(
          c,
          team,
          events
        );

      return {
        team,
        kills,
        finish,
        points,
        eliminated
      };

    });


  rows.sort((a,b) => {

    if(b.points !== a.points)
      return b.points - a.points;

    if(b.kills !== a.kills)
      return b.kills - a.kills;

    return 0;

  });


  table.innerHTML =
    rows
      .slice(0,16)
      .map((r,i) => {

        let rankClass = "";

        if(i === 0)
          rankClass = "top1";

        else if(i === 1)
          rankClass = "top2";

        else if(i === 2)
          rankClass = "top3";


        return `

          <div class="
            tableRow
            ${rankClass}
            ${r.eliminated ? "eliminatedRow" : ""}
          ">

            <div class="rank">
              ${i+1}
            </div>

            <div class="teamCell">

              <img
                class="tableLogo"
                src="${escapeAttr(
                  logoOf(r.team)
                )}"
                onerror="this.src='${escapeAttr(FALLBACK_LOGO)}'"
              >

              <div class="teamName">
                ${escapeHtml(
                  teamNameOf(r.team)
                )}
              </div>

              ${
                r.eliminated
                ?
                `<div class="eliminatedTag">
                  ELIMINATED
                </div>`
                :
                ""
              }

            </div>

            <div class="stat">
              ${escapeHtml(
                text(placeOf(r.team),"-")
              )}
            </div>

            <div class="stat">
              ${r.kills}
            </div>

            <div class="stat">
              ${r.finish}
            </div>

            <div class="stat points">
              ${r.points}
            </div>

          </div>

        `;

      })
      .join("");

}


/* =========================================================
   ELIMINATION ALERT
========================================================= */

function showElimination(team){

  if(!team)
    return;

  const layer = $("eliminationLayer");
  const logo = $("elimLogo");
  const name = $("elimTeam");

  logo.src = logoOf(team);
  name.textContent =
    teamNameOf(team);

  layer.style.display = "block";

  clearTimeout(eliminationTimer);

  eliminationTimer =
    setTimeout(() => {

      layer.style.display =
        "none";

    },5000);

}


/* =========================================================
   DETECT NEW ELIMINATION
========================================================= */

function detectEliminations(c, events){

  const teams =
    getTeams(c);

  if(!teams.length)
    return;


  const oldMap = {};

  for(const team of teams){

    const name =
      teamNameOf(team)
        .trim()
        .toLowerCase();

    oldMap[name] =
      isTeamEliminated(
        c,
        team,
        previousEvents
      );

  }


  for(const team of teams){

    const name =
      teamNameOf(team)
        .trim()
        .toLowerCase();

    const now =
      isTeamEliminated(
        c,
        team,
        events
      );

    const before =
      oldMap[name] || false;

    if(
      now &&
      !before
    ){

      showElimination(team);

      break;
    }

  }

}


/* =========================================================
   BROADCAST SETTINGS
========================================================= */

function renderBroadcast(c){

  const b =
    c?.broadcast || {};

  $("matchTitle").textContent =
    b.match ||
    c?.match ||
    "MATCH 1";

  $("groupTitle").textContent =
    b.group ||
    c?.group ||
    "GROUP A × B";

  $("dayTitle").textContent =
    b.day ||
    c?.day ||
    "DAY 1";

  $("mapTitle").textContent =
    b.map ||
    c?.map ||
    "ERANGEL";

}


/* =========================================================
   HTML SAFETY
========================================================= */

function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

function escapeAttr(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;");

}


/* =========================================================
   MAIN UPDATE
========================================================= */

async function tick(){

  try{

    const [
      c,
      events
    ] =
      await Promise.all([
        getState(),
        getEvents()
      ]);


    renderBroadcast(c);

    renderFeed(
      c,
      events
    );

    renderTable(
      c,
      events
    );

    detectEliminations(
      c,
      events
    );


    previousEvents =
      Array.isArray(events)
      ? [...events]
      : [];


  }catch(err){

    console.error(
      "OVERLAY ERROR:",
      err
    );

  }

}


/* =========================================================
   START
========================================================= */

tick();

setInterval(
  tick,
  1000
);

</script>
