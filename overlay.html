<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BGMI Overlay</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:transparent !important;
  font-family:Arial,Segoe UI,sans-serif;
  color:#fff;
}

#stage{
  position:relative;
  width:1920px;
  height:1080px;
  background:transparent;
}

/* ================= TOP BAR ================= */

.topbar{
  position:absolute;
  top:18px;
  left:22px;
  right:22px;
  height:64px;

  display:flex;
  align-items:center;

  background:rgba(3,12,25,.88);
  border:1px solid rgba(0,157,255,.65);

  box-shadow:
    0 0 18px rgba(0,130,255,.18),
    inset 0 0 20px rgba(0,100,255,.06);

  z-index:20;
}

.live{
  width:170px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:11px;

  font-size:22px;
  font-weight:900;
  letter-spacing:3px;
}

.liveDot{
  width:11px;
  height:11px;
  border-radius:50%;
  background:#ff2448;
  box-shadow:0 0 12px #ff2448;
  animation:pulse 1s infinite;
}

@keyframes pulse{
  50%{opacity:.35}
}

.match{
  flex:1;
  text-align:center;
  font-size:25px;
  font-weight:900;
  letter-spacing:1.5px;
}

.gold{color:#ffd900}

.topRight{
  width:330px;
  display:flex;
  justify-content:center;
  gap:12px;
}

.badge{
  min-width:105px;
  padding:9px 15px;
  text-align:center;

  font-size:15px;
  font-weight:900;

  background:rgba(5,31,58,.9);
  border:1px solid #087fd4;

  clip-path:polygon(
    7% 0,100% 0,93% 100%,0 100%
  );
}

/* ================= SIDE PANELS ================= */

.panel{
  position:absolute;

  top:105px;
  bottom:25px;

  background:rgba(2,12,25,.70);

  border:1px solid rgba(0,145,255,.55);

  box-shadow:
    0 0 18px rgba(0,100,255,.12),
    inset 0 0 25px rgba(0,100,255,.035);

  overflow:hidden;
}

/* LEFT SMALL */

.killPanel{
  left:24px;
  width:330px;
}

/* RIGHT */

.pointsPanel{
  right:24px;
  width:485px;
}

.title{
  height:54px;

  display:flex;
  align-items:center;

  padding-left:18px;

  background:rgba(4,25,48,.82);

  border-bottom:1px solid rgba(0,140,255,.35);

  font-size:19px;
  font-weight:900;
  letter-spacing:1.5px;
}

.titleLine{
  width:4px;
  height:25px;
  margin-right:10px;

  background:#00aaff;
  box-shadow:0 0 12px #00aaff;
}

/* ================= KILL FEED ================= */

#feed{
  padding:10px;
}

.kill{
  position:relative;

  min-height:62px;
  margin-bottom:8px;

  display:grid;
  grid-template-columns:38px 1fr 45px 1fr 38px;
  align-items:center;

  padding:5px 6px;

  background:rgba(4,21,40,.82);

  border:1px solid rgba(0,125,220,.35);

  animation:feedIn .3s ease;
}

.kill:before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:3px;
  background:#00aaff;
  box-shadow:0 0 8px #00aaff;
}

@keyframes feedIn{
  from{
    opacity:0;
    transform:translateX(-12px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.logo{
  width:31px;
  height:31px;
  object-fit:contain;
  background:#020a14;
  border:1px solid rgba(0,160,255,.4);
  padding:2px;
}

.player{
  font-size:12px;
  font-weight:900;

  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.killer{
  text-align:right;
  padding-right:7px;
}

.victim{
  padding-left:7px;
}

.weapon{
  text-align:center;
  color:#ffd900;
}

.weaponIcon{
  font-size:18px;
  line-height:18px;
}

.weaponName{
  font-size:7px;
  margin-top:2px;
}

.killTime{
  position:absolute;
  bottom:2px;
  right:5px;

  font-size:7px;
  color:#6687a7;
}

.waiting{
  padding:40px 10px;
  text-align:center;
  color:#52718e;
  font-size:12px;
  font-weight:900;
  letter-spacing:1px;
}

/* ================= POINTS TABLE ================= */

.tableHead,
.row{
  display:grid;
  grid-template-columns:38px 1fr 70px 85px 105px;
  align-items:center;
}

.tableHead{
  height:38px;
  padding:0 9px;

  color:#79a9cf;

  background:rgba(4,20,38,.85);

  font-size:10px;
  font-weight:900;
  letter-spacing:.8px;
}

.row{
  position:relative;

  height:54px;
  padding:0 9px;

  border-bottom:1px solid rgba(100,150,200,.10);

  background:rgba(2,14,28,.54);

  font-size:12px;
  font-weight:800;
}

.row:nth-child(even){
  background:rgba(5,22,39,.60);
}

.rank{
  font-size:16px;
  color:#83a6c5;
}

.team{
  min-width:0;

  display:flex;
  align-items:center;
  gap:8px;
}

.teamLogo{
  width:30px;
  height:30px;
  object-fit:contain;
  background:#020a14;
  border:1px solid rgba(0,150,255,.35);
  padding:2px;
  flex-shrink:0;
}

.teamName{
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.stat{
  text-align:center;
}

.total{
  color:#ffd900;
  font-size:16px;
  font-weight:1000;
}

.top1{
  background:rgba(255,210,0,.09) !important;
}

.top1:before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:3px;
  background:#ffd900;
  box-shadow:0 0 9px #ffd900;
}

.top2:before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:3px;
  background:#c9d4df;
}

.top3:before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:3px;
  background:#c78343;
}

.eliminated{
  opacity:.38 !important;
  background:rgba(150,10,25,.13) !important;
}

.eliminated .teamName{
  color:#8995a0;
  text-decoration:line-through;
}

.elimTag{
  color:#ff3152;
  font-size:7px;
  margin-left:auto;
}

/* ================= ELIMINATION ================= */

#elim{
  display:none;

  position:absolute;
  top:94px;
  left:50%;
  transform:translateX(-50%);

  z-index:100;

  min-width:560px;
  height:78px;

  align-items:center;

  padding:0 22px;

  background:rgba(12,4,9,.94);

  border:2px solid #ff2448;

  box-shadow:
    0 0 25px rgba(255,20,60,.5);

  animation:elimIn .45s ease;
}

@keyframes elimIn{
  from{
    opacity:0;
    transform:translate(-50%,-25px) scale(.9);
  }
  to{
    opacity:1;
    transform:translate(-50%,0) scale(1);
  }
}

.elimLogo{
  width:54px;
  height:54px;
  object-fit:contain;
  padding:3px;
  background:#02070d;
  margin-right:15px;
}

.elimSmall{
  color:#ff3152;
  font-size:10px;
  font-weight:900;
  letter-spacing:2px;
}

.elimTeam{
  font-size:22px;
  font-weight:1000;
  margin-top:3px;
}

.elimWord{
  margin-left:auto;
  color:#ff2448;
  font-size:23px;
  font-weight:1000;
}

/* ================= DECOR ================= */

.corner{
  position:absolute;
  width:32px;
  height:32px;
  pointer-events:none;
}

.c1{
  left:0;
  top:0;
  border-left:2px solid #00aaff;
  border-top:2px solid #00aaff;
}

.c2{
  right:0;
  top:0;
  border-right:2px solid #00aaff;
  border-top:2px solid #00aaff;
}

.c3{
  left:0;
  bottom:0;
  border-left:2px solid #00aaff;
  border-bottom:2px solid #00aaff;
}

.c4{
  right:0;
  bottom:0;
  border-right:2px solid #00aaff;
  border-bottom:2px solid #00aaff;
}

</style>
</head>

<body>

<div id="stage">

  <!-- TOP BAR -->
  <div class="topbar">

    <div class="live">
      <span class="liveDot"></span>
      LIVE
    </div>

    <div class="match">
      <span id="matchTitle">MATCH 1</span>
      <span> | </span>
      <span id="groupTitle" class="gold">GROUP A × B</span>
    </div>

    <div class="topRight">
      <div class="badge" id="dayTitle">DAY 1</div>
      <div class="badge" id="mapTitle">ERANGEL</div>
    </div>

  </div>


  <!-- KILL FEED -->
  <section class="panel killPanel">

    <div class="title">
      <span class="titleLine"></span>
      KILL FEED
    </div>

    <div id="feed">
      <div class="waiting">
        WAITING FOR KILLS...
      </div>
    </div>

    <div class="corner c1"></div>
    <div class="corner c3"></div>

  </section>


  <!-- POINTS TABLE -->
  <section class="panel pointsPanel">

    <div class="title">
      <span class="titleLine"></span>
      LIVE POINTS TABLE
    </div>

    <div class="tableHead">
      <div>#</div>
      <div>TEAM</div>
      <div class="stat">KILLS</div>
      <div class="stat">PLACEMENT</div>
      <div class="stat">TOTAL POINTS</div>
    </div>

    <div id="table"></div>

    <div class="corner c2"></div>
    <div class="corner c4"></div>

  </section>


  <!-- ELIMINATION -->
  <div id="elim">

    <img id="elimLogo" class="elimLogo">

    <div>
      <div class="elimSmall">
        TEAM ELIMINATED
      </div>

      <div id="elimTeam" class="elimTeam">
        TEAM
      </div>
    </div>

    <div class="elimWord">
      ELIMINATED
    </div>

  </div>

</div>


<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>

/* =========================================================
   HELPERS
========================================================= */

const $ = id => document.getElementById(id);

const fallbackLogo =
"data:image/svg+xml;charset=UTF-8,"+
encodeURIComponent(`
<svg xmlns="http://www.w3.org/2000/svg"
width="100" height="100">
<rect width="100" height="100" fill="#061321"/>
<text x="50" y="58"
text-anchor="middle"
fill="#4d7394"
font-size="30"
font-family="Arial">—</text>
</svg>
`);

function esc(v){
  return String(v ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function attr(v){
  return esc(v);
}


/* =========================================================
   TEAMS
========================================================= */

function teams(c){

  if(Array.isArray(c?.teams))
    return c.teams;

  if(Array.isArray(c?.roster))
    return c.roster;

  return [];
}

function teamName(t){
  return (
    t?.name ||
    t?.team_name ||
    t?.title ||
    t?.short ||
    "UNKNOWN TEAM"
  );
}

function teamLogo(t){
  return (
    t?.logo ||
    t?.logo_url ||
    t?.image ||
    t?.image_url ||
    fallbackLogo
  );
}

function players(t){

  const p =
    t?.players ||
    t?.members ||
    t?.roster ||
    [];

  if(!Array.isArray(p))
    return [];

  return p.map(x =>
    typeof x==="string"
      ? x
      : (
          x?.name ||
          x?.ign ||
          x?.player_name ||
          ""
        )
  ).filter(Boolean);
}


/* =========================================================
   FIND TEAM
========================================================= */

function findTeam(c,name){

  if(!name) return null;

  const target =
    String(name).trim().toLowerCase();

  for(const t of teams(c)){

    const names = [
      teamName(t),
      t?.short,
      t?.tag,
      t?.abbr
    ].filter(Boolean);

    if(
      names.some(x =>
        String(x).trim().toLowerCase()
        === target
      )
    ){
      return t;
    }

    if(
      players(t).some(x =>
        String(x).trim().toLowerCase()
        === target
      )
    ){
      return t;
    }
  }

  return null;
}


/* =========================================================
   EVENT FIELDS
========================================================= */

function killer(e){
  return (
    e?.killer ||
    e?.killer_name ||
    e?.p_killer ||
    e?.attacker ||
    ""
  );
}

function victim(e){
  return (
    e?.victim ||
    e?.victim_name ||
    e?.p_victim ||
    e?.target ||
    ""
  );
}

function weapon(e){
  return (
    e?.weapon ||
    e?.weapon_name ||
    e?.p_weapon ||
    "GUN"
  );
}

function eventTime(e){
  return (
    e?.time ||
    e?.created_at ||
    e?.timestamp ||
    ""
  );
}


/* =========================================================
   WEAPON ICON
========================================================= */

function icon(w){

  w=String(w).toLowerCase();

  if(
    w.includes("awm") ||
    w.includes("kar") ||
    w.includes("m24") ||
    w.includes("sniper")
  ) return "🎯";

  if(
    w.includes("grenade") ||
    w.includes("frag")
  ) return "💥";

  if(
    w.includes("uzi") ||
    w.includes("ump") ||
    w.includes("vector") ||
    w.includes("smg")
  ) return "⚡";

  return "⚔";
}


/* =========================================================
   KILL FEED
========================================================= */

function renderFeed(c,events){

  const box=$("feed");

  if(!Array.isArray(events) || !events.length){

    box.innerHTML=`
      <div class="waiting">
        WAITING FOR KILLS...
      </div>
    `;

    return;
  }

  const latest=[...events]
    .sort((a,b)=>
      new Date(eventTime(b)||0) -
      new Date(eventTime(a)||0)
    )
    .slice(0,6);

  box.innerHTML=latest.map(e=>{

    const k=killer(e);
    const v=victim(e);
    const w=weapon(e);

    const kt=findTeam(c,k);
    const vt=findTeam(c,v);

    let tm="";

    if(eventTime(e)){
      const d=new Date(eventTime(e));
      if(!isNaN(d))
        tm=d.toLocaleTimeString([],{
          hour:"2-digit",
          minute:"2-digit",
          second:"2-digit"
        });
    }

    return `
      <div class="kill">

        <img
          class="logo"
          src="${attr(teamLogo(kt))}"
          onerror="this.src='${attr(fallbackLogo)}'"
        >

        <div class="player killer">
          ${esc(k || "UNKNOWN")}
        </div>

        <div class="weapon">
          <div class="weaponIcon">${icon(w)}</div>
          <div class="weaponName">${esc(w)}</div>
        </div>

        <div class="player victim">
          ${esc(v || "UNKNOWN")}
        </div>

        <img
          class="logo"
          src="${attr(teamLogo(vt))}"
          onerror="this.src='${attr(fallbackLogo)}'"
        >

        <div class="killTime">
          ${esc(tm)}
        </div>

      </div>
    `;

  }).join("");
}


/* =========================================================
   KILLS
========================================================= */

function getKills(c,events,t){

  const tn=teamName(t)
    .trim()
    .toLowerCase();

  let total=0;

  for(const e of events||[]){

    const kt=findTeam(c,killer(e));

    if(
      kt &&
      teamName(kt)
        .trim()
        .toLowerCase()
      === tn
    ){
      total++;
    }

  }

  return total;
}


/* =========================================================
   PLACEMENT
========================================================= */

function placement(t){

  return Number(
    t?.placement ??
    t?.placement_points ??
    t?.finish ??
    t?.finish_points ??
    t?.place_points ??
    t?.position_points ??
    0
  ) || 0;
}


/* =========================================================
   TOTAL POINTS
========================================================= */

function totalPoints(t,kills){

  /*
    If admin/backend already has total points,
    use it.
  */

  if(t?.total_points !== undefined)
    return Number(t.total_points)||0;

  if(t?.points !== undefined)
    return Number(t.points)||0;

  /*
    Otherwise:
    TOTAL = KILLS + PLACEMENT
  */

  return kills + placement(t);
}


/* =========================================================
   ELIMINATED
========================================================= */

function eliminated(t){

  return (
    t?.eliminated === true ||
    t?.is_eliminated === true ||
    String(t?.status||"")
      .toLowerCase()
      === "eliminated"
  );

}


/* =========================================================
   POINTS TABLE
========================================================= */

function renderTable(c,events){

  const box=$("table");

  let data=teams(c).map(t=>{

    const k=getKills(c,events,t);
    const p=placement(t);
    const total=totalPoints(t,k);

    return {
      t,
      kills:k,
      placement:p,
      total,
      eliminated:eliminated(t)
    };

  });


  data.sort((a,b)=>{

    if(b.total!==a.total)
      return b.total-a.total;

    return b.kills-a.kills;

  });


  /*
    EXACTLY 16 TEAMS
  */

  data=data.slice(0,16);


  box.innerHTML=data.map((r,i)=>{

    let rankClass="";

    if(i===0) rankClass="top1";
    if(i===1) rankClass="top2";
    if(i===2) rankClass="top3";

    return `
      <div class="
        row
        ${rankClass}
        ${r.eliminated ? "eliminated":""}
      ">

        <div class="rank">
          ${i+1}
        </div>

        <div class="team">

          <img
            class="teamLogo"
            src="${attr(teamLogo(r.t))}"
            onerror="this.src='${attr(fallbackLogo)}'"
          >

          <div class="teamName">
            ${esc(teamName(r.t))}
          </div>

          ${
            r.eliminated
            ?
            `<div class="elimTag">ELIMINATED</div>`
            :
            ""
          }

        </div>

        <div class="stat">
          ${r.kills}
        </div>

        <div class="stat">
          ${r.placement}
        </div>

        <div class="stat total">
          ${r.total}
        </div>

      </div>
    `;

  }).join("");

}


/* =========================================================
   BROADCAST SETTINGS
========================================================= */

function renderBroadcast(c){

  const b=c?.broadcast||{};

  $("matchTitle").textContent =
    b.match ||
    c?.match ||
    "MATCH 1";

  $("groupTitle").textContent =
    b.group ||
    c?.group ||
    "GROUP A × B";

  $("dayTitle").textContent =
    b.day ||
    c?.day ||
    "DAY 1";

  $("mapTitle").textContent =
    b.map ||
    c?.map ||
    "ERANGEL";

}


/* =========================================================
   ELIMINATION ALERT
========================================================= */

let previousEliminated=new Set();
let elimTimer=null;

function checkElimination(c){

  const current=new Set();

  for(const t of teams(c)){

    if(eliminated(t)){

      const name=teamName(t);

      current.add(name);

      if(
        !previousEliminated.has(name)
      ){

        showElimination(t);

      }

    }

  }

  previousEliminated=current;
}


function showElimination(t){

  $("elimLogo").src=teamLogo(t);
  $("elimTeam").textContent=teamName(t);

  $("elim").style.display="flex";

  clearTimeout(elimTimer);

  elimTimer=setTimeout(()=>{

    $("elim").style.display="none";

  },5000);

}


/* =========================================================
   UPDATE
========================================================= */

async function update(){

  try{

    const state=await getState();
    const events=await getEvents();

    renderBroadcast(state);

    renderFeed(
      state,
      events
    );

    renderTable(
      state,
      events
    );

    checkElimination(state);

  }catch(err){

    console.error(
      "BGMI OVERLAY ERROR:",
      err
    );

  }

}


/* =========================================================
   START
========================================================= */

update();

setInterval(
  update,
  1000
);

</script>

</body>
</html>
