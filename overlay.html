<script>

/* =========================================================
SUPABASE
========================================================= */

const CFG =
window.KF_CONFIG || {};

const SUPABASE_URL =
CFG.SUPABASE_URL ||
"https://nuywberanlfvngjnjcpx.supabase.co";

const SUPABASE_KEY =
CFG.SUPABASE_PUBLISHABLE_KEY || "";

const ROOM =
localStorage.getItem("kf_room") ||
"ADITYA8029";

const sb =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

const $ =
id =>
document.getElementById(id);

/* =========================================================
HELPERS
========================================================= */

function esc(v){

return String(v ?? "")
.replace(
/[&<>"']/g,
m =>
({
"&":"&",
"<":"<",
">":">",
'"':""",
"'":"'"
}[m])
);

}

function arr(v){

return Array.isArray(v)
? v
: [];

}

/* =========================================================
SUPABASE RPC
========================================================= */

async function rpc(
name,
params
){

const r =
await sb.rpc(
name,
params
);

if(r.error)
throw r.error;

return r.data;

}

async function getState(){

return rpc(
"kf_get_state",
{
p_room_code:ROOM
}
);

}

async function getEvents(){

return rpc(
"kf_events",
{
p_room_code:ROOM
}
);

}

/* =========================================================
TEAM DATA
========================================================= */

function teamsFromConfig(c){

const t =
c?.teams;

if(Array.isArray(t))
return t;

if(
t &&
typeof t === "object"
){

return Object.entries(t)
  .map(
    ([key,val]) => {

      if(
        val &&
        typeof val === "object"
      ){

        return {
          ...val,

          name:
            val.name ||
            key,

          short:
            val.short ||
            val.tag ||
            val.abbr ||
            key
        };

      }



      return {
        name\:key,
        short\:key
      };

    }
  );

}

return [];

}

function teamName(t){

return (
t?.name ||
t?.team ||
t?.short ||
t?.tag ||
"UNKNOWN"
);

}

function teamShort(t){

return (
t?.short ||
t?.tag ||
t?.abbr ||
teamName(t)
);

}

function teamLogo(t){

return (
t?.logo ||
t?.logo_url ||
t?.image ||
t?.image_url ||
""
);

}

function teamPlayers(t){

const p =
t?.players ??
t?.members ??
t?.roster ??
[];

if(Array.isArray(p)){

return p
  .map(
    x =>
      typeof x === "string"
      ? x
      : (
          x?.name ||
          x?.ign ||
          x?.player ||
          ""
        )
  )
  .filter(Boolean);

}

if(
p &&
typeof p === "object"
){

return Object.values(p)
  .map(
    x =>
      typeof x === "string"
      ? x
      : (
          x?.name ||
          x?.ign ||
          x?.player ||
          ""
        )
  )
  .filter(Boolean);

}

return [];

}

/* =========================================================
FIND PLAYER TEAM
========================================================= */

function findTeam(
c,
player
){

const p =
String(player || "")
.trim()
.toLowerCase();

if(!p)
return null;

const teams =
teamsFromConfig(c);

/* Exact */

const exact =
teams.find(
t =>
teamPlayers(t)
.some(
x =>
String(x)
.trim()
.toLowerCase()
=== p
)
);

if(exact)
return exact;

/* Partial */

const partial =
teams.find(
t =>
teamPlayers(t)
.some(
x => {

          const a =
            p;

          const b =
            String(x)
              .trim()
              .toLowerCase();



          return (
            a.includes(b) ||
            b.includes(a)
          );

        }
      )
);

return partial || null;

}

/* =========================================================
EVENTS
========================================================= */

function eventTime(e){

return (
new Date(
e?.time ||
e?.created_at ||
e?.timestamp ||
0
).getTime()
|| 0
);

}

function eventKiller(e){

return (
e?.killer ||
e?.p_killer ||
e?.killer_name ||
e?.attacker ||
e?.killerName ||
e?.data?.killer ||
""
);

}

function eventVictim(e){

return (
e?.victim ||
e?.p_victim ||
e?.victim_name ||
e?.target ||
e?.victimName ||
e?.data?.victim ||
""
);

}

function eventWeapon(e){

return (
e?.weapon ||
e?.p_weapon ||
e?.weapon_name ||
e?.weaponName ||
e?.data?.weapon ||
"GUN"
);

}

/* =========================================================
NORMALIZE EVENTS
========================================================= */

function normalizeEvents(raw){

if(Array.isArray(raw))
return raw;

if(
raw &&
Array.isArray(raw.events)
)
return raw.events;

if(
raw &&
Array.isArray(raw.data)
)
return raw.data;

if(
raw &&
Array.isArray(raw.result)
)
return raw.result;

return [];

}

/* =========================================================
EVENT UNIQUE KEY
========================================================= */

function eventKey(e){

if(
e?.id !== undefined &&
e?.id !== null
){

return "ID:" +
  String(e.id);

}

return [
eventTime(e),
eventKiller(e),
eventVictim(e),
eventWeapon(e)
].join("|");

}

function uniqueEvents(raw){

const source =
normalizeEvents(raw);

const seen =
new Set();

const out = [];

for(
const e of source
){

const key =
  eventKey(e);



if(
  seen.has(key)
)
  continue;



seen.add(key);

out.push(e);

}

return out;

}

/* =========================================================
SORT EVENTS
========================================================= */

function sortedEvents(raw){

return uniqueEvents(raw)
.sort(
(a,b) =>
eventTime(b) -
eventTime(a)
);

}

/* =========================================================
KILL FEED AUTO HIDE
========================================================= */

let feedTimer =
null;

let lastFeedKey =
"";

function hideFeed(){

$("feedWrap")
.classList
.add("hidden");

}

function showKillFeed(
c,
raw
){

const events =
sortedEvents(raw);

if(!events.length){

hideFeed();

return;

}

const e =
events[0];

const key =
eventKey(e);

/*
Same kill already showing:
do NOT restart timer.
*/

if(
key === lastFeedKey
)
return;

lastFeedKey =
key;

const killer =
eventKiller(e);

const victim =
eventVictim(e);

const weapon =
eventWeapon(e);

const killerTeam =
findTeam(
c,
killer
);

const victimTeam =
findTeam(
c,
victim
);

const killerLogo =
teamLogo(
killerTeam
);

const victimLogo =
teamLogo(
victimTeam
);

$("feedRows").innerHTML = `

\<div class="killRow">

  ${
    killerLogo
    ?
    \`
    \<img
      class="killLogo"
      src="${esc(killerLogo)}"
      onerror="
        this.style.visibility='hidden'
      "
    \>
    \`
    :
    \`\<div>\</div>\`
  }



  \<div
    class="killer"
    title="${esc(killer)}">

    ${esc(
      killer ||
      "UNKNOWN"
    )}

  \</div>



  \<div
    class="weapon"
    title="${esc(weapon)}">

    ${esc(
      weapon ||
      "GUN"
    )}

  \</div>



  \<div
    class="victim"
    title="${esc(victim)}">

    ${esc(
      victim ||
      "UNKNOWN"
    )}

  \</div>



  ${
    victimLogo
    ?
    \`
    \<img
      class="killLogo"
      src="${esc(victimLogo)}"
      onerror="
        this.style.visibility='hidden'
      "
    \>
    \`
    :
    \`\<div>\</div>\`
  }

\</div>

`;

$("feedWrap")
.classList
.remove("hidden");

/*
IMPORTANT:

Kill Feed automatically disappears
after 5 seconds.

*/

clearTimeout(
feedTimer
);

feedTimer =
setTimeout(
() => {

    hideFeed();

  },
  5000
);

}

/* =========================================================
KILL COUNTS
========================================================= */

function getKillCounts(
c,
raw
){

const events =
uniqueEvents(raw);

const counts = {};

events.forEach(
e => {

  const killer =
    eventKiller(e);



  const t =
    findTeam(
      c,
      killer
    );



  if(!t)
    return;



  const name =
    teamName(t);



  counts[name] =
    (counts[name] || 0) + 1;

}

);

return counts;

}

/* =========================================================
POINTS
========================================================= */

function num(
v,
fallback=0
){

const n =
Number(v);

return Number.isFinite(n)
? n
: fallback;

}

function placementPoints(t){

return num(
t?.placement ??
t?.placement_points ??
t?.place_points ??
0
);

}

/* =========================================================
BROADCAST
========================================================= */

function broadcast(c){

const b =
c?.broadcast || {};

return {

match:
  b.match ||
  c?.match ||
  c?.match\_name ||
  "MATCH 1",



group:
  b.group ||
  c?.group ||
  c?.group\_name ||
  "GROUP A × B",



day:
  b.day ||
  c?.day ||
  "DAY 1",



map:
  b.map ||
  c?.map ||
  "ERANGEL"

};

}

/* =========================================================
POINTS TABLE
========================================================= */

function renderTable(
c,
raw
){

const teams =
teamsFromConfig(c);

if(!teams.length){

$("table").innerHTML =
  \`
  \<div style="
    height:50px;
    display\:flex;
    align-items\:center;
    justify-content\:center;
    color:#6684a8;
    font-size:9px;
    font-weight:1000;
    letter-spacing:2px;
  ">
    NO TEAM DATA
  \</div>
  \`;

return;

}

const kills =
getKillCounts(
c,
raw
);

const rows =
teams.map(
(t,index) => {

    const name =
      teamName(t);



    const k =
      kills[name] || 0;



    const placement =
      placementPoints(t);



    return {

      t,

      name,

      kills\:k,

      placement,

      total:
        k + placement,

      index

    };

  }
);

rows.sort(
(a,b) =>
b.total -
a.total ||

  b.kills -
  a.kills ||

  a.index -
  b.index

);

$("table").innerHTML =
rows
.slice(0,16)
.map(
(r,index) => {

      const logo =
        teamLogo(r.t);



      return \`

      \<div class="prow">

        \<div class="rank">
          ${index + 1}
        \</div>



        \<div class="team">

          ${
            logo
            ?
            \`
            \<img
              src="${esc(logo)}"
              onerror="
                this.style.visibility='hidden'
              "
            \>
            \`
            :
            ""
          }



          \<b
            title="${esc(r.name)}">

            ${esc(
              teamShort(r.t)
            )}

          \</b>

        \</div>



        \<div class="num">
          ${r.kills}
        \</div>



        \<div class="num">
          ${r.placement}
        \</div>



        \<div class="pts">
          ${r.total}
        \</div>

      \</div>

      \`;

    }
  )
  .join("");

}

/* =========================================================
TEAM ELIMINATION
========================================================= */

const eliminatedShown =
new Set();

let elimTimer =
null;

/*
THIS IS THE IMPORTANT PART.

Team eliminated when 4 DIFFERENT players
from that team appear as victims in kill events.
*/

function getEliminatedTeams(
c,
raw
){

const events =
uniqueEvents(raw);

const teams =
teamsFromConfig(c);

const victimsByTeam =
new Map();

teams.forEach(
t => {

  victimsByTeam.set(
    teamName(t),
    new Set()
  );

}

);

/*
Count victims.

Same player killed twice will only count once.

*/

events.forEach(
e => {

  const victim =
    eventVictim(e);



  if(!victim)
    return;



  const victimTeam =
    findTeam(
      c,
      victim
    );



  if(!victimTeam)
    return;



  const name =
    teamName(
      victimTeam
    );



  if(
    !victimsByTeam.has(name)
  ){

    victimsByTeam.set(
      name,
      new Set()
    );

  }



  victimsByTeam
    .get(name)
    .add(
      String(victim)
        .trim()
        .toLowerCase()
    );

}

);

const result = [];

teams.forEach(
t => {

  const name =
    teamName(t);



  const victims =
    victimsByTeam.get(name);



  if(
    victims &&
    victims.size >= 4
  ){

    result.push(t);

  }

}

);

return result;

}

/* =========================================================
SHOW ELIMINATION
========================================================= */

function showElimination(t){

const logo =
teamLogo(t);

const logoEl =
$("elimLogo");

if(logo){

logoEl.src =
  logo;

logoEl.style.visibility =
  "visible";

}else{

logoEl.removeAttribute(
  "src"
);

logoEl.style.visibility =
  "hidden";

}

$("elimName")
.textContent =
teamName(t);

$("elimBanner")
.style.display =
"flex";

clearTimeout(
elimTimer
);

elimTimer =
setTimeout(
() => {

    $("elimBanner")
      .style.display =
      "none";

  },
  5000
);

}

/* =========================================================
CHECK ELIMINATION
========================================================= */

function checkEliminations(
c,
raw
){

const eliminated =
getEliminatedTeams(
c,
raw
);

for(
const t of eliminated
){

const name =
  teamName(t);



if(
  eliminatedShown.has(name)
)
  continue;



eliminatedShown.add(name);



showElimination(t);

}

}

/* =========================================================
MAIN UPDATE
========================================================= */

let updating =
false;

async function update(){

if(updating)
return;

updating = true;

try{

const [
  state,
  rawEvents
] =
  await Promise.all([

    getState(),

    getEvents()

  ]);



const c =
  state?.config ??
  state?.state ??
  state;



const events =
  normalizeEvents(
    rawEvents
  );



/\* Broadcast \*/

const b =
  broadcast(c);



$("matchTitle")
  .textContent =
  b.match;



$("groupTitle")
  .textContent =
  b.group;



$("dayTitle")
  .textContent =
  b.day;



$("mapTitle")
  .textContent =
  b.map;



$("mapMini")
  .textContent =
  b.map;



/\* Points \*/

renderTable(
  c,
  events
);



/\* Latest kill \*/

showKillFeed(
  c,
  events
);



/\*
  Team elimination:
  4 different players killed.
\*/

checkEliminations(
  c,
  events
);







$("loading")
  .style.display =
  "none";

}catch(err){

console.error(
  "BGMI OVERLAY ERROR:",
  err
);



$("status")
  .textContent =
  "LIVE DATA CONNECTION ERROR • RETRYING...";



$("loading")
  .textContent =
  "RECONNECTING...";

}

updating = false;

}

/* =========================================================
START
========================================================= */

update();

setInterval(
update,
1000
);

</script>
