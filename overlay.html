<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BGMI Esports Overlay</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/config.js"></script>
<script src="/supabase.js"></script>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:transparent;
  font-family:Inter,Segoe UI,Arial,sans-serif;
  color:white;
}

#stage{
  position:relative;
  width:1920px;
  height:1080px;
  transform-origin:top left;
}

@media(max-width:1920px){
  #stage{
    transform:scale(calc(100vw / 1920));
  }
}

@media(max-height:1080px){
  #stage{
    transform:scale(
      min(
        calc(100vw / 1920),
        calc(100vh / 1080)
      )
    );
  }
}

/* =========================
   BACKGROUND
========================= */

#stage:before{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(
      circle at 50% 48%,
      rgba(0,85,180,.20),
      transparent 42%
    ),
    radial-gradient(
      circle at 15% 60%,
      rgba(0,110,255,.13),
      transparent 35%
    ),
    radial-gradient(
      circle at 85% 35%,
      rgba(0,130,255,.10),
      transparent 32%
    );
  pointer-events:none;
}

/* =========================
   TOP BAR
========================= */

.topbar{
  position:absolute;
  left:34px;
  right:34px;
  top:28px;
  height:76px;

  display:flex;
  align-items:center;

  background:
    linear-gradient(
      90deg,
      rgba(3,7,15,.98),
      rgba(8,16,31,.96),
      rgba(3,7,15,.98)
    );

  border:1px solid rgba(0,150,255,.55);

  box-shadow:
    0 0 18px rgba(0,110,255,.28),
    inset 0 0 25px rgba(0,90,255,.08);

  clip-path:polygon(
    0 0,
    97% 0,
    100% 50%,
    97% 100%,
    0 100%,
    1.5% 50%
  );
}

.topLeft{
  width:330px;
  display:flex;
  align-items:center;
  gap:18px;
  padding-left:38px;
}

.liveDot{
  width:13px;
  height:13px;
  border-radius:50%;
  background:#ff2448;
  box-shadow:
    0 0 10px #ff2448,
    0 0 22px #ff2448;
  animation:pulse 1.1s infinite;
}

@keyframes pulse{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:.45;transform:scale(.75)}
}

.liveText{
  font-size:20px;
  font-weight:900;
  letter-spacing:2px;
}

.topCenter{
  flex:1;
  text-align:center;
}

.matchText{
  font-size:28px;
  font-weight:1000;
  letter-spacing:2px;
}

.matchText span{
  color:#ffd900;
}

.topRight{
  width:420px;
  display:flex;
  justify-content:flex-end;
  align-items:center;
  gap:18px;
  padding-right:40px;
}

.infoChip{
  padding:10px 18px;

  background:
    linear-gradient(
      180deg,
      rgba(0,102,210,.35),
      rgba(0,35,90,.55)
    );

  border:1px solid rgba(0,150,255,.55);

  font-size:16px;
  font-weight:800;
  letter-spacing:1px;

  clip-path:polygon(
    8px 0,
    100% 0,
    calc(100% - 8px) 100%,
    0 100%
  );
}

/* =========================
   ELIMINATION BANNER
========================= */

.elimination{
  position:absolute;

  left:50%;
  top:118px;

  width:660px;
  height:100px;

  transform:
    translateX(-50%)
    translateY(-150px);

  opacity:0;

  display:flex;
  align-items:center;

  padding:0 30px;

  background:
    linear-gradient(
      90deg,
      rgba(3,7,14,.98),
      rgba(18,27,48,.98),
      rgba(3,7,14,.98)
    );

  border:1px solid #ff2448;

  box-shadow:
    0 0 25px rgba(255,20,70,.55),
    inset 0 0 30px rgba(255,20,70,.08);

  clip-path:polygon(
    0 0,
    96% 0,
    100% 50%,
    96% 100%,
    0 100%,
    3% 50%
  );

  transition:
    transform .65s cubic-bezier(.16,1,.3,1),
    opacity .4s ease;

  z-index:50;
}

.elimination.show{
  transform:
    translateX(-50%)
    translateY(0);

  opacity:1;
}

.elimLogo{
  width:68px;
  height:68px;

  object-fit:contain;

  background:#070b13;
  border:2px solid #fff;

  padding:5px;

  margin-right:20px;

  box-shadow:
    0 0 15px rgba(255,255,255,.22);
}

.elimText{
  flex:1;
}

.elimSmall{
  font-size:15px;
  font-weight:900;
  color:#ff375a;
  letter-spacing:3px;
  margin-bottom:4px;
}

.elimName{
  font-size:27px;
  font-weight:1000;
  letter-spacing:1px;
}

.elimWord{
  font-size:17px;
  font-weight:1000;
  color:#ff2448;
  letter-spacing:2px;
}

/* =========================
   MAIN PANELS
========================= */

.panel{
  position:absolute;

  background:
    linear-gradient(
      180deg,
      rgba(4,9,18,.97),
      rgba(5,12,24,.94)
    );

  border:1px solid rgba(0,137,255,.55);

  box-shadow:
    0 15px 45px rgba(0,0,0,.55),
    inset 0 0 35px rgba(0,100,255,.06);

  overflow:hidden;
}

.panel:before{
  content:"";
  position:absolute;
  left:0;
  right:0;
  top:0;
  height:3px;

  background:
    linear-gradient(
      90deg,
      transparent,
      #008cff,
      #58c7ff,
      #008cff,
      transparent
    );

  box-shadow:0 0 12px #008cff;
}

.panelTitle{
  height:65px;

  display:flex;
  align-items:center;

  padding:0 24px;

  font-size:22px;
  font-weight:1000;
  letter-spacing:2px;

  background:
    linear-gradient(
      90deg,
      rgba(0,100,210,.30),
      rgba(0,40,100,.10),
      transparent
    );

  border-bottom:1px solid rgba(0,145,255,.25);
}

.titleLine{
  width:5px;
  height:28px;

  background:#00aaff;

  box-shadow:
    0 0 10px #00aaff;

  margin-right:13px;
}

/* =========================
   KILL FEED
========================= */

.killPanel{
  left:42px;
  top:135px;
  width:760px;
  height:790px;
}

#feed{
  padding:18px;
}

.killRow{
  position:relative;

  height:92px;

  display:flex;
  align-items:center;

  margin-bottom:11px;

  background:
    linear-gradient(
      90deg,
      rgba(10,22,42,.95),
      rgba(5,13,27,.90)
    );

  border:1px solid rgba(0,130,255,.28);

  overflow:hidden;

  animation:feedIn .35s ease both;
}

@keyframes feedIn{
  from{
    opacity:0;
    transform:translateX(-25px);
  }
  to{
    opacity:1;
    transform:translateX(0);
  }
}

.killRow:after{
  content:"";
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:4px;
  background:#008cff;
  box-shadow:0 0 12px #008cff;
}

.teamBox{
  width:68px;
  height:68px;

  margin-left:15px;

  background:#050a12;

  border:1px solid rgba(0,150,255,.45);

  display:flex;
  align-items:center;
  justify-content:center;
}

.teamBox img{
  width:58px;
  height:58px;
  object-fit:contain;
}

.player{
  width:205px;
  padding-left:15px;
}

.playerName{
  font-size:20px;
  font-weight:950;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.teamName{
  margin-top:4px;

  font-size:12px;
  font-weight:800;

  color:#7fa7d9;

  letter-spacing:1px;
}

.weapon{
  width:100px;
  text-align:center;

  font-size:12px;
  font-weight:900;

  color:#ffd900;

  letter-spacing:1px;
}

.weaponIcon{
  font-size:26px;
  display:block;
  margin-bottom:3px;
}

.victim{
  flex:1;

  text-align:right;

  padding-right:20px;
}

.victimName{
  font-size:18px;
  font-weight:900;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.victimTeam{
  font-size:12px;
  color:#738aaa;
  margin-top:4px;
}

/* =========================
   POINTS TABLE
========================= */

.pointsPanel{
  right:42px;
  top:135px;
  width:1075px;
  height:790px;
}

.tableHeader{
  display:grid;
  grid-template-columns:
    55px
    1fr
    75px
    75px
    90px
    105px;

  height:48px;

  align-items:center;

  padding:0 20px;

  color:#7ca4d2;

  font-size:13px;
  font-weight:1000;

  letter-spacing:1.5px;

  border-bottom:1px solid rgba(0,130,255,.25);
}

.tableRow{
  display:grid;

  grid-template-columns:
    55px
    1fr
    75px
    75px
    90px
    105px;

  height:51px;

  align-items:center;

  margin:0 10px;

  padding:0 10px;

  border-bottom:1px solid rgba(255,255,255,.055);

  font-size:15px;

  transition:.25s;
}

.tableRow:hover{
  background:rgba(0,110,255,.12);
}

.rank{
  font-size:18px;
  font-weight:1000;

  color:#a9bdd7;
}

.teamCell{
  display:flex;
  align-items:center;
  gap:13px;

  min-width:0;
}

.tableLogo{
  width:35px;
  height:35px;

  object-fit:contain;

  background:#050a11;

  border:1px solid rgba(255,255,255,.16);

  padding:3px;
}

.tableTeamName{
  font-weight:900;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.num{
  text-align:center;
  font-weight:900;
}

.total{
  text-align:center;

  font-size:18px;
  font-weight:1000;

  color:#fff;
}

.pts{
  text-align:center;

  font-size:17px;
  font-weight:1000;

  color:#ffd900;
}

.top1{
  background:
    linear-gradient(
      90deg,
      rgba(255,215,0,.13),
      transparent
    );

  border-left:3px solid #ffd900;
}

.top2{
  border-left:3px solid #cbd5e1;
}

.top3{
  border-left:3px solid #c4874b;
}

.eliminatedRow{
  opacity:.38;
  filter:grayscale(.75);
}

.eliminatedBadge{
  color:#ff365a;
  font-size:10px;
  font-weight:1000;
  margin-left:8px;
  letter-spacing:1px;
}

/* =========================
   BOTTOM CLEAN BAR
========================= */

.bottomBar{
  position:absolute;

  left:42px;
  right:42px;
  bottom:28px;

  height:62px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(0,60,130,.25),
      transparent
    );

  border-top:1px solid rgba(0,140,255,.35);
}

.bottomGlow{
  position:absolute;
  left:30%;
  right:30%;
  top:-2px;
  height:3px;

  background:#008cff;

  box-shadow:
    0 0 15px #008cff,
    0 0 30px #008cff;
}

/* =========================
   EMPTY STATE
========================= */

.empty{
  padding:35px;
  text-align:center;

  color:#496887;

  font-size:15px;
  font-weight:800;

  letter-spacing:2px;
}

/* =========================
   RESPONSIVE SAFETY
========================= */

@media(max-width:1400px){
  #stage{
    transform:scale(.72);
    transform-origin:top left;
  }
}
</style>
</head>

<body>

<div id="stage">

  <!-- TOP BAR -->
  <div class="topbar">

    <div class="topLeft">
      <div class="liveDot"></div>
      <div class="liveText">LIVE</div>
    </div>

    <div class="topCenter">
      <div class="matchText">
        <span id="matchTitle">MATCH 1</span>
        &nbsp; | &nbsp;
        <span id="groupTitle">GROUP A × B</span>
      </div>
    </div>

    <div class="topRight">
      <div class="infoChip" id="dayTitle">DAY 1</div>
      <div class="infoChip" id="mapTitle">ERANGEL</div>
    </div>

  </div>


  <!-- ELIMINATION -->
  <div id="elimination" class="elimination">

    <img id="elimLogo" class="elimLogo" src="">

    <div class="elimText">
      <div class="elimSmall">TEAM</div>
      <div id="elimName" class="elimName">TEAM NAME</div>
    </div>

    <div class="elimWord">
      ELIMINATED
    </div>

  </div>


  <!-- KILL FEED -->
  <section class="panel killPanel">

    <div class="panelTitle">
      <div class="titleLine"></div>
      KILL FEED
    </div>

    <div id="feed">
      <div class="empty">
        WAITING FOR KILLS...
      </div>
    </div>

  </section>


  <!-- POINTS TABLE -->
  <section class="panel pointsPanel">

    <div class="panelTitle">
      <div class="titleLine"></div>
      LIVE POINTS TABLE
    </div>

    <div class="tableHeader">
      <div>#</div>
      <div>TEAM</div>
      <div>PLACE</div>
      <div>KILLS</div>
      <div>FINISH</div>
      <div>POINTS</div>
    </div>

    <div id="pointsTable">
      <div class="empty">
        LOADING POINTS TABLE...
      </div>
    </div>

  </section>


  <!-- CLEAN BOTTOM -->
  <div class="bottomBar">
    <div class="bottomGlow"></div>
  </div>

</div>


<script>

/* ==========================================
   HELPERS
========================================== */

const $ = id => document.getElementById(id);

let lastEliminated = "";
let eliminationTimer = null;


/* ==========================================
   TEAM HELPERS
========================================== */

function teamList(c){

  if(!c) return [];

  if(Array.isArray(c.teams))
    return c.teams;

  if(c.roster && Array.isArray(c.roster.teams))
    return c.roster.teams;

  return [];
}


function teamName(team){

  if(!team) return "";

  return (
    team.name ||
    team.team_name ||
    team.title ||
    "UNKNOWN"
  );
}


function teamLogo(team){

  if(!team) return "";

  return (
    team.logo ||
    team.logo_url ||
    team.logoUrl ||
    ""
  );
}


function teamPlayers(team){

  if(!team) return [];

  if(Array.isArray(team.players))
    return team.players;

  if(Array.isArray(team.roster))
    return team.roster;

  return [];
}


/* ==========================================
   BROADCAST DATA
========================================== */

function broadcast(c){

  const b = c?.broadcast || {};

  $("matchTitle").textContent =
    b.match ||
    c.match ||
    "MATCH 1";

  $("groupTitle").textContent =
    b.group ||
    c.group ||
    "GROUP A × B";

  $("dayTitle").textContent =
    b.day ||
    c.day ||
    "DAY 1";

  $("mapTitle").textContent =
    b.map ||
    c.map ||
    "ERANGEL";
}


/* ==========================================
   FIND TEAM
========================================== */

function findTeam(c,name){

  const teams = teamList(c);

  const target = String(name || "")
    .trim()
    .toLowerCase();

  return teams.find(t => {

    const n = teamName(t)
      .trim()
      .toLowerCase();

    return n === target;

  }) || null;
}


/* ==========================================
   KILL FEED
========================================== */

function renderFeed(c,events){

  const feed = $("feed");

  if(!Array.isArray(events) || !events.length){

    feed.innerHTML = `
      <div class="empty">
        WAITING FOR KILLS...
      </div>
    `;

    return;
  }

  const teams = teamList(c);

  const sorted = [...events]
    .sort((a,b) =>
      new Date(b.time || 0) -
      new Date(a.time || 0)
    )
    .slice(0,8);


  feed.innerHTML = sorted.map((e,index)=>{

    const killer =
      e.killer ||
      e.p_killer ||
      e.killer_name ||
      "";

    const victim =
      e.victim ||
      e.p_victim ||
      e.victim_name ||
      "";

    const weapon =
      e.weapon ||
      e.p_weapon ||
      "GUN";


    const kt = findTeam(c,killer);
    const vt = findTeam(c,victim);


    return `
      <div class="killRow"
           style="animation-delay:${index*45}ms">

        <div class="teamBox">
          ${
            teamLogo(kt)
            ?
            `<img src="${teamLogo(kt)}">`
            :
            `<span>—</span>`
          }
        </div>

        <div class="player">

          <div class="playerName">
            ${escapeHTML(killer)}
          </div>

          <div class="teamName">
            ${escapeHTML(teamName(kt))}
          </div>

        </div>

        <div class="weapon">
          <span class="weaponIcon">⚔</span>
          ${escapeHTML(String(weapon))}
        </div>

        <div class="victim">

          <div class="victimName">
            ${escapeHTML(victim)}
          </div>

          <div class="victimTeam">
            ${escapeHTML(teamName(vt))}
          </div>

        </div>

      </div>
    `;

  }).join("");
}


/* ==========================================
   POINT TABLE
========================================== */

function renderTable(c,events){

  const teams = teamList(c);

  if(!teams.length){

    $("pointsTable").innerHTML = `
      <div class="empty">
        NO TEAMS CONFIGURED
      </div>
    `;

    return;
  }


  /*
     Count kills from available events.
  */

  const stats = {};


  teams.forEach(t=>{

    const n = teamName(t);

    stats[n] = {

      team:t,

      kills:0,

      placement:
        Number(
          t.placement ??
          t.place ??
          t.rank ??
          0
        ),

      eliminated:
        !!(
          t.eliminated ||
          t.is_eliminated ||
          t.alive === false
        )

    };

  });


  /*
     Current event kills.
  */

  if(Array.isArray(events)){

    events.forEach(e=>{

      const killer =
        e.killer ||
        e.p_killer ||
        e.killer_name ||
        "";

      const kt = findTeam(c,killer);

      if(!kt) return;

      const n = teamName(kt);

      if(stats[n])
        stats[n].kills++;

    });

  }


  /*
     Placement points.
     Custom points can be supplied from admin.
  */

  const placementPoints = [
    10,
    6,
    5,
    4,
    3,
    2,
    1
  ];


  Object.values(stats).forEach(s=>{

    let placePts = 0;

    if(s.placement > 0 &&
       s.placement <= placementPoints.length){

      placePts =
        placementPoints[s.placement-1];

    }

    /*
      Support custom points if team has them.
    */

    if(s.team.points !== undefined)
      placePts = Number(s.team.points) || 0;

    s.finish = placePts;

    s.total =
      placePts +
      s.kills;

  });


  const rows =
    Object.values(stats)
      .sort((a,b)=>{

        if(b.total !== a.total)
          return b.total-a.total;

        if(b.kills !== a.kills)
          return b.kills-a.kills;

        return teamName(a.team)
          .localeCompare(teamName(b.team));

      });


  $("pointsTable").innerHTML =
    rows.slice(0,20).map((s,i)=>{

      const rank=i+1;

      let rankClass="";

      if(rank===1) rankClass="top1";
      if(rank===2) rankClass="top2";
      if(rank===3) rankClass="top3";


      return `

        <div class="tableRow ${rankClass}
          ${s.eliminated ? "eliminatedRow":""}">

          <div class="rank">
            ${rank}
          </div>

          <div class="teamCell">

            ${
              teamLogo(s.team)
              ?
              `<img class="tableLogo"
                    src="${teamLogo(s.team)}">`
              :
              ""
            }

            <div class="tableTeamName">

              ${escapeHTML(teamName(s.team))}

              ${
                s.eliminated
                ?
                `<span class="eliminatedBadge">
                   ELIMINATED
                 </span>`
                :
                ""
              }

            </div>

          </div>

          <div class="num">
            ${
              s.placement
              ? s.placement
              : "-"
            }
          </div>

          <div class="num">
            ${s.kills}
          </div>

          <div class="num">
            ${s.finish}
          </div>

          <div class="pts">
            ${s.total}
          </div>

        </div>

      `;

    }).join("");

}


/* ==========================================
   ELIMINATION SYSTEM
========================================== */

function detectElimination(c){

  const teams = teamList(c);

  /*
     Direct admin/state elimination flag.
  */

  const eliminated =
    teams.filter(t =>
      t.eliminated === true ||
      t.is_eliminated === true ||
      t.alive === false
    );


  if(!eliminated.length)
    return;


  const newest =
    eliminated[eliminated.length-1];


  const name =
    teamName(newest);


  if(!name || name === lastEliminated)
    return;


  lastEliminated = name;

  showElimination(newest);


}


function showElimination(team){

  const box = $("elimination");

  $("elimName").textContent =
    teamName(team);

  const logo =
    teamLogo(team);

  if(logo){

    $("elimLogo").src=logo;
    $("elimLogo").style.display="block";

  }else{

    $("elimLogo").style.display="none";

  }


  clearTimeout(eliminationTimer);

  box.classList.add("show");


  eliminationTimer =
    setTimeout(()=>{

      box.classList.remove("show");

    },6500);

}


/* ==========================================
   ESCAPE
========================================== */

function escapeHTML(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* ==========================================
   MAIN LOOP
========================================== */

let loading=false;

async function tick(){

  if(loading)
    return;

  loading=true;

  try{

    const [
      c,
      events
    ] =
      await Promise.all([
        getState(),
        getEvents()
      ]);


    broadcast(c);

    renderFeed(c,events);

    renderTable(c,events);

    detectElimination(c);

  }catch(err){

    console.error(
      "OVERLAY ERROR:",
      err
    );

  }finally{

    loading=false;

  }

}


/* ==========================================
   START
========================================== */

tick();

setInterval(
  tick,
  1000
);

</script>

</body>
</html>
