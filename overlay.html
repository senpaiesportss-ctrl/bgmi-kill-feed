<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920,height=1080">
<title>BGMI Esports Overlay</title>

<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:transparent;
  font-family:Arial,Helvetica,sans-serif;
  color:#fff
}

#stage{
  position:relative;
  width:1920px;
  height:1080px;
  transform-origin:top left
}

@media(max-width:1920px){
  #stage{transform:scale(calc(100vw / 1920))}
}

@media(max-height:1080px){
  #stage{
    transform:scale(
      min(
        calc(100vw / 1920),
        calc(100vh / 1080)
      )
    )
  }
}

:root{
  --cyan:#19cfff;
  --blue:#087dff;
  --gold:#ffd52b;
  --panel:rgba(5,12,25,.96);
  --muted:#7894b8;
}

/* ================= TOP ================= */

.topbar{
  position:absolute;
  left:50%;
  top:24px;
  transform:translateX(-50%);

  width:520px;
  height:54px;

  display:flex;
  align-items:center;
  justify-content:center;
  gap:16px;

  padding:0 22px;

  background:
    linear-gradient(
      90deg,
      #050c1a,
      #071226,
      #050c1a
    );

  border:1px solid rgba(25,170,255,.55);

  clip-path:polygon(
    4% 0,
    96% 0,
    100% 50%,
    96% 100%,
    4% 100%,
    0 50%
  );

  box-shadow:0 0 18px rgba(0,150,255,.25);
}

.live{
  display:flex;
  align-items:center;
  gap:8px;

  background:#c91525;

  padding:7px 13px;

  font-size:15px;
  font-weight:1000;
  letter-spacing:2px;
}

.live i{
  width:8px;
  height:8px;
  background:#fff;
  border-radius:50%;
  box-shadow:0 0 9px #fff;
}

.matchblock{
  white-space:nowrap;
  line-height:1;
}

.matchtitle{
  font-size:20px;
  font-weight:1000;
}

.group{
  color:var(--gold);
  font-size:13px;
  font-weight:1000;
  margin-left:7px;
  letter-spacing:1px;
}

.day{
  color:#91a9c7;
  font-size:9px;
  font-weight:900;
  margin-left:8px;
}

.map{
  color:#91a9c7;
  font-size:9px;
  font-weight:900;
  margin-left:7px;
}

/* ================= KILL FEED ================= */

.feed{
  position:absolute;

  left:22px;
  top:82px;

  width:370px;

  background:var(--panel);

  border:1px solid rgba(25,170,255,.55);

  box-shadow:0 0 18px rgba(0,150,255,.22);
}

.feedHeader{
  height:38px;

  display:flex;
  align-items:center;

  padding:0 12px;

  border-bottom:1px solid rgba(25,170,255,.35);

  font-size:13px;
  font-weight:1000;
  letter-spacing:1.5px;
}

.feedHeader:before{
  content:"";
  width:3px;
  height:17px;

  margin-right:8px;

  background:var(--cyan);

  box-shadow:0 0 8px var(--cyan);
}

#feedRows{
  padding:7px;
}

.kill{
  height:47px;

  display:grid;

  grid-template-columns:
    30px
    minmax(0,1fr)
    48px
    minmax(0,1fr)
    30px;

  align-items:center;

  gap:5px;

  margin-bottom:5px;

  padding:0 5px;

  background:
    linear-gradient(
      90deg,
      rgba(12,28,49,.95),
      rgba(7,14,27,.9)
    );

  border:1px solid rgba(70,150,220,.16);
}

.logo{
  width:27px;
  height:27px;
  object-fit:contain;
}

.killer{
  text-align:right;

  font-size:9px;
  font-weight:1000;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.victim{
  text-align:left;

  font-size:9px;
  font-weight:1000;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.weapon{
  text-align:center;

  color:var(--gold);

  font-size:8px;
  font-weight:1000;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.waiting{
  height:48px;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#6b89ad;

  font-size:9px;
  font-weight:1000;

  letter-spacing:2px;
}

/* ================= POINTS ================= */

.points{
  position:absolute;

  right:22px;
  top:130px;

  width:390px;

  background:var(--panel);

  border:1px solid rgba(25,170,255,.55);

  box-shadow:0 0 18px rgba(0,150,255,.22);

  overflow:hidden;
}

.pointsHeader{
  height:46px;

  display:flex;
  align-items:center;

  padding:0 12px;

  border-bottom:1px solid rgba(31,166,255,.35);
}

.pointsHeader:before{
  content:"";
  width:3px;
  height:18px;

  margin-right:8px;

  background:var(--cyan);

  box-shadow:0 0 8px var(--cyan);
}

.pointsTitle{
  font-size:14px;
  font-weight:1000;
  letter-spacing:1.3px;
}

.pointsMini{
  color:#7797bd;
  font-size:8px;
  font-weight:900;
  margin-top:3px;
}

.liveTag{
  margin-left:auto;

  color:#ff5360;

  font-size:8px;
  font-weight:1000;
}

.columns{
  height:27px;

  display:grid;

  grid-template-columns:
    28px
    1fr
    48px
    68px
    55px;

  align-items:center;

  color:#7797bd;

  font-size:8px;
  font-weight:1000;

  border-bottom:1px solid rgba(255,255,255,.08);
}

.columns div{
  text-align:center;
}

.columns div:nth-child(2){
  text-align:left;
}

#table{
  padding:5px 7px 7px;
}

.row{
  height:38px;

  display:grid;

  grid-template-columns:
    28px
    1fr
    48px
    68px
    55px;

  align-items:center;

  margin:2px 0;

  padding:0 5px;

  background:
    linear-gradient(
      90deg,
      rgba(9,23,43,.95),
      rgba(7,14,28,.72)
    );

  border:1px solid rgba(70,150,220,.12);
}

.row:first-child{
  border-color:rgba(255,213,43,.55);
}

.rank{
  text-align:center;
  font-size:10px;
  font-weight:1000;
}

.team{
  display:flex;
  align-items:center;
  gap:7px;
  min-width:0;
}

.team img{
  width:27px;
  height:27px;
  object-fit:contain;
}

.teamName{
  min-width:0;

  font-size:9px;
  font-weight:1000;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.num{
  text-align:center;

  font-size:10px;
  font-weight:1000;
}

.pts{
  text-align:center;

  color:var(--gold);

  font-size:12px;
  font-weight:1000;
}

.noData{
  height:50px;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#6b89ad;

  font-size:9px;
  font-weight:1000;

  letter-spacing:2px;
}

/* ================= ELIMINATION ================= */

#elim{
  position:absolute;

  left:50%;
  top:92px;

  transform:translateX(-50%);

  width:720px;
  height:120px;

  display:none;

  align-items:center;

  background:
    linear-gradient(
      90deg,
      rgba(80,5,14,.98),
      rgba(25,5,10,.98),
      rgba(80,5,14,.98)
    );

  border:1px solid rgba(255,45,65,.85);

  box-shadow:
    0 0 30px rgba(255,25,50,.45);

  z-index:100;
}

#elimLogo{
  width:70px;
  height:70px;

  object-fit:contain;

  margin-left:45px;
}

.elimText{
  flex:1;

  text-align:center;

  margin-left:20px;
}

.elimSmall{
  color:#ff304e;

  font-size:9px;
  font-weight:1000;

  letter-spacing:3px;
}

#elimName{
  margin-top:5px;

  font-size:25px;
  font-weight:1000;

  letter-spacing:1px;
}

/* ================= STATUS ================= */

#status{
  position:absolute;

  left:22px;
  bottom:25px;

  color:#587594;

  font-size:9px;
  font-weight:800;

  letter-spacing:1.5px;
}
</style>
</head>

<body>

<div id="stage">

  <!-- TOP -->

  <div class="topbar">

    <div class="live">
      <i></i>
      LIVE
    </div>

    <div class="matchblock">

      <span
        id="matchTitle"
        class="matchtitle">
        MATCH 1
      </span>

      <span
        id="groupTitle"
        class="group">
        GROUP A × B
      </span>

      <span
        id="dayTitle"
        class="day">
        DAY 1
      </span>

      <span
        id="mapTitle"
        class="map">
        ERANGEL
      </span>

    </div>

  </div>


  <!-- KILL FEED -->

  <section class="feed">

    <div class="feedHeader">
      KILL FEED
    </div>

    <div id="feedRows">

      <div class="waiting">
        WAITING FOR KILLS...
      </div>

    </div>

  </section>


  <!-- POINTS TABLE -->

  <section class="points">

    <div class="pointsHeader">

      <div>

        <div class="pointsTitle">
          LIVE POINTS TABLE
        </div>

        <div class="pointsMini">
          BGMI •
          <span id="pointsMap">
            ERANGEL
          </span>
        </div>

      </div>

      <div class="liveTag">
        • LIVE
      </div>

    </div>


    <div class="columns">
      <div>#</div>
      <div>TEAM</div>
      <div>KILLS</div>
      <div>PLACEMENT</div>
      <div>TOTAL</div>
    </div>


    <div id="table">

      <div class="noData">
        LOADING...
      </div>

    </div>

  </section>


  <!-- TEAM ELIMINATED -->

  <div id="elim">

    <img
      id="elimLogo"
      src=""
    >

    <div class="elimText">

      <div class="elimSmall">
        TEAM ELIMINATED
      </div>

      <div id="elimName">
        TEAM NAME
      </div>

    </div>

  </div>


  <div id="status">
    CONNECTING...
  </div>

</div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const CFG =
  window.KF_CONFIG || {};

const SUPABASE_URL =
  CFG.SUPABASE_URL ||
  "https://nuywberanlfvngjnjcpx.supabase.co";

const SUPABASE_KEY =
  CFG.SUPABASE_PUBLISHABLE_KEY || "";

const ROOM =
  localStorage.getItem("kf_room") ||
  "ADITYA8029";

const db =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

const $ =
  id => document.getElementById(id);


/* =========================================================
   RPC
========================================================= */

async function rpc(name,params){

  const result =
    await db.rpc(
      name,
      params
    );

  if(result.error)
    throw result.error;

  return result.data;
}


async function getState(){

  return rpc(
    "kf_get_state",
    {
      p_room_code:ROOM
    }
  );

}


async function getEvents(){

  return rpc(
    "kf_events",
    {
      p_room_code:ROOM
    }
  );

}


/* =========================================================
   HELPERS
========================================================= */

function list(v){

  if(Array.isArray(v))
    return v;

  return [];
}


function esc(v){

  return String(v ?? "")
    .replace(
      /[&<>"']/g,
      x => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[x])
    );

}


/* =========================================================
   TEAMS
========================================================= */

function teams(c){

  const t =
    c?.teams;

  if(Array.isArray(t))
    return t;

  if(
    t &&
    typeof t === "object"
  ){

    return Object.entries(t)
      .map(
        ([key,value]) => {

          if(
            value &&
            typeof value === "object"
          ){

            return {
              ...value,
              name:
                value.name ||
                key,
              short:
                value.short ||
                value.tag ||
                key
            };

          }

          return {
            name:key,
            short:key
          };

        }
      );

  }

  return [];
}


function tName(t){

  return (
    t?.name ||
    t?.team ||
    t?.short ||
    t?.tag ||
    "UNKNOWN"
  );

}


function tShort(t){

  return (
    t?.short ||
    t?.tag ||
    t?.abbr ||
    tName(t)
  );

}


function tLogo(t){

  return (
    t?.logo ||
    t?.logo_url ||
    t?.image ||
    t?.image_url ||
    ""
  );

}


function players(t){

  const p =
    t?.players ??
    t?.members ??
    t?.roster ??
    [];

  if(Array.isArray(p)){

    return p
      .map(
        x =>
          typeof x === "string"
          ? x
          : (
              x?.name ||
              x?.ign ||
              x?.player ||
              ""
            )
      )
      .filter(Boolean);

  }

  if(
    p &&
    typeof p === "object"
  ){

    return Object.values(p)
      .map(
        x =>
          typeof x === "string"
          ? x
          : (
              x?.name ||
              x?.ign ||
              x?.player ||
              ""
            )
      )
      .filter(Boolean);

  }

  return [];
}


/* =========================================================
   PLAYER -> TEAM
========================================================= */

function findTeam(c,name){

  const needle =
    String(name || "")
      .trim()
      .toLowerCase();

  if(!needle)
    return null;

  const all =
    teams(c);


  /* Exact */

  for(
    const t of all
  ){

    if(
      players(t).some(
        p =>
          String(p)
            .trim()
            .toLowerCase()
          === needle
      )
    )
      return t;

  }


  /* Partial */

  for(
    const t of all
  ){

    if(
      players(t).some(
        p => {

          const x =
            String(p)
              .trim()
              .toLowerCase();

          return (
            needle.includes(x) ||
            x.includes(needle)
          );

        }
      )
    )
      return t;

  }

  return null;
}


/* =========================================================
   EVENTS
========================================================= */

function eventKiller(e){

  return (
    e?.killer ??
    e?.p_killer ??
    e?.killer_name ??
    e?.attacker ??
    e?.killerName ??
    e?.data?.killer ??
    ""
  );

}


function eventVictim(e){

  return (
    e?.victim ??
    e?.p_victim ??
    e?.victim_name ??
    e?.target ??
    e?.victimName ??
    e?.data?.victim ??
    ""
  );

}


function eventWeapon(e){

  return (
    e?.weapon ??
    e?.p_weapon ??
    e?.weapon_name ??
    e?.weaponName ??
    e?.data?.weapon ??
    "GUN"
  );

}


function eventTime(e){

  return (
    e?.created_at ||
    e?.time ||
    e?.timestamp ||
    e?.createdAt ||
    ""
  );

}


/* =========================================================
   IMPORTANT:
   kf_events can return different shapes.
   Normalize everything here.
========================================================= */

function normalizeEvents(raw){

  if(Array.isArray(raw))
    return raw;

  if(
    raw &&
    Array.isArray(raw.events)
  )
    return raw.events;

  if(
    raw &&
    Array.isArray(raw.data)
  )
    return raw.data;

  if(
    raw &&
    raw.result &&
    Array.isArray(raw.result)
  )
    return raw.result;

  return [];
}


/* =========================================================
   KILL FEED
========================================================= */

function renderFeed(c,raw){

  const events =
    normalizeEvents(raw);


  const rows =
    events
      .slice(0,7);


  if(!rows.length){

    $("feedRows").innerHTML =
      `
      <div class="waiting">
        WAITING FOR KILLS...
      </div>
      `;

    return;
  }


  $("feedRows").innerHTML =
    rows.map(
      e => {

        const killer =
          eventKiller(e);

        const victim =
          eventVictim(e);

        const weapon =
          eventWeapon(e);


        const kt =
          findTeam(
            c,
            killer
          );

        const vt =
          findTeam(
            c,
            victim
          );


        const kl =
          tLogo(kt);

        const vl =
          tLogo(vt);


        return `

        <div class="kill">

          ${
            kl
            ?
            `
            <img
              class="logo"
              src="${esc(kl)}"
              onerror="
                this.style.display='none'
              "
            >
            `
            :
            `<div></div>`
          }


          <div
            class="killer"
            title="${esc(killer)}">

            ${esc(killer || "UNKNOWN")}

          </div>


          <div
            class="weapon"
            title="${esc(weapon)}">

            ${esc(weapon)}

          </div>


          <div
            class="victim"
            title="${esc(victim)}">

            ${esc(victim || "UNKNOWN")}

          </div>


          ${
            vl
            ?
            `
            <img
              class="logo"
              src="${esc(vl)}"
              onerror="
                this.style.display='none'
              "
            >
            `
            :
            `<div></div>`
          }

        </div>

        `;

      }
    ).join("");

}


/* =========================================================
   KILL TOTALS
========================================================= */

const storageKey =
  "bgmi_kills_" +
  ROOM;


let killTotals = {};


try{

  killTotals =
    JSON.parse(
      localStorage.getItem(
        storageKey
      ) || "{}"
    ) || {};

}catch{

  killTotals = {};

}


function updateKills(c,raw){

  const events =
    normalizeEvents(raw);


  events.forEach(
    e => {

      const killer =
        eventKiller(e);

      const team =
        findTeam(
          c,
          killer
        );

      if(!team)
        return;


      const name =
        tName(team);


      if(!killTotals[name])
        killTotals[name] = {
          kills:0,
          ids:{}
        };


      const id =
        String(
          e?.id ??
          `${eventTime(e)}|${killer}|${eventVictim(e)}`
        );


      if(
        !killTotals[name]
          .ids[id]
      ){

        killTotals[name].kills++;

        killTotals[name].ids[id] =
          true;

      }

    }
  );


  try{

    localStorage.setItem(
      storageKey,
      JSON.stringify(
        killTotals
      )
    );

  }catch{}

}


/* =========================================================
   POINTS
========================================================= */

function num(v){

  const n =
    Number(v);

  return Number.isFinite(n)
    ? n
    : 0;

}


function placement(t){

  return num(
    t?.placement ??
    t?.placement_points ??
    t?.place_points ??
    0
  );

}


function kills(t){

  const name =
    tName(t);

  return (
    killTotals[name]?.kills ||
    num(t?.kills) ||
    0
  );

}


function renderTable(c){

  const all =
    teams(c);


  if(!all.length){

    $("table").innerHTML =
      `
      <div class="noData">
        NO TEAM DATA
      </div>
      `;

    return;
  }


  const rows =
    all.map(
      (t,index) => {

        const k =
          kills(t);

        const p =
          placement(t);

        return {
          t,
          k,
          p,
          total:k+p,
          index
        };

      }
    )
    .sort(
      (a,b) =>
        b.total-a.total ||
        b.k-a.k ||
        a.index-b.index
    )
    .slice(0,16);


  $("table").innerHTML =
    rows.map(
      (r,index) => {

        const logo =
          tLogo(r.t);


        return `

        <div class="row">

          <div class="rank">
            ${index+1}
          </div>


          <div class="team">

            ${
              logo
              ?
              `
              <img
                src="${esc(logo)}"
                onerror="
                  this.style.display='none'
                "
              >
              `
              :
              ""
            }

            <div class="teamName">
              ${esc(tShort(r.t))}
            </div>

          </div>


          <div class="num">
            ${r.k}
          </div>


          <div class="num">
            ${r.p}
          </div>


          <div class="pts">
            ${r.total}
          </div>

        </div>

        `;

      }
    ).join("");

}


/* =========================================================
   BROADCAST
========================================================= */

function broadcast(c){

  const b =
    c?.broadcast || {};

  return {

    match:
      b.match ||
      c?.match ||
      c?.match_name ||
      "MATCH 1",

    group:
      b.group ||
      c?.group ||
      c?.group_name ||
      "GROUP A × B",

    day:
      b.day ||
      c?.day ||
      "DAY 1",

    map:
      b.map ||
      c?.map ||
      "ERANGEL"

  };

}


/* =========================================================
   ELIMINATION
========================================================= */

const alreadyShown =
  new Set();

let eliminationTimer =
  null;


function eliminated(t){

  if(
    t?.eliminated === true ||
    t?.is_eliminated === true
  )
    return true;


  if(
    String(
      t?.status || ""
    ).toLowerCase()
    === "eliminated"
  )
    return true;


  const alive =
    t?.alive ??
    t?.alive_count ??
    t?.players_alive ??
    t?.alivePlayers;


  if(
    alive !== undefined &&
    alive !== null &&
    Number(alive) <= 0
  )
    return true;


  return false;
}


function showElimination(t){

  const name =
    tName(t);

  const logo =
    tLogo(t);


  $("elimName")
    .textContent =
    name;


  if(logo){

    $("elimLogo").src =
      logo;

    $("elimLogo").style.display =
      "block";

  }else{

    $("elimLogo").style.display =
      "none";

  }


  $("elim")
    .style.display =
    "flex";


  clearTimeout(
    eliminationTimer
  );


  eliminationTimer =
    setTimeout(
      () => {

        $("elim")
          .style.display =
          "none";

      },
      5000
    );

}


function checkEliminations(c){

  teams(c).forEach(
    t => {

      if(
        !eliminated(t)
      )
        return;


      const name =
        tName(t);


      if(
        alreadyShown.has(name)
      )
        return;


      alreadyShown.add(name);

      showElimination(t);

    }
  );

}


/* =========================================================
   MAIN LOOP
========================================================= */

let running =
  false;


async function update(){

  if(running)
    return;

  running = true;


  try{

    const state =
      await getState();


    const rawEvents =
      await getEvents();


    const c =
      state?.config ??
      state?.state ??
      state;


    const eventData =
      normalizeEvents(
        rawEvents
      );


    /* BROADCAST */

    const b =
      broadcast(c);


    $("matchTitle")
      .textContent =
      b.match;

    $("groupTitle")
      .textContent =
      b.group;

    $("dayTitle")
      .textContent =
      b.day;

    $("mapTitle")
      .textContent =
      b.map;

    $("pointsMap")
      .textContent =
      b.map;


    /* KILLS */

    updateKills(
      c,
      eventData
    );


    renderFeed(
      c,
      eventData
    );


    /* POINTS */

    renderTable(c);


    /* ELIMINATION */

    checkEliminations(c);


    $("status")
      .textContent =
      "LIVE SYNC • ROOM " +
      ROOM +
      " • AUTO UPDATE";


  }catch(error){

    console.error(
      "BGMI OVERLAY ERROR:",
      error
    );


    $("status")
      .textContent =
      "LIVE DATA ERROR • RETRYING...";

  }


  running =
    false;

}


/* START */

update();

setInterval(
  update,
  1000
);

</script>
