<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920,height=1080">
<title>Senpai Esports • BGMI Broadcast</title>

<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:transparent;
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
}

#stage{
  position:relative;
  width:1920px;
  height:1080px;
  transform-origin:top left;
}

@media(max-width:1920px){
  #stage{
    transform:scale(calc(100vw / 1920));
  }
}

@media(max-height:1080px){
  #stage{
    transform:scale(
      min(
        calc(100vw / 1920),
        calc(100vh / 1080)
      )
    );
  }
}

:root{
  --blue:#087dff;
  --cyan:#19cfff;
  --deep:#050914;
  --panel:rgba(4,10,22,.95);
  --gold:#ffd52b;
  --white:#f7fbff;
  --muted:#93a9c7;
  --line:rgba(35,166,255,.5);
}

.tech{
  background:
    linear-gradient(
      90deg,
      rgba(5,12,26,.98),
      rgba(7,18,38,.96),
      rgba(5,12,26,.98)
    );

  border:1px solid rgba(25,170,255,.45);
  position:relative;
}

.tech:before{
  content:"";
  position:absolute;
  left:0;
  right:0;
  top:-1px;
  height:2px;

  background:
    linear-gradient(
      90deg,
      transparent,
      #16bfff,
      #fff,
      #16bfff,
      transparent
    );

  box-shadow:0 0 10px #09bfff;
}

.glow{
  box-shadow:
    0 0 18px rgba(0,150,255,.22),
    inset 0 0 20px rgba(0,100,255,.05);
}

.topbar{
  position:absolute;
  left:50%;
  top:24px;
  width:520px;
  height:54px;

  transform:translateX(-50%);

  display:flex;
  align-items:center;
  justify-content:center;

  gap:16px;
  padding:0 22px;

  clip-path:
    polygon(
      4% 0,
      96% 0,
      100% 50%,
      96% 100%,
      4% 100%,
      0 50%
    );
}

.live{
  display:flex;
  align-items:center;
  gap:8px;

  background:#c91525;
  padding:7px 13px;

  font-size:15px;
  font-weight:1000;
  letter-spacing:2px;
}

.live i{
  width:8px;
  height:8px;
  background:#fff;
  border-radius:50%;
  box-shadow:0 0 9px #fff;
}

.matchblock{
  line-height:1.05;
  text-align:center;
}

.matchtitle{
  font-size:21px;
  font-weight:1000;
  letter-spacing:1px;
  display:inline;
}

.group{
  display:inline;
  font-size:14px;
  color:var(--gold);
  font-weight:900;
  letter-spacing:2px;
  margin-left:5px;
}

.day{
  display:inline;
  font-size:9px;
  color:#8ca8ca;
  font-weight:900;
  margin-left:8px;
  letter-spacing:1px;
}

.map{
  display:inline;
  font-size:9px;
  color:#8ca8ca;
  font-weight:900;
  margin-left:7px;
  letter-spacing:1px;
}

.feedWrap{
  position:absolute;
  left:22px;
  top:82px;
  width:370px;

  background:var(--panel);
  border:1px solid rgba(25,170,255,.55);

  box-shadow:
    0 0 18px rgba(0,150,255,.22);

  overflow:hidden;

  transition:
    opacity .25s ease,
    transform .25s ease;
}

.feedWrap.hidden{
  opacity:0;
  transform:translateX(-15px);
  pointer-events:none;
}

.feedHeader{
  height:38px;

  display:flex;
  align-items:center;

  padding:0 12px;

  border-bottom:
    1px solid rgba(25,170,255,.35);

  font-size:13px;
  font-weight:1000;
  letter-spacing:1.5px;
}

.feedHeader:before{
  content:"";

  width:3px;
  height:17px;

  margin-right:8px;

  background:var(--cyan);

  box-shadow:
    0 0 8px var(--cyan);
}

#feedRows{
  padding:7px;
}

.killRow{
  height:47px;

  display:grid;

  grid-template-columns:
    30px
    minmax(0,1fr)
    55px
    minmax(0,1fr)
    30px;

  align-items:center;

  gap:5px;
  padding:0 5px;

  background:
    linear-gradient(
      90deg,
      rgba(12,28,49,.97),
      rgba(7,14,27,.95)
    );

  border:
    1px solid rgba(70,150,220,.18);

  animation:
    killIn .22s ease-out;
}

@keyframes killIn{
  from{
    opacity:0;
    transform:translateX(-12px);
  }

  to{
    opacity:1;
    transform:translateX(0);
  }
}

.killLogo{
  width:27px;
  height:27px;
  object-fit:contain;
}

.killer{
  text-align:right;
  font-size:9px;
  font-weight:1000;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.victim{
  text-align:left;
  font-size:9px;
  font-weight:1000;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.weapon{
  text-align:center;
  color:var(--gold);
  font-size:8px;
  font-weight:1000;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.points{
  position:absolute;

  right:22px;
  top:130px;

  width:390px;
  max-height:790px;

  padding:12px 12px 10px;
  overflow:hidden;
}

.pointsHeader{
  height:46px;

  display:flex;
  align-items:center;

  border-bottom:
    1px solid rgba(31,166,255,.35);

  position:relative;
}

.pointsHeader:before{
  content:"";

  width:3px;
  height:18px;

  margin-right:8px;

  background:var(--cyan);

  box-shadow:
    0 0 8px var(--cyan);
}

.pointsTitle{
  font-size:16px;
  font-weight:1000;
  letter-spacing:1.4px;
}

.pointsMini{
  font-size:9px;
  color:#8ca8ca;
  letter-spacing:1.5px;
  margin-top:3px;
}

.liveTag{
  margin-left:auto;

  color:#ff5360;
  font-size:9px;
  font-weight:1000;
  letter-spacing:1px;
}

.columns,
.prow{
  display:grid;

  grid-template-columns:
    28px
    1fr
    48px
    68px
    55px;

  align-items:center;
}

.columns{
  height:27px;

  color:#7797bd;
  font-size:8px;
  font-weight:1000;
  letter-spacing:.8px;

  border-bottom:
    1px solid rgba(255,255,255,.08);
}

.columns div{
  text-align:center;
}

.columns div:nth-child(2){
  text-align:left;
}

.prow{
  height:38px;

  margin:2px 0;
  padding:0 5px;

  background:
    linear-gradient(
      90deg,
      rgba(9,23,43,.95),
      rgba(7,14,28,.72)
    );

  border:
    1px solid rgba(70,150,220,.12);
}

.prow:first-child{
  border-color:
    rgba(255,213,43,.55);

  background:
    linear-gradient(
      90deg,
      rgba(90,68,8,.34),
      rgba(7,14,28,.8)
    );
}

.rank{
  font-size:10px;
  font-weight:1000;
  color:#9db4d0;
  text-align:center;
}

.prow:first-child .rank{
  color:var(--gold);
}

.team{
  display:flex;
  align-items:center;
  gap:7px;
  min-width:0;
}

.team img{
  width:27px;
  height:27px;
  object-fit:contain;
}

.team b{
  font-size:9px;
  font-weight:1000;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.num{
  font-size:10px;
  font-weight:1000;
  text-align:center;
}

.pts{
  font-size:12px;
  font-weight:1000;
  color:var(--gold);
  text-align:center;
}

#elimBanner{
  position:absolute;

  left:50%;
  top:92px;

  transform:translateX(-50%);

  width:720px;
  height:120px;

  display:none;

  align-items:center;
  justify-content:center;

  background:
    linear-gradient(
      90deg,
      rgba(78,5,14,.98),
      rgba(24,4,10,.98),
      rgba(78,5,14,.98)
    );

  border:
    1px solid rgba(255,40,60,.9);

  box-shadow:
    0 0 30px rgba(255,25,50,.45);

  z-index:100;

  animation:
    elimIn .25s ease-out;
}

@keyframes elimIn{
  from{
    opacity:0;
    transform:
      translateX(-50%)
      scale(.94);
  }

  to{
    opacity:1;
    transform:
      translateX(-50%)
      scale(1);
  }
}

#elimLogo{
  position:absolute;

  left:47px;
  top:25px;

  width:70px;
  height:70px;

  object-fit:contain;
  z-index:2;
}

#elimTag{
  position:absolute;

  left:150px;
  right:90px;

  top:38px;

  text-align:center;

  color:#ff304e;

  font-size:9px;
  font-weight:1000;
  letter-spacing:3px;

  z-index:3;
}

#elimName{
  position:absolute;

  left:150px;
  right:90px;

  top:68px;

  transform:translateY(-50%);

  text-align:center;

  color:#fff;

  font-size:23px;
  font-weight:1000;
  letter-spacing:1.2px;

  text-shadow:
    0 2px 8px #000;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;

  z-index:3;
}

#status{
  position:absolute;

  left:44px;
  bottom:120px;

  font-size:11px;
  color:#587594;

  letter-spacing:1.5px;
  font-weight:800;
}

#loading{
  position:absolute;

  inset:0;

  display:grid;
  place-items:center;

  color:#8da8c8;

  font-size:18px;
  letter-spacing:3px;
  font-weight:900;

  background:rgba(0,0,0,.05);

  pointer-events:none;
}
</style>
</head>

<body>

<div id="stage">

<div class="topbar tech glow">

  <div class="live">
    <i></i>
    LIVE
  </div>

  <div class="matchblock">

    <span
      class="matchtitle"
      id="matchTitle">
      MATCH 1
    </span>

    <span
      class="group"
      id="groupTitle">
      GROUP A × B
    </span>

    <span
      class="day"
      id="dayTitle">
      DAY 1
    </span>

    <span
      class="map"
      id="mapTitle">
      ERANGEL
    </span>

  </div>

</div>

<section
  id="feedWrap"
  class="feedWrap">

  <div class="feedHeader">
    KILL FEED
  </div>

  <div id="feedRows"></div>

</section>

<section
  class="points tech glow">

  <div class="pointsHeader">

    <div>

      <div class="pointsTitle">
        LIVE POINTS TABLE
      </div>

      <div class="pointsMini">
        BGMI •
        <span id="mapMini">
          ERANGEL
        </span>
      </div>

    </div>

    <div class="liveTag">
      • LIVE
    </div>

  </div>

  <div class="columns">

    <div>#</div>
    <div>TEAM</div>
    <div>KILLS</div>
    <div>PLACEMENT</div>
    <div>TOTAL</div>

  </div>

  <div id="table"></div>

</section>

<div id="elimBanner">

  <img
    id="elimLogo"
    src=""
    onerror="
      this.style.visibility='hidden'
    "
  >

  <div id="elimTag">
    TEAM ELIMINATED
  </div>

  <div id="elimName">
    TEAM NAME
  </div>

</div>

<div id="loading">
  LOADING BROADCAST…
</div>

</div>

<script>

const CFG =
  window.KF_CONFIG || {};

const SUPABASE_URL =
  CFG.SUPABASE_URL ||
  "https://nuywberanlfvngjnjcpx.supabase.co";

const SUPABASE_KEY =
  CFG.SUPABASE_PUBLISHABLE_KEY || "";

const ROOM =
  localStorage.getItem("kf_room") ||
  "ADITYA8029";

const sb =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

const $ =
  id =>
    document.getElementById(id);

function esc(v){

  return String(v ?? "")
    .replace(
      /[&<>"']/g,
      m =>
        ({
          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#039;"
        }[m])
    );

}

function arr(v){

  return Array.isArray(v)
    ? v
    : [];

}

async function rpc(
  name,
  params
){

  const r =
    await sb.rpc(
      name,
      params
    );

  if(r.error)
    throw r.error;

  return r.data;

}

async function getState(){

  return rpc(
    "kf_get_state",
    {
      p_room_code:ROOM
    }
  );

}

async function getEvents(){

  return rpc(
    "kf_events",
    {
      p_room_code:ROOM
    }
  );

}

function teamsFromConfig(c){

  const t =
    c?.teams;

  if(Array.isArray(t))
    return t;

  if(
    t &&
    typeof t === "object"
  ){

    return Object.entries(t)
      .map(
        ([key,val]) => {

          if(
            val &&
            typeof val === "object"
          ){

            return {
              ...val,

              name:
                val.name ||
                key,

              short:
                val.short ||
                val.tag ||
                val.abbr ||
                key
            };

          }

          return {
            name:key,
            short:key
          };

        }
      );

  }

  return [];

}

function teamName(t){

  return (
    t?.name ||
    t?.team ||
    t?.short ||
    t?.tag ||
    "UNKNOWN"
  );

}

function teamShort(t){

  return (
    t?.short ||
    t?.tag ||
    t?.abbr ||
    teamName(t)
  );

}

function teamLogo(t){

  return (
    t?.logo ||
    t?.logo_url ||
    t?.image ||
    t?.image_url ||
    ""
  );

}

function teamPlayers(t){

  const p =
    t?.players ??
    t?.members ??
    t?.roster ??
    [];

  if(Array.isArray(p)){

    return p
      .map(
        x =>
          typeof x === "string"
          ? x
          : (
              x?.name ||
              x?.ign ||
              x?.player ||
              ""
            )
      )
      .filter(Boolean);

  }

  if(
    p &&
    typeof p === "object"
  ){

    return Object.values(p)
      .map(
        x =>
          typeof x === "string"
          ? x
          : (
              x?.name ||
              x?.ign ||
              x?.player ||
              ""
            )
      )
      .filter(Boolean);

  }

  return [];

}

function findTeam(
  c,
  player
){

  const p =
    String(player || "")
      .trim()
      .toLowerCase();

  if(!p)
    return null;

  const teams =
    teamsFromConfig(c);

  const exact =
    teams.find(
      t =>
        teamPlayers(t)
          .some(
            x =>
              String(x)
                .trim()
                .toLowerCase()
              === p
          )
    );

  if(exact)
    return exact;

  const partial =
    teams.find(
      t =>
        teamPlayers(t)
          .some(
            x => {

              const a = p;

              const b =
                String(x)
                  .trim()
                  .toLowerCase();

              return (
                a.includes(b) ||
                b.includes(a)
              );

            }
          )
    );

  return partial || null;

}

function eventTime(e){

  return (
    new Date(
      e?.time ||
      e?.created_at ||
      e?.timestamp ||
      0
    ).getTime()
    || 0
  );

}

function eventKiller(e){

  return (
    e?.killer ||
    e?.p_killer ||
    e?.killer_name ||
    e?.attacker ||
    e?.killerName ||
    e?.data?.killer ||
    ""
  );

}

function eventVictim(e){

  return (
    e?.victim ||
    e?.p_victim ||
    e?.victim_name ||
    e?.target ||
    e?.victimName ||
    e?.data?.victim ||
    ""
  );

}

function eventWeapon(e){

  return (
    e?.weapon ||
    e?.p_weapon ||
    e?.weapon_name ||
    e?.weaponName ||
    e?.data?.weapon ||
    "GUN"
  );

}

function normalizeEvents(raw){

  if(Array.isArray(raw))
    return raw;

  if(
    raw &&
    Array.isArray(raw.events)
  )
    return raw.events;

  if(
    raw &&
    Array.isArray(raw.data)
  )
    return raw.data;

  if(
    raw &&
    Array.isArray(raw.result)
  )
    return raw.result;

  return [];

}

function eventKey(e){

  if(
    e?.id !== undefined &&
    e?.id !== null
  ){

    return "ID:" +
      String(e.id);

  }

  return [
    eventTime(e),
    eventKiller(e),
    eventVictim(e),
    eventWeapon(e)
  ].join("|");

}

function uniqueEvents(raw){

  const source =
    normalizeEvents(raw);

  const seen =
    new Set();

  const out = [];

  for(
    const e of source
  ){

    const key =
      eventKey(e);

    if(
      seen.has(key)
    )
      continue;

    seen.add(key);
    out.push(e);

  }

  return out;

}

function sortedEvents(raw){

  return uniqueEvents(raw)
    .sort(
      (a,b) =>
        eventTime(b) -
        eventTime(a)
    );

}

let feedTimer =
  null;

let lastFeedKey =
  "";

function hideFeed(){

  $("feedWrap")
    .classList
    .add("hidden");

}

function showKillFeed(
  c,
  raw
){

  const events =
    sortedEvents(raw);

  if(!events.length){

    hideFeed();

    return;

  }

  const e =
    events[0];

  const key =
    eventKey(e);

  if(
    key === lastFeedKey
  )
    return;

  lastFeedKey =
    key;

  const killer =
    eventKiller(e);

  const victim =
    eventVictim(e);

  const weapon =
    eventWeapon(e);

  const killerTeam =
    findTeam(
      c,
      killer
    );

  const victimTeam =
    findTeam(
      c,
      victim
    );

  const killerLogo =
    teamLogo(
      killerTeam
    );

  const victimLogo =
    teamLogo(
      victimTeam
    );

  $("feedRows").innerHTML = `

    <div class="killRow">

      ${
        killerLogo
        ?
        `
        <img
          class="killLogo"
          src="${esc(killerLogo)}"
          onerror="
            this.style.visibility='hidden'
          "
        >
        `
        :
        `<div></div>`
      }

      <div
        class="killer"
        title="${esc(killer)}">

        ${esc(
          killer ||
          "UNKNOWN"
        )}

      </div>

      <div
        class="weapon"
        title="${esc(weapon)}">

        ${esc(
          weapon ||
          "GUN"
        )}

      </div>

      <div
        class="victim"
        title="${esc(victim)}">

        ${esc(
          victim ||
          "UNKNOWN"
        )}

      </div>

      ${
        victimLogo
        ?
        `
        <img
          class="killLogo"
          src="${esc(victimLogo)}"
          onerror="
            this.style.visibility='hidden'
          "
        >
        `
        :
        `<div></div>`
      }

    </div>

  `;

  $("feedWrap")
    .classList
    .remove("hidden");

  clearTimeout(
    feedTimer
  );

  feedTimer =
    setTimeout(
      () => {
        hideFeed();
      },
      5000
    );

}

function getKillCounts(
  c,
  raw
){

  const events =
    uniqueEvents(raw);

  const counts = {};

  events.forEach(
    e => {

      const killer =
        eventKiller(e);

      const t =
        findTeam(
          c,
          killer
        );

      if(!t)
        return;

      const name =
        teamName(t);

      counts[name] =
        (counts[name] || 0) + 1;

    }
  );

  return counts;

}

function num(
  v,
  fallback=0
){

  const n =
    Number(v);

  return Number.isFinite(n)
    ? n
    : fallback;

}

function placementPoints(t){

  return num(
    t?.placement ??
    t?.placement_points ??
    t?.place_points ??
    0
  );

}

function broadcast(c){

  const b =
    c?.broadcast || {};

  return {

    match:
      b.match ||
      c?.match ||
      c?.match_name ||
      "MATCH 1",

    group:
      b.group ||
      c?.group ||
      c?.group_name ||
      "GROUP A × B",

    day:
      b.day ||
      c?.day ||
      "DAY 1",

    map:
      b.map ||
      c?.map ||
      "ERANGEL"

  };

}

function renderTable(
  c,
  raw
){

  const teams =
    teamsFromConfig(c);

  if(!teams.length){

    $("table").innerHTML =
      `
      <div style="
        height:50px;
        display:flex;
        align-items:center;
        justify-content:center;
        color:#6684a8;
        font-size:9px;
        font-weight:1000;
        letter-spacing:2px;
      ">
        NO TEAM DATA
      </div>
      `;

    return;

  }

  const kills =
    getKillCounts(
      c,
      raw
    );

  const rows =
    teams.map(
      (t,index) => {

        const name =
          teamName(t);

        const k =
          kills[name] || 0;

        const placement =
          placementPoints(t);

        return {

          t,
          name,
          kills:k,
          placement,

          total:
            k + placement,

          index

        };

      }
    );

  rows.sort(
    (a,b) =>
      b.total -
      a.total ||

      b.kills -
      a.kills ||

      a.index -
      b.index
  );

  $("table").innerHTML =
    rows
      .slice(0,16)
      .map(
        (r,index) => {

          const logo =
            teamLogo(r.t);

          return `

          <div class="prow">

            <div class="rank">
              ${index + 1}
            </div>

            <div class="team">

              ${
                logo
                ?
                `
                <img
                  src="${esc(logo)}"
                  onerror="
                    this.style.visibility='hidden'
                  "
                >
                `
                :
                ""
              }

              <b
                title="${esc(r.name)}">

                ${esc(
                  teamShort(r.t)
                )}

              </b>

            </div>

            <div class="num">
              ${r.kills}
            </div>

            <div class="num">
              ${r.placement}
            </div>

            <div class="pts">
              ${r.total}
            </div>

          </div>

          `;

        }
      )
      .join("");

}

const eliminatedShown = new Set();
let elimTimer = null;

function eliminationNorm(v){
  return String(v ?? "").trim().toLowerCase().replace(/[^a-z0-9]/g,"");
}

function eliminationFindTeam(c, player){
  const p = String(player ?? "").trim().toLowerCase();
  const pn = eliminationNorm(player);
  if(!p && !pn) return null;
  const teams = teamsFromConfig(c);

  const exact = teams.find(t =>
    teamPlayers(t).some(x => String(x ?? "").trim().toLowerCase() === p)
  );
  if(exact) return exact;

  const normalized = teams.find(t =>
    teamPlayers(t).some(x => eliminationNorm(x) === pn)
  );
  if(normalized) return normalized;

  return teams.find(t =>
    teamPlayers(t).some(x => {
      const xn = eliminationNorm(x);
      return pn.length >= 4 && xn.length >= 4 &&
        (pn.includes(xn) || xn.includes(pn));
    })
  ) || null;
}

function teamExplicitlyEliminated(t){
  const status = String(t?.status ?? t?.state ?? t?.team_status ?? "")
    .trim().toLowerCase();
  return (
    t?.eliminated === true ||
    t?.is_eliminated === true ||
    status === "eliminated" ||
    Number(t?.alive) === 0
  );
}

function getEliminatedTeams(c, raw){
  const events = uniqueEvents(raw);
  const teams = teamsFromConfig(c);
  const victimsByTeam = new Map();

  teams.forEach(t => victimsByTeam.set(teamName(t), new Set()));

  events.forEach(e => {
    const victim = eventVictim(e);
    if(!victim) return;

    const victimTeam = eliminationFindTeam(c, victim);
    if(!victimTeam) return;

    const name = teamName(victimTeam);
    if(!victimsByTeam.has(name)) victimsByTeam.set(name, new Set());
    victimsByTeam.get(name).add(eliminationNorm(victim));
  });

  const result = [];

  teams.forEach(t => {
    const name = teamName(t);
    const victims = victimsByTeam.get(name);

    if(
      teamExplicitlyEliminated(t) ||
      (victims && victims.size >= 4)
    ){
      result.push(t);
    }
  });

  // Admin test trigger; real match elimination still uses 4 unique victims.
  const test = c?.test_elimination;
  if(test && Number(test.expires_at || 0) > Date.now()){
    const target = eliminationNorm(test.team);
    const testTeam = teams.find(t => eliminationNorm(teamName(t)) === target);
    if(testTeam && !result.some(t => teamName(t) === teamName(testTeam))){
      result.push(testTeam);
    }
  }

  return result;
}

function showElimination(t){
  const logo = teamLogo(t);
  const logoEl = $("elimLogo");

  if(logo){
    logoEl.src = logo;
    logoEl.style.visibility = "visible";
  }else{
    logoEl.removeAttribute("src");
    logoEl.style.visibility = "hidden";
  }

  $("elimName").textContent = teamName(t);
  $("elimBanner").style.display = "flex";

  clearTimeout(elimTimer);
  elimTimer = setTimeout(() => {
    $("elimBanner").style.display = "none";
  }, 5000);
}

function checkEliminations(c, raw){

  // TEST ELIMINATION is a direct cloud signal.
  // Do NOT require the team roster lookup to succeed.
  // This is what makes the Admin test banner reliable even if
  // OCR/player-name matching is imperfect.
  const test = c?.test_elimination;
  if(
    test &&
    Number(test.expires_at || 0) > Date.now() &&
    String(test.team || "").trim()
  ){
    const testName = String(test.team).trim();
    const testKey = "__TEST_ELIM__|" + testName + "|" + String(test.nonce || "");

    if(!eliminatedShown.has(testKey)){
      const teams = teamsFromConfig(c);
      const target = eliminationNorm(testName);

      const testTeam =
        teams.find(t => eliminationNorm(teamName(t)) === target) ||
        teams.find(t => {
          const n = eliminationNorm(teamName(t));
          return n && target && (n.includes(target) || target.includes(n));
        }) ||
        {
          name:testName,
          short:testName,
          logo:""
        };

      eliminatedShown.add(testKey);
      showElimination(testTeam);
    }
  }

  // REAL MATCH elimination: 4 unique victims.
  const eliminated = getEliminatedTeams(c, raw);

  for(const t of eliminated){
    const name = teamName(t);
    const key = "__REAL_ELIM__|" + name;

    if(eliminatedShown.has(key))
      continue;

    eliminatedShown.add(key);
    showElimination(t);
  }
}

let updating =
  false;

async function update(){

  if(updating)
    return;

  updating = true;

  try{

    const [
      state,
      rawEvents
    ] =
      await Promise.all([

        getState(),

        getEvents()

      ]);

    const c =
      state?.config ??
      state?.state ??
      state;

    const events =
      normalizeEvents(
        rawEvents
      );

    const b =
      broadcast(c);

    $("matchTitle")
      .textContent =
      b.match;

    $("groupTitle")
      .textContent =
      b.group;

    $("dayTitle")
      .textContent =
      b.day;

    $("mapTitle")
      .textContent =
      b.map;

    $("mapMini")
      .textContent =
      b.map;

    renderTable(
      c,
      events
    );

    showKillFeed(
      c,
      events
    );

    checkEliminations(
      c,
      events
    );

    $("loading")
      .style.display =
      "none";

  }catch(err){

    console.error(
      "BGMI OVERLAY ERROR:",
      err
    );

    $("status")
      .textContent =
      "LIVE DATA CONNECTION ERROR • RETRYING...";

    $("loading")
      .textContent =
      "RECONNECTING...";

  }

  updating = false;

}

update();

setInterval(
  update,
  1000
);


// Instant live trigger for state/event changes.
// The existing 1-second polling remains as fallback.
try{
  sb.channel("bgmi-kill-feed-live-overlay")
    .on("postgres_changes", {
      event:"*",
      schema:"public",
      table:"killfeed_state"
    }, () => update())
    .on("postgres_changes", {
      event:"*",
      schema:"public",
      table:"killfeed_events"
    }, () => update())
    .subscribe();
}catch(e){
  console.warn("Realtime trigger unavailable:", e);
}

try{
  if("BroadcastChannel" in window){
    const liveChannel = new BroadcastChannel("bgmi-kill-feed-live");
    liveChannel.onmessage = () => update();
  }

  window.addEventListener("storage", e => {
    if(e.key === "kf_live_ping")
      update();
  });
}catch(e){
  console.warn("Live trigger unavailable:", e);
}
</script>
