<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920,height=1080">
<title>Senpai Esports • BGMI Premium Broadcast Overlay</title>

<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:transparent;
  font-family:Arial,Helvetica,sans-serif;
  color:#fff
}

#stage{
  position:relative;
  width:1920px;
  height:1080px;
  transform-origin:top left
}

@media(max-width:1920px){
  #stage{transform:scale(calc(100vw / 1920))}
}

@media(max-height:1080px){
  #stage{
    transform:scale(
      min(
        calc(100vw / 1920),
        calc(100vh / 1080)
      )
    )
  }
}

/* ================= THEME ================= */

:root{
  --blue:#087dff;
  --cyan:#19cfff;
  --deep:#050914;
  --panel:rgba(4,10,22,.94);
  --gold:#ffd52b;
  --white:#f7fbff;
  --muted:#93a9c7;
  --line:rgba(35,166,255,.5);
}

.glow{
  box-shadow:
    0 0 18px rgba(0,150,255,.22),
    inset 0 0 20px rgba(0,100,255,.05)
}

.tech{
  background:
    linear-gradient(
      90deg,
      rgba(5,12,26,.98),
      rgba(7,18,38,.96),
      rgba(5,12,26,.98)
    );

  border:1px solid rgba(25,170,255,.45);
  position:relative;
}

.tech:before{
  content:"";
  position:absolute;
  left:0;
  right:0;
  top:-1px;
  height:2px;

  background:
    linear-gradient(
      90deg,
      transparent,
      #16bfff,
      #fff,
      #16bfff,
      transparent
    );

  box-shadow:0 0 10px #09bfff;
  opacity:.9;
}

.tech:after{
  content:"";
  position:absolute;
  right:8px;
  top:7px;
  width:44px;
  height:7px;

  background:
    repeating-linear-gradient(
      135deg,
      transparent 0 7px,
      #159bff 7px 12px,
      transparent 12px 17px
    );

  opacity:.75;
}

.gold{
  color:var(--gold)
}

.mini{
  font-size:17px;
  letter-spacing:3px;
  color:#8ca8ca;
  font-weight:800
}

.upper{
  text-transform:uppercase
}

#watermark{
  position:absolute;
  right:42px;
  top:28px;
  font-size:15px;
  letter-spacing:3px;
  color:#7893b7;
  opacity:.7;
  font-weight:800
}

/* ================= TOP BAR ================= */

.topbar{
  position:absolute;
  left:50%;
  top:24px;
  width:520px;
  height:54px;

  transform:translateX(-50%);

  display:flex;
  align-items:center;
  justify-content:center;
  gap:16px;

  padding:0 22px;

  clip-path:
    polygon(
      4% 0,
      96% 0,
      100% 50%,
      96% 100%,
      4% 100%,
      0 50%
    );
}

.live{
  display:flex;
  align-items:center;
  gap:8px;

  background:#c91525;

  padding:7px 13px;

  font-weight:1000;
  font-size:15px;
  letter-spacing:2px
}

.live i{
  width:8px;
  height:8px;

  background:#fff;
  border-radius:50%;

  box-shadow:0 0 9px #fff
}

.matchblock{
  line-height:1.05;
  text-align:center
}

.matchtitle{
  font-size:21px;
  font-weight:1000;
  letter-spacing:1px;
  display:inline
}

.group{
  display:inline;
  font-size:14px;
  color:var(--gold);
  font-weight:900;
  letter-spacing:2px;
  margin-left:5px
}

/* ================= KILL FEED REMOVED ================= */

.feedWrap{
  display:none!important
}

/* ================= POINTS TABLE ================= */

.points{
  position:absolute;
  right:24px;
  top:130px;

  width:390px;
  height:auto;
  max-height:790px;

  padding:12px 12px 10px;

  border-radius:2px;
  overflow:hidden
}

.pointsHeader{
  height:46px;

  display:flex;
  align-items:center;

  border-bottom:1px solid rgba(31,166,255,.35);

  position:relative
}

.pointsHeader .title{
  font-size:16px;
  font-weight:1000;
  letter-spacing:1.4px
}

.pointsHeader .mini{
  font-size:9px;
  letter-spacing:1.5px;
  margin-top:3px
}

.pointsHeader .liveTag{
  margin-left:auto;

  display:flex;
  align-items:center;
  gap:5px;

  color:#ff5360;

  font-size:9px;
  font-weight:1000;
  letter-spacing:1px
}

.pointsHeader .liveTag i{
  width:6px;
  height:6px;

  border-radius:50%;

  background:#ff2638;

  box-shadow:0 0 8px #ff2638
}

.columns,
.prow{
  display:grid;
  grid-template-columns:
    28px
    1fr
    48px
    68px
    55px;

  align-items:center
}

.columns{
  height:27px;

  color:#7797bd;

  font-size:8px;
  font-weight:1000;
  letter-spacing:.8px;

  border-bottom:1px solid rgba(255,255,255,.08)
}

.prow{
  height:38px;

  margin:2px 0;

  padding:0 5px;

  background:
    linear-gradient(
      90deg,
      rgba(9,23,43,.95),
      rgba(7,14,28,.72)
    );

  border:1px solid rgba(70,150,220,.12);

  position:relative
}

.prow:nth-child(1){
  border-color:rgba(255,213,43,.55);

  background:
    linear-gradient(
      90deg,
      rgba(90,68,8,.34),
      rgba(7,14,28,.8)
    )
}

.prow:nth-child(2){
  border-color:rgba(192,215,236,.22)
}

.prow:nth-child(3){
  border-color:rgba(191,130,61,.22)
}

.prow .rank{
  font-size:10px;
  font-weight:1000;
  color:#9db4d0;
  text-align:center
}

.prow:first-child .rank{
  color:var(--gold)
}

.prow .team{
  display:flex;
  align-items:center;
  gap:7px;
  min-width:0
}

.prow .team img{
  width:27px;
  height:27px;

  object-fit:contain;

  background:transparent
}

.prow .team b{
  font-size:9px;
  font-weight:1000;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

.prow .num{
  font-size:10px;
  font-weight:1000;
  text-align:center
}

.prow .pts{
  font-size:12px;
  font-weight:1000;
  color:var(--gold);
  text-align:center
}

.prow .alive{
  display:none
}

.tableFoot{
  display:none
}

/* =========================================================
   TEAM ELIMINATED
========================================================= */

#elimBanner{
  position:absolute;

  left:50%;
  top:92px;

  transform:translateX(-50%);

  width:720px;
  height:120px;

  display:none;

  align-items:center;
  justify-content:center;

  background-image:url('/team-eliminated.png');

  background-size:100% 100%;
  background-repeat:no-repeat;

  z-index:100;

  filter:
    drop-shadow(
      0 0 14px
      rgba(255,30,55,.45)
    );
}

#elimLogo{
  position:absolute;

  left:47px;
  top:25px;

  width:70px;
  height:70px;

  object-fit:contain;

  z-index:2;

  background:transparent;
}

#elimName{
  position:absolute;

  left:150px;
  right:90px;

  top:68px;

  transform:translateY(-50%);

  text-align:center;

  color:#fff;

  font-size:23px;
  font-weight:1000;

  letter-spacing:1.2px;

  text-shadow:
    0 2px 8px #000;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;

  z-index:3;
}

#elimTag{
  position:absolute;

  left:150px;
  right:90px;

  top:42px;

  text-align:center;

  color:#ff304e;

  font-size:9px;

  font-weight:1000;

  letter-spacing:3px;

  z-index:3
}

/* ================= BOTTOM REMOVED ================= */

.footer{
  display:none!important
}

#status{
  position:absolute;

  left:44px;
  bottom:120px;

  font-size:11px;

  color:#587594;

  letter-spacing:1.5px;

  font-weight:800
}

#loading{
  position:absolute;
  inset:0;

  display:grid;
  place-items:center;

  color:#8da8c8;

  font-size:18px;

  letter-spacing:3px;

  font-weight:900;

  background:rgba(0,0,0,.05)
}
</style>

<body>

<div id="stage">

  <div id="watermark">
    SENPAI ESPORTS • OFFICIAL BROADCAST
  </div>


  <!-- TOP -->

  <div class="topbar tech glow">

    <div class="live">
      <i></i>
      LIVE
    </div>

    <div class="matchblock">

      <div
        class="matchtitle"
        id="matchTitle"
      >
        MATCH 1
      </div>

      <div
        class="group"
        id="groupTitle"
      >
        GROUP A × B
      </div>

    </div>

  </div>


  <!-- POINTS TABLE -->

  <section class="points tech glow">

    <div class="pointsHeader">

      <div>

        <div class="title">
          LIVE POINTS TABLE
        </div>

        <div class="mini">
          BGMI •
          <span id="mapMini">
            ERANGEL
          </span>
        </div>

      </div>

      <div class="liveTag">
        <i></i>
        LIVE
      </div>

    </div>


    <div class="columns">

      <div>#</div>
      <div>TEAM</div>
      <div>KILLS</div>
      <div>PLACEMENT</div>
      <div>TOTAL</div>

    </div>


    <div id="table"></div>

  </section>


  <!-- =====================================================
       TEAM ELIMINATED BANNER
  ====================================================== -->

  <div id="elimBanner">

    <img
      id="elimLogo"
      src=""
      onerror="
        this.style.visibility='hidden'
      "
    >

    <div id="elimTag">
      TEAM ELIMINATED
    </div>

    <div id="elimName">
      TEAM NAME
    </div>

  </div>


  <div id="status">
    CONNECTING TO LIVE MATCH DATA…
  </div>

  <div id="loading">
    LOADING BROADCAST…
  </div>

</div>


<script>

/* ============================================================
   SUPABASE
============================================================ */

const CFG =
  window.KF_CONFIG || {};

const SUPABASE_URL =
  CFG.SUPABASE_URL ||
  "https://nuywberanlfvngjnjcpx.supabase.co";

const SUPABASE_KEY =
  CFG.SUPABASE_PUBLISHABLE_KEY || "";

const ROOM =
  localStorage.getItem("kf_room") ||
  "ADITYA8029";


const sb =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const $ =
  id => document.getElementById(id);


const esc =
  s =>
    String(s ?? "")
      .replace(
        /[&<>"']/g,
        m =>
          ({
            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#039;"
          }[m])
      );


async function rpc(
  name,
  params
){

  const r =
    await sb.rpc(
      name,
      params
    );

  if(r.error)
    throw r.error;

  return r.data;
}


async function getState(){

  return rpc(
    "kf_get_state",
    {
      p_room_code:ROOM
    }
  );

}


async function getEvents(){

  return rpc(
    "kf_events",
    {
      p_room_code:ROOM
    }
  );

}


/* ============================================================
   TEAM HELPERS
============================================================ */

function arr(v){

  return Array.isArray(v)
    ? v
    : [];

}


function teamsFromConfig(c){

  let t =
    c?.teams;


  if(Array.isArray(t))
    return t;


  if(
    t &&
    typeof t === "object"
  ){

    return Object.entries(t)
      .map(
        ([key,val]) => {

          if(
            val &&
            typeof val === "object"
          ){

            return {
              ...val,
              name:
                val.name ||
                key,

              short:
                val.short ||
                key
            };

          }

          return {
            name:key,
            short:key
          };

        }
      );

  }


  return [];

}


function teamName(t){

  return (
    t?.name ||
    t?.team ||
    t?.short ||
    t?.tag ||
    "UNKNOWN"
  );

}


function teamShort(t){

  return (
    t?.short ||
    t?.tag ||
    t?.abbr ||
    teamName(t)
  );

}


function teamLogo(t){

  return (
    t?.logo ||
    t?.logo_url ||
    t?.image ||
    t?.image_url ||
    ""
  );

}


function teamPlayers(t){

  const p =
    t?.players ??
    t?.members ??
    t?.roster ??
    [];


  if(Array.isArray(p)){

    return p
      .map(
        x =>
          typeof x === "string"
          ? x
          : (
              x?.name ||
              x?.ign ||
              x?.player ||
              ""
            )
      )
      .filter(Boolean);

  }


  if(
    typeof p === "object"
  ){

    return Object.values(p)
      .map(
        x =>
          typeof x === "string"
          ? x
          : (
              x?.name ||
              x?.ign ||
              ""
            )
      )
      .filter(Boolean);

  }


  return [];

}


function findTeam(
  c,
  player
){

  const p =
    String(
      player || ""
    )
    .trim()
    .toLowerCase();


  if(!p)
    return null;


  const teams =
    teamsFromConfig(c);


  return (

    teams.find(
      t =>
        teamPlayers(t)
          .some(
            x =>
              String(x)
                .trim()
                .toLowerCase()
              === p
          )
    )

    ||

    teams.find(
      t =>
        teamPlayers(t)
          .some(
            x => {

              const a =
                p;

              const b =
                String(x)
                  .trim()
                  .toLowerCase();

              return (
                a.includes(b) ||
                b.includes(a)
              );

            }
          )
    )

    ||

    null

  );

}


/* ============================================================
   EVENTS
============================================================ */

function eventTime(e){

  return (
    new Date(
      e?.time ||
      e?.created_at ||
      e?.timestamp ||
      0
    ).getTime()
    || 0
  );

}


function eventKiller(e){

  return (
    e?.killer ||
    e?.p_killer ||
    e?.killer_name ||
    e?.attacker ||
    ""
  );

}


function eventVictim(e){

  return (
    e?.victim ||
    e?.p_victim ||
    e?.victim_name ||
    e?.target ||
    ""
  );

}


function eventWeapon(e){

  return (
    e?.weapon ||
    e?.p_weapon ||
    e?.weapon_name ||
    "RIFLE"
  );

}


/* ============================================================
   LOCAL KILL TOTALS
============================================================ */

const STORE_KEY =
  "kf_overlay_totals_v3_" +
  ROOM +
  "_" +
  encodeURIComponent(
    localStorage.getItem(
      "kf_match"
    ) || "MATCH"
  );


let totals = {};

try{

  totals =
    JSON.parse(
      localStorage.getItem(
        STORE_KEY
      ) || "{}"
    ) || {};

}catch{

  totals = {};

}


function saveTotals(){

  try{

    localStorage.setItem(
      STORE_KEY,
      JSON.stringify(totals)
    );

  }catch{}

}


function applyEvents(
  c,
  events
){

  arr(events).forEach(
    e => {

      const id =
        String(
          e?.id ??
          `${eventTime(e)}|${eventKiller(e)}|${eventVictim(e)}`
        );


      const killer =
        eventKiller(e);


      const t =
        findTeam(
          c,
          killer
        );


      if(!t)
        return;


      const key =
        teamName(t);


      if(!totals[key]){

        totals[key] = {
          kills:0,
          ids:{}
        };

      }


      if(
        !totals[key].ids[id]
      ){

        totals[key].kills++;

        totals[key].ids[id] = 1;

      }

    }
  );


  saveTotals();

}


/* ============================================================
   NUMBERS
============================================================ */

function num(
  v,
  fallback=0
){

  const n =
    Number(v);

  return Number.isFinite(n)
    ? n
    : fallback;

}


function configuredAlive(t){

  const v =
    t?.alive ??
    t?.alive_count ??
    t?.players_alive ??
    t?.alivePlayers;


  if(
    v === undefined ||
    v === null ||
    v === ""
  )
    return null;


  return num(v,0);

}


/* ============================================================
   POINTS
============================================================ */

function pointsFor(
  t,
  key
){

  const session =
    totals[key]?.kills || 0;


  const placement =
    num(
      t?.placement ??
      t?.placement_points ??
      t?.place_points ??
      0,
      0
    );


  return (
    session +
    placement
  );

}


function totalKills(
  t,
  key
){

  return (
    totals[key]?.kills ||
    0
  );

}


/* ============================================================
   BROADCAST
============================================================ */

function broadcast(c){

  const b =
    c?.broadcast || {};


  return {

    tournament:
      b.tournament ||
      c?.tournament ||
      "BGMI TOURNAMENT",

    match:
      b.match ||
      c?.match ||
      c?.match_name ||
      "MATCH 1",

    group:
      b.group ||
      c?.group ||
      c?.group_name ||
      "GROUP A × B",

    day:
      b.day ||
      c?.day ||
      "DAY 1",

    map:
      b.map ||
      c?.map ||
      "ERANGEL",

    remaining:
      b.remaining ??
      c?.remaining_teams ??
      teamsFromConfig(c).length

  };

}


/* ============================================================
   POINTS TABLE
============================================================ */

function renderTable(c){

  const teams =
    teamsFromConfig(c);


  const rows =
    teams
      .map(
        (t,i)=>{

          const key =
            teamName(t);


          return {

            t,

            key,

            kills:
              totalKills(
                t,
                key
              ),

            pts:
              pointsFor(
                t,
                key
              ),

            placement:
              num(
                t?.placement ??
                t?.placement_points ??
                t?.place_points ??
                0,
                0
              ),

            index:i

          };

        }
      )


      .sort(
        (a,b) =>
          b.pts-a.pts ||
          b.kills-a.kills ||
          a.index-b.index
      )


      .slice(0,16);


  $("table").innerHTML =
    rows
      .map(
        (r,i)=>`

          <div class="prow">

            <div class="rank">
              ${i+1}
            </div>

            <div class="team">

              ${
                teamLogo(r.t)
                ?
                `<img
                  src="${esc(
                    teamLogo(r.t)
                  )}"
                  onerror="
                    this.style.visibility='hidden'
                  "
                >`
                :
                ""
              }

              <b>
                ${esc(
                  teamShort(r.t)
                )}
              </b>

            </div>

            <div class="num">
              ${r.kills}
            </div>

            <div class="num">
              ${r.placement}
            </div>

            <div class="pts">
              ${r.pts}
            </div>

          </div>

        `
      )
      .join("")

    ||

    `
      <div class="empty">
        NO TEAM DATA
      </div>
    `;

}


/* ============================================================
   TEAM ELIMINATION
============================================================ */

function isEliminated(t){

  /* Direct admin/OCR flag */

  if(
    t?.eliminated === true
  )
    return true;


  if(
    t?.is_eliminated === true
  )
    return true;


  /* Alive players = 0 */

  const alive =
    configuredAlive(t);


  if(
    alive !== null &&
    alive <= 0
  )
    return true;


  /* Status text */

  if(
    String(
      t?.status || ""
    )
    .toLowerCase()
    === "eliminated"
  )
    return true;


  return false;

}


/* ============================================================
   ELIMINATION DISPLAY
============================================================ */

let shownElims =
  new Set();

let elimTimer =
  null;


function checkEliminations(c){

  const teams =
    teamsFromConfig(c);


  for(
    const t of teams
  ){

    if(
      !isEliminated(t)
    )
      continue;


    const name =
      teamName(t);


    if(
      shownElims.has(name)
    )
      continue;


    shownElims.add(name);


    showElimination(t);

  }

}


function showElimination(t){

  const logo =
    teamLogo(t);


  const logoEl =
    $("elimLogo");


  if(logo){

    logoEl.src =
      logo;

    logoEl.style.visibility =
      "visible";

  }else{

    logoEl.removeAttribute(
      "src"
    );

    logoEl.style.visibility =
      "hidden";

  }


  /* Actual team name */

  $("elimName").textContent =
    teamName(t);


  /* Show banner */

  $("elimBanner").style.display =
    "flex";


  /* Keep it on screen for 5 sec */

  clearTimeout(
    elimTimer
  );


  elimTimer =
    setTimeout(
      () => {

        $("elimBanner")
          .style
          .display =
          "none";

      },
      5000
    );

}


/* ============================================================
   MAIN LIVE LOOP
============================================================ */

let lastEventSig =
  "";


async function tick(){

  try{

    const [
      c,
      events
    ] =
      await Promise.all([

        getState(),

        getEvents()

      ]);


    /* Kill data */

    applyEvents(
      c,
      events
    );


    /* Broadcast */

    const b =
      broadcast(c);


    $("matchTitle")
      .textContent =
      b.match;


    $("groupTitle")
      .textContent =
      b.group;


    $("mapMini")
      .textContent =
      b.map;


    /* Points */

    renderTable(c);


    /* Team elimination */

    checkEliminations(c);


    /* Event change */

    const sig =
      arr(events)
        .slice(0,3)
        .map(
          e =>
            e?.id ||
            `${eventTime(e)}-${eventKiller(e)}-${eventVictim(e)}`
        )
        .join("|");


    if(
      sig !==
      lastEventSig
    ){

      lastEventSig =
        sig;


      if(
        arr(events).length
      ){

        document.title =
          `LIVE • ${b.match} • Senpai Esports`;

      }

    }


    $("status")
      .textContent =
      `LIVE SYNC • ROOM ${ROOM} • AUTO UPDATE`;


    $("loading")
      .style.display =
      "none";


  }catch(err){

    console.error(
      err
    );


    $("status")
      .textContent =
      "LIVE DATA CONNECTION ERROR • RETRYING…";


    $("loading")
      .textContent =
      "RECONNECTING…";

  }

}


/* Start */

tick();


/* Auto refresh every second */

setInterval(
  tick,
  1000
);

</script>

</body>
</html>
