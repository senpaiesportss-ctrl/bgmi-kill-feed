.header{position:absolute;left:704px;top:104px;width:520px;height:56px;display:flex;align-items:center;padding:0 13px;gap:14px;background:linear-gradient(90deg,#061426,#0b1b32,#061426);border:1px solid rgba(21,157,255,.7);clip-path:polygon(4% 0,97% 0,100% 50%,97% 100%,4% 100%,0 50%);box-shadow:0 0 18px rgba(0,130,255,.16)}

.liveBox{display:flex;align-items:center;gap:13px}.livePill{display:flex;align-items:center;gap:7px;padding:9px 16px;background:#c91525;border:1px solid #ff5666;font-size:17px;font-weight:1000;letter-spacing:1px}.liveDot{width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 8px #fff}.hdrMeta{display:flex;align-items:center;gap:10px;line-height:1}.hdrMatch{font-size:19px;font-weight:1000;letter-spacing:.5px}.hdrGroup{font-size:12px;color:var(--gold);font-weight:1000;letter-spacing:2px}.hdrCenter{display:none}.hdrRight{margin-left:auto;display:flex;align-items:center;gap:8px;padding-right:18px}.hdrRight .small{font-size:8px;color:#7894b6;letter-spacing:1.5px;font-weight:900}.hdrRight .value{font-size:11px;font-weight:1000;color:var(--gold)}
.feedWrap{position:absolute;left:48px;top:220px;width:900px;display:block}.titleLine{display:flex;align-items:end;height:38px;margin-bottom:8px}.titleAccent{width:6px;height:28px;background:var(--gold);box-shadow:0 0 10px var(--gold);margin-right:10px}.titleLine h2{margin:0;font-size:21px;letter-spacing:3px}.titleLine .sub{margin-left:auto;color:#6683a8;font-size:9px;letter-spacing:1.5px}.killrow{height:70px;display:grid;grid-template-columns:65px 1fr 58px 1fr 65px;align-items:center;padding:0 8px;background:linear-gradient(90deg,rgba(7,20,38,.96),rgba(5,13,27,.9));border:1px solid rgba(25,157,255,.35);clip-path:polygon(0 0,98% 0,100% 50%,98% 100%,0 100%)}.logoBox{width:48px;height:48px;margin:auto;display:grid;place-items:center}.logoBox img{width:100%;height:100%;object-fit:contain}.kname{font-size:14px;font-weight:1000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pname{font-size:10px;color:#7895b8;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.victim{text-align:right}.victim .pname{color:var(--gold)}.weaponBox{text-align:center}.weaponIcon{font-size:19px}.weaponLabel{font-size:7px;color:#6281a7;letter-spacing:1px;margin-top:2px}.feedHidden{display:none!important}
.points{position:absolute;right:14px;top:210px;width:395px;height:740px;padding:12px 11px 10px;background:linear-gradient(135deg,rgba(4,14,29,.98),rgba(7,21,40,.96));border:1px solid rgba(24,161,255,.58);box-shadow:0 0 20px rgba(0,130,255,.13),0 10px 30px rgba(0,0,0,.35);overflow:hidden}.points:before{content:"";position:absolute;left:0;right:0;top:-1px;height:2px;background:#159dff;box-shadow:0 0 9px #159dff}.points:after{content:"";position:absolute;right:8px;top:8px;width:35px;height:6px;background:repeating-linear-gradient(135deg,transparent 0 6px,#159dff 6px 10px,transparent 10px 15px)}.pointsHead{height:47px;display:flex;align-items:center;border-bottom:1px solid rgba(37,161,239,.35)}.pointsHead .title{font-size:19px;font-weight:1000;letter-spacing:1px}.pointsHead .subtitle{font-size:9px;color:#718caf;letter-spacing:1.3px;font-weight:900;margin-top:3px}.liveTag{margin-left:auto;color:#ff5261;font-size:9px;font-weight:1000;letter-spacing:1.5px}.liveTag i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#ff2638;box-shadow:0 0 8px #ff2638;margin-right:4px}.columns,.prow{display:grid;grid-template-columns:30px 1fr 54px 65px 55px;align-items:center}.columns{height:31px;color:#6c88aa;font-size:8px;font-weight:1000;letter-spacing:1px;border-bottom:1px solid rgba(255,255,255,.08)}.prow{height:39px;margin:1px 0;padding:0 4px;background:linear-gradient(90deg,rgba(7,21,40,.96),rgba(4,13,27,.92));border:1px solid rgba(48,111,164,.18)}.prow.top{height:40px;border-color:rgba(255,213,43,.65);background:linear-gradient(90deg,rgba(74,58,9,.42),rgba(6,15,30,.95))}.rank{font-size:10px;font-weight:1000;text-align:center;color:#a9bdd6}.prow.top .rank{color:var(--gold)}.team{display:flex;align-items:center;gap:7px;min-width:0}.team img{width:27px;height:27px;object-fit:contain}.team b{font-size:9px;font-weight:1000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.num,.pts{font-size:10px;font-weight:1000;text-align:center}.pts{font-size:12px;color:var(--gold)}.tableFoot{display:none}.empty{height:100px;display:grid;place-items:center;color:#526d90;letter-spacing:2px;font-weight:900;border:1px dashed rgba(50,140,220,.25)}
.elimAlert{position:absolute;left:50%;top:104px;transform:translate(-50%,-12px) scale(.96);width:500px;height:62px;display:flex;align-items:center;gap:12px;padding:0 16px;z-index:20;opacity:0;pointer-events:none;background:linear-gradient(90deg,rgba(42,5,12,.98),rgba(110,8,24,.96),rgba(27,5,11,.98));border:1px solid rgba(255,62,88,.85);clip-path:polygon(4% 0,97% 0,100% 50%,97% 100%,4% 100%,0 50%);box-shadow:0 0 22px rgba(255,35,65,.4);transition:.2s}.elimAlert.show{opacity:1;transform:translate(-50%,0) scale(1)}.elimAlert .eaLogo{width:42px;height:42px;display:grid;place-items:center;overflow:hidden;border:1px solid rgba(255,255,255,.55);background:#07090e}.elimAlert .eaLogo img{width:100%;height:100%;object-fit:contain}.elimAlert .eaTeam{font-size:17px;font-weight:1000;letter-spacing:1px;text-transform:uppercase}.elimAlert .eaText{margin-top:4px;font-size:9px;font-weight:1000;letter-spacing:3px;color:#ff6378}.elimAlert .eaLive{margin-left:auto;font-size:8px;font-weight:1000;letter-spacing:1.5px;color:#ff9aaa}
#status{display:none!important}#loading{display:none!important}
</style></head><body><div id="stage">
<div id="elimAlert" class="elimAlert"><div class="eaLogo" id="elimLogo"></div><div><div class="eaTeam" id="elimTeam">TEAM</div><div class="eaText">ELIMINATED</div></div><div class="eaLive">MATCH ELIMINATION</div></div>
<header class="header"><div class="liveBox"><div class="livePill"><i class="liveDot"></i>LIVE</div><div class="hdrMeta"><div class="hdrMatch" id="matchTitle">MATCH 1</div><div class="hdrGroup" id="groupTitle">GROUP A × B</div></div></div><div class="hdrRight"><div class="small" id="dayTop">DAY 1</div><div class="value" id="mapTop">ERANGEL</div></div></header>
<section class="feedWrap"><div class="titleLine"><div class="titleAccent"></div><h2>KILL FEED</h2><div class="sub">ELIMINATION LOG • LIVE</div></div><div id="feed"></div></section>
<section class="points"><div class="pointsHead"><div><div class="title">LIVE POINTS TABLE</div><div class="subtitle">BGMI • <span id="mapMini">ERANGEL</span></div></div><div class="liveTag"><i></i>LIVE</div></div><div class="columns"><div>#</div><div>TEAM</div><div>KILLS</div><div>PLACEMENT</div><div>TOTAL</div></div><div id="table"></div></section>
<div id="status">LIVE SYNC • ROOM ADITYA8029 • AUTO UPDATE</div></div>
<script>
/* ===================== LIVE ENGINE — ROBUST ===================== */
const CFG=window.KF_CONFIG||{};
const SUPABASE_URL=CFG.SUPABASE_URL||"https://nuywberanlfvngjnjcpx.supabase.co";
const SUPABASE_KEY=CFG.SUPABASE_PUBLISHABLE_KEY||"";
const ROOM=localStorage.getItem("kf_room")||"ADITYA8029";
const POLL_MS=1000;
const RPC_TIMEOUT=3500;
let pollBusy=false;
let lastPollAt=0;

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));

async function rpcDirect(name,params){
  const ctl=new AbortController();
  const timer=setTimeout(()=>ctl.abort(),RPC_TIMEOUT);
  try{
    const r=await fetch(`${SUPABASE_URL}/rest/v1/rpc/${name}?_=${Date.now()}`,{
      method:"POST",
      cache:"no-store",
      headers:{
        "Content-Type":"application/json",
        "apikey":SUPABASE_KEY,
        "Authorization":`Bearer ${SUPABASE_KEY}`,
        "Cache-Control":"no-cache,no-store,max-age=0"
      },
      body:JSON.stringify(params),
      signal:ctl.signal
    });
    const text=await r.text();
    let data=text;
    try{data=JSON.parse(text)}catch{}
    if(!r.ok) throw new Error(`RPC ${name} ${r.status}: ${typeof data==='string'?data:JSON.stringify(data)}`);
    return data;
  }finally{clearTimeout(timer)}
}

const getState=()=>rpcDirect("kf_get_state",{p_room_code:ROOM});
const getEvents=()=>rpcDirect("kf_events",{p_room_code:ROOM});

function teamsFromConfig(c){
  const t=c?.teams;
  if(Array.isArray(t)) return t;
  if(t&&typeof t==="object") return Object.entries(t).map(([k,v])=>v&&typeof v==="object"?{...v,name:v.name||k,short:v.short||v.tag||k}:{name:k,short:k});
  return [];
}
function teamName(t){return t?.name||t?.team||t?.short||t?.tag||"UNKNOWN"}
function teamShort(t){return t?.short||t?.tag||teamName(t)}
function teamLogo(t){return t?.logo||t?.logo_url||t?.image||t?.image_url||""}
function teamPlayers(t){
  const p=t?.players??t?.members??t?.roster??[];
  if(Array.isArray(p)) return p.map(x=>typeof x==="string"?x:(x?.name||x?.ign||x?.player||"")).filter(Boolean);
  if(p&&typeof p==="object") return Object.values(p).map(x=>typeof x==="string"?x:(x?.name||x?.ign||x?.player||"")).filter(Boolean);
  return [];
}
function findTeam(c,player){
  const p=String(player||"").trim().toLowerCase(); if(!p)return null;
  const ts=teamsFromConfig(c);
  return ts.find(t=>teamPlayers(t).some(x=>String(x).trim().toLowerCase()===p))||
    ts.find(t=>teamPlayers(t).some(x=>{const n=String(x).trim().toLowerCase();return n&&(p.includes(n)||n.includes(p))}))||null;
}
function eventTime(e){
  const v=e?.time??e?.created_at??e?.timestamp??e?.createdAt??e?.event_time??0;
  if(typeof v==="number")return Number.isFinite(v)?v:0;
  const n=new Date(v).getTime(); return Number.isFinite(n)?n:0;
}
function eventKiller(e){return e?.killer??e?.p_killer??e?.killer_name??e?.attacker??e?.killerName??""}
function eventVictim(e){return e?.victim??e?.p_victim??e?.victim_name??e?.target??e?.victimName??""}
function eventWeapon(e){return e?.weapon??e?.p_weapon??e?.weapon_name??e?.weaponName??"GUN"}
function eventKey(e){
  if(e?.id!==undefined&&e?.id!==null)return "ID:"+String(e.id);
  return [eventTime(e),eventKiller(e),eventVictim(e),eventWeapon(e)].join("|");
}
function normalizeEvents(raw){
  if(typeof raw==="string"){try{raw=JSON.parse(raw)}catch{return[]}}
  if(Array.isArray(raw))return raw;
  if(raw&&Array.isArray(raw.events))return raw.events;
  if(raw&&Array.isArray(raw.data))return raw.data;
  if(raw&&Array.isArray(raw.result))return raw.result;
  return [];
}
function sortedEvents(raw){
  const seen=new Set(),out=[];
  for(const e of normalizeEvents(raw)){
    const k=eventKey(e); if(seen.has(k))continue;
    seen.add(k);out.push(e);
  }
  return out.sort((a,b)=>eventTime(b)-eventTime(a));
}
function num(v,d=0){const n=Number(v);return Number.isFinite(n)?n:d}
function configuredKills(t){return num(t?.kills??t?.kill_count??t?.kills_total,0)}
function configuredPoints(t){const v=t?.points??t?.pts??t?.total_points??t?.totalPts??t?.score;return v===undefined||v===null||v===""?null:num(v,0)}
function configuredAlive(t){const v=t?.alive??t?.alive_count??t?.players_alive??t?.alivePlayers;return v===undefined||v===null||v===""?null:num(v,0)}
function broadcast(c){
  const b=c?.broadcast||{};
  return {match:b.match||c?.match||c?.match_name||"MATCH 1",group:b.group||c?.group||c?.group_name||"GROUP A × B",day:b.day||c?.day||"DAY 1",map:b.map||c?.map||"ERANGEL"};
}
function weaponIcon(w){
  const s=String(w||"").toLowerCase();
  if(/sniper|awm|kar|m24|mk14|slr|mini|dmr/.test(s))return "⌁";
  if(/shotgun|s12|s1897|dbs|m1014/.test(s))return "▰";
  if(/smg|uzi|vector|ump|mp5|tommy|p90/.test(s))return "≋";
  if(/grenade|frag|molotov/.test(s))return "✦";
  if(/fist|punch|melee/.test(s))return "✕";
  return "➤";
}
function getKillCounts(c,events){
  const counts={};
  for(const e of sortedEvents(events)){const t=findTeam(c,eventKiller(e));if(!t)continue;const k=teamName(t);counts[k]=(counts[k]||0)+1}
  return counts;
}
let deadSeen={};
try{deadSeen=JSON.parse(localStorage.getItem("kf_dead_seen_"+ROOM)||"{}")||{}}catch{}
function saveDeadSeen(){try{localStorage.setItem("kf_dead_seen_"+ROOM,JSON.stringify(deadSeen))}catch{}}
function normName(v){return String(v??"").trim().toLowerCase().replace(/\s+/g," ")}
function rosterMatch(c,player){
  const p=normName(player); if(!p)return null;
  for(const t of teamsFromConfig(c)){
    const names=teamPlayers(t).map(normName).filter(Boolean);
    if(names.includes(p)) return t;
  }
  for(const t of teamsFromConfig(c)){
    const names=teamPlayers(t).map(normName).filter(Boolean);
    if(names.some(n=>n===p||n.includes(p)||p.includes(n))) return t;
  }
  return null;
}
function getEliminatedTeams(c,events){
  const teams=teamsFromConfig(c);
  const deadByTeam=new Map();
  teams.forEach(t=>deadByTeam.set(normName(teamName(t)),new Set(deadSeen[normName(teamName(t))]||[])));

  // Count victims by matching the victim IGN directly against each team's
  // roster. This is deliberately independent of findTeam(), so elimination
  // still works even if an OCR name contains extra spaces/case differences.
  for(const e of sortedEvents(events)){
    const victim=normName(eventVictim(e));
    if(!victim)continue;
    const t=rosterMatch(c,victim);
    if(t){
      const key=normName(teamName(t));
      if(!deadByTeam.has(key)) deadByTeam.set(key,new Set());
      deadByTeam.get(key).add(victim);
    }
  }

  const out=teams.filter(t=>{
    const configured=t?.eliminated===true ||
      String(t?.status||"").toUpperCase()==="ELIMINATED" ||
      configuredAlive(t)===0;
    const dead=deadByTeam.get(normName(teamName(t)));
    if(dead) deadSeen[normName(teamName(t))]=[...dead];
    return configured || !!(dead && dead.size>=4);
  });
  saveDeadSeen();

  // Admin TEST ELIMINATION also sends a short-lived cloud flag.
  const test=c?.test_elimination;
  if(test && Number(test.expires_at||0)>Date.now()){
    const wanted=String(test.team||"").trim().toLowerCase();
    const hit=teams.find(t=>teamName(t).trim().toLowerCase()===wanted);
    if(hit && !out.some(t=>teamName(t).trim().toLowerCase()===wanted)) out.push(hit);
  }
  return out;
}

/* ---------- KILL FEED ---------- */
let feedTimer=null,lastFeedKey="";
function hideFeed(){
  const w=document.querySelector(".feedWrap");
  if(w)w.style.display="none";
}
function showFeed(){
  const w=document.querySelector(".feedWrap");
  if(w)w.style.display="block";
}
function renderFeed(c,events){
  const recent=sortedEvents(events);
  if(!recent.length){hideFeed();lastFeedKey="";return}
  const e=recent[0],key=eventKey(e);
  if(key===lastFeedKey)return;
  lastFeedKey=key;
  const killer=eventKiller(e),victim=eventVictim(e),weapon=eventWeapon(e);
  const kt=findTeam(c,killer),vt=findTeam(c,victim),kl=teamLogo(kt),vl=teamLogo(vt);
  $("feed").innerHTML=`<div class="killrow">
    <div class="logoBox">${kl?`<img src="${esc(kl)}">`:""}</div>
    <div><div class="kname">${esc(teamShort(kt)||"—")}</div><div class="pname">${esc(killer)}</div></div>
    <div class="weaponBox"><div class="weaponIcon">${weaponIcon(weapon)}</div><div class="weaponLabel">${esc(String(weapon).slice(0,12).toUpperCase())}</div></div>
    <div class="victim"><div class="kname">${esc(teamShort(vt)||"—")}</div><div class="pname">${esc(victim)}</div></div>
    <div class="logoBox">${vl?`<img src="${esc(vl)}">`:""}</div>
  </div>`;
  showFeed();clearTimeout(feedTimer);feedTimer=setTimeout(hideFeed,5000);
}
function renderTable(c,events){
  const counts=getKillCounts(c,events),elim=new Set(getEliminatedTeams(c,events).map(teamName));
  const rows=teamsFromConfig(c).map((t,i)=>{
    const key=teamName(t),kills=configuredKills(t)+(counts[key]||0);
    const placement=num(t?.placement??t?.placement_points??t?.placementPoints??t?.place_points??t?.position_points,0);
    const cp=configuredPoints(t),total=cp!==null?cp+(counts[key]||0):placement+kills;
    return {t,key,kills,placement,total,i,eliminated:elim.has(key)};
  }).sort((a,b)=>b.total-a.total||b.kills-a.kills||b.placement-a.placement||a.i-b.i).slice(0,16);
  $("table").innerHTML=rows.map((r,i)=>`<div class="prow ${i===0?"top":""}">
    <div class="rank">${i+1}</div><div class="team">${teamLogo(r.t)?`<img src="${esc(teamLogo(r.t))}">`:""}<b>${esc(teamName(r.t))}</b></div>
    <div class="num">${r.kills}</div><div class="num">${r.placement}</div><div class="pts">${r.total}</div>
  </div>`).join("")||'<div class="empty">NO TEAM DATA</div>';
}

/* ---------- ELIMINATION ---------- */
let shownElims=new Set(),elimTimer=null,currentMatch="";
function eliminationSignature(t,c,events){
  const team=teamName(t).toLowerCase(),dead=[];
  for(const e of sortedEvents(events)){
    const v=String(eventVictim(e)||"").trim().toLowerCase();
    if(v){const vt=findTeam(c,v);if(vt&&teamName(vt).toLowerCase()===team)dead.push(v)}
  }
  return team+"|"+[...new Set(dead)].sort().join(",")+"|"+(t?.eliminated===true?1:0)+"|"+(String(t?.status||"").toUpperCase()==="ELIMINATED"?1:0)+"|"+(configuredAlive(t)===0?1:0);
}
function showElimination(t){
  const a=$("elimAlert"),l=$("elimLogo"),n=$("elimTeam");if(!a||!n)return;
  const u=teamLogo(t);l.innerHTML=u?`<img src="${esc(u)}">`:"";n.textContent=teamName(t);
  a.classList.remove("show");void a.offsetWidth;a.classList.add("show");clearTimeout(elimTimer);elimTimer=setTimeout(()=>a.classList.remove("show"),5200);
}
function checkEliminations(c,events,b){
  const mk=String(b?.match||"MATCH 1");
  if(mk!==currentMatch){currentMatch=mk;shownElims.clear()}
  for(const t of getEliminatedTeams(c,events)){
    const key=eliminationSignature(t,c,events);
    if(!shownElims.has(key)){shownElims.add(key);showElimination(t)}
  }
}

/* ---------- LIVE LOOP ---------- */
let lastSignature="";
async function poll(){
  if(pollBusy)return;
  pollBusy=true;
  lastPollAt=Date.now();
  try{
    const results=await Promise.allSettled([getState(),getEvents()]);
    if(results[0].status!=="fulfilled")throw results[0].reason;
    if(results[1].status!=="fulfilled")throw results[1].reason;
    let c=results[0].value;
    if(typeof c==="string"){try{c=JSON.parse(c)}catch{}}
    const events=normalizeEvents(results[1].value),b=broadcast(c);
    $("matchTitle").textContent=b.match;$("groupTitle").textContent=b.group;$("mapTop").textContent=b.map;$("mapMini").textContent=b.map;$("dayTop").textContent=b.day;
    checkEliminations(c,events,b);renderFeed(c,events);renderTable(c,events);
    const sig=sortedEvents(events).slice(0,8).map(eventKey).join("|")+"|"+JSON.stringify(b);
    if(sig!==lastSignature){lastSignature=sig;document.title=`LIVE • ${b.match} • Senpai Esports`}
  }catch(e){console.warn("Overlay live retry:",e)}
  finally{pollBusy=false}
}

// Supabase Realtime gives instant updates when the events table is published.
// Polling remains as a fallback, so OCR/Admin updates still work if Realtime is unavailable.
try{
  if(window.supabase && SUPABASE_KEY){
    const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false}});
    sb.channel("bgmi-live-events")
      .on("postgres_changes",{event:"*",schema:"public",table:"killfeed_events"},()=>poll())
      .subscribe();
  }
}catch(e){console.warn("Realtime unavailable:",e)}

// Same-origin Admin tab can wake the overlay immediately after a test/live event.
try{
  const bc="BroadcastChannel" in window?new BroadcastChannel("bgmi-kill-feed-live"):null;
  if(bc)bc.onmessage=()=>poll();
  window.addEventListener("storage",e=>{if(e.key==="kf_live_ping")poll()});
}catch(e){}

poll();
setInterval(poll,POLL_MS);
window.addEventListener("focus",poll);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)poll()});
</script></body></html>
