<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BGMI Esports Overlay</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/config.js"></script>
<script src="/supabase.js"></script>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:transparent!important;
  font-family:Inter,Segoe UI,Arial,sans-serif;
  color:#fff
}

#stage{
  position:relative;
  width:1920px;
  height:1080px;
  transform-origin:top left
}

@media(max-width:1920px){
  #stage{transform:scale(calc(100vw / 1920))}
}

@media(max-height:1080px){
  #stage{
    transform:scale(
      min(
        calc(100vw / 1920),
        calc(100vh / 1080)
      )
    )
  }
}

/* ================= TOP ================= */

.topbar{
  position:absolute;
  left:50%;
  top:22px;
  transform:translateX(-50%);

  min-width:460px;
  height:48px;

  display:flex;
  align-items:center;
  justify-content:center;
  gap:13px;

  padding:0 25px;

  background:
    linear-gradient(
      90deg,
      rgba(3,10,22,.96),
      rgba(8,22,42,.96),
      rgba(3,10,22,.96)
    );

  border:1px solid rgba(0,160,255,.55);

  box-shadow:
    0 0 18px rgba(0,130,255,.20);

  clip-path:polygon(
    4% 0,
    96% 0,
    100% 50%,
    96% 100%,
    4% 100%,
    0 50%
  );

  z-index:30
}

.live{
  display:flex;
  align-items:center;
  gap:7px;

  font-size:14px;
  font-weight:1000;
  letter-spacing:1.5px
}

.live i{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#ff2448;
  box-shadow:0 0 9px #ff2448;
  animation:pulse 1s infinite
}

@keyframes pulse{
  50%{opacity:.35}
}

.match{
  font-size:16px;
  font-weight:1000;
  letter-spacing:1px
}

.gold{
  color:#ffd800
}

.meta{
  color:#8eaccd;
  font-size:10px;
  font-weight:900;
  letter-spacing:1px
}

/* ================= PANELS ================= */

.panel{
  position:absolute;

  background:
    linear-gradient(
      180deg,
      rgba(4,13,27,.93),
      rgba(3,12,24,.88)
    );

  border:1px solid rgba(0,150,255,.48);

  box-shadow:
    0 0 18px rgba(0,100,255,.13);

  overflow:hidden
}

.panel:before{
  content:"";
  position:absolute;
  left:0;
  right:0;
  top:0;
  height:2px;

  background:
    linear-gradient(
      90deg,
      transparent,
      #00aaff,
      #72d9ff,
      #00aaff,
      transparent
    );

  box-shadow:0 0 9px #00aaff
}

.panelTitle{
  height:36px;

  display:flex;
  align-items:center;

  padding:0 10px;

  background:rgba(4,23,44,.72);

  border-bottom:1px solid rgba(0,150,255,.3);

  font-size:11px;
  font-weight:1000;
  letter-spacing:1.3px
}

.titleLine{
  width:3px;
  height:16px;

  margin-right:7px;

  background:#00b7ff;
  box-shadow:0 0 8px #00b7ff
}

/* ================= KILL FEED ================= */

.killPanel{
  left:18px;
  top:82px;
  width:360px;
  height:auto;
  min-height:92px
}

#feed{
  padding:6px
}

.killRow{
  position:relative;

  height:50px;

  display:grid;

  grid-template-columns:
    34px
    minmax(0,1fr)
    42px
    minmax(0,1fr)
    34px;

  align-items:center;

  margin-bottom:4px;
  padding:2px 4px;

  background:
    rgba(5,19,36,.78);

  border-bottom:1px solid
    rgba(0,145,255,.18);

  animation:feedIn .25s ease
}

@keyframes feedIn{
  from{
    opacity:0;
    transform:translateX(-8px)
  }
  to{
    opacity:1;
    transform:none
  }
}

.killLogo{
  width:28px;
  height:28px;

  object-fit:contain;

  background:transparent;
  border:0
}

.player{
  min-width:0;

  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;

  font-size:9px;
  font-weight:1000
}

.killer{
  text-align:right;
  padding-right:5px
}

.victim{
  padding-left:5px
}

.weapon{
  text-align:center;

  color:#ffd800;

  font-size:7px;
  font-weight:900;

  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis
}

.weaponIcon{
  display:block;
  font-size:15px;
  line-height:15px
}

.empty{
  height:50px;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#55718e;

  font-size:8px;
  font-weight:900;

  letter-spacing:1px
}

/* ================= POINTS ================= */

.pointsPanel{
  position:absolute;

  right:18px;
  top:150px;

  width:325px;

  padding-bottom:5px
}

.tableHeader,
.tableRow{
  display:grid;

  grid-template-columns:
    25px
    1fr
    42px
    62px
    55px;

  align-items:center
}

.tableHeader{
  height:28px;

  padding:0 7px;

  color:#79a3c9;

  font-size:7px;
  font-weight:1000;

  border-bottom:1px solid
    rgba(0,140,255,.25)
}

.tableRow{
  position:relative;

  height:39px;

  margin:0 6px;

  padding:0 5px;

  background:
    rgba(5,20,38,.72);

  border-bottom:1px solid
    rgba(255,255,255,.055);

  font-size:8px
}

.tableRow:nth-child(1){
  border-left:3px solid #ffd800;
  background:
    linear-gradient(
      90deg,
      rgba(255,216,0,.12),
      rgba(5,20,38,.72)
    )
}

.rank{
  font-size:9px;
  font-weight:1000;
  color:#91aaca;
  text-align:center
}

.teamCell{
  display:flex;
  align-items:center;
  gap:6px;
  min-width:0
}

.tableLogo{
  width:25px;
  height:25px;

  object-fit:contain;

  background:transparent;
  border:0
}

.tableTeamName{
  min-width:0;

  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;

  font-size:8px;
  font-weight:1000
}

.num{
  text-align:center;
  font-weight:1000
}

.total{
  color:#ffd800;
  text-align:center;
  font-size:11px;
  font-weight:1000
}

/* ================= TEAM ELIMINATED ================= */

#elimination{
  position:absolute;

  left:50%;
  top:88px;

  transform:
    translateX(-50%)
    translateY(-30px);

  width:560px;
  height:72px;

  display:none;

  align-items:center;

  padding:0 16px;

  background:
    linear-gradient(
      90deg,
      rgba(20,3,9,.98),
      rgba(48,8,17,.98),
      rgba(20,3,9,.98)
    );

  border:1px solid #ff2448;

  box-shadow:
    0 0 25px rgba(255,25,60,.45),
    inset 0 0 25px rgba(255,25,60,.08);

  clip-path:polygon(
    3% 0,
    97% 0,
    100% 50%,
    97% 100%,
    3% 100%,
    0 50%
  );

  z-index:100;

  animation:elimIn .35s ease
}

@keyframes elimIn{
  from{
    opacity:0;
    transform:
      translateX(-50%)
      translateY(-25px)
  }

  to{
    opacity:1;
    transform:
      translateX(-50%)
      translateY(0)
  }
}

#elimLogo{
  width:50px;
  height:50px;

  object-fit:contain;

  margin-right:14px;

  background:transparent;
  border:0
}

.elimText{
  min-width:0;
  flex:1
}

.elimSmall{
  color:#ff3152;

  font-size:8px;
  font-weight:1000;

  letter-spacing:2px;

  margin-bottom:3px
}

#elimName{
  font-size:17px;
  font-weight:1000;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

.elimWord{
  color:#ff2448;

  font-size:13px;
  font-weight:1000;

  letter-spacing:1px
}

/* ================= HIDE OLD FOOTER ================= */

.footer,
.bottomBar{
  display:none!important
}
</style>
</head>

<body>

<div id="stage">

  <!-- TOP -->
  <div class="topbar">

    <div class="live">
      <i></i>
      LIVE
    </div>

    <div class="match">
      <span id="matchTitle">MATCH 1</span>
      <span> | </span>
      <span class="gold" id="groupTitle">
        GROUP A × B
      </span>
    </div>

    <span class="meta" id="dayTitle">
      DAY 1
    </span>

    <span class="meta" id="mapTitle">
      ERANGEL
    </span>

  </div>


  <!-- TEAM ELIMINATED -->
  <div id="elimination">

    <img
      id="elimLogo"
      src=""
      onerror="
        this.style.visibility='hidden'
      "
    >

    <div class="elimText">

      <div class="elimSmall">
        TEAM ELIMINATED
      </div>

      <div id="elimName">
        TEAM NAME
      </div>

    </div>

    <div class="elimWord">
      ELIMINATED
    </div>

  </div>


  <!-- KILL FEED -->
  <section class="panel killPanel">

    <div class="panelTitle">
      <div class="titleLine"></div>
      KILL FEED
    </div>

    <div id="feed">
      <div class="empty">
        WAITING FOR KILLS...
      </div>
    </div>

  </section>


  <!-- POINTS TABLE -->
  <section class="panel pointsPanel">

    <div class="panelTitle">
      <div class="titleLine"></div>
      LIVE POINTS TABLE
    </div>

    <div class="tableHeader">
      <div>#</div>
      <div>TEAM</div>
      <div>KILLS</div>
      <div>PLACEMENT</div>
      <div>TOTAL</div>
    </div>

    <div id="pointsTable">
      <div class="empty">
        LOADING...
      </div>
    </div>

  </section>

</div>


<script>

/* =========================
   HELPERS
========================= */

const $ =
  id => document.getElementById(id);


function escapeHTML(str){

  return String(str ?? "")
    .replace(
      /[&<>"']/g,
      m => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[m])
    );

}


/* =========================
   SUPABASE
========================= */

const ROOM =
  localStorage.getItem("kf_room")
  || "ADITYA8029";


async function getLiveState(){

  const r =
    await supabase.rpc(
      "kf_get_state",
      {
        p_room_code:ROOM
      }
    );

  if(r.error)
    throw r.error;

  return r.data;

}


async function getLiveEvents(){

  const r =
    await supabase.rpc(
      "kf_events",
      {
        p_room_code:ROOM
      }
    );

  if(r.error)
    throw r.error;

  return r.data || [];

}


/* =========================
   TEAMS
========================= */

function teamsFromConfig(c){

  const t =
    c?.teams;


  if(Array.isArray(t))
    return t;


  if(
    t &&
    typeof t === "object"
  ){

    return Object.entries(t)
      .map(
        ([key,value]) => {

          if(
            value &&
            typeof value === "object"
          ){

            return {
              ...value,

              name:
                value.name || key,

              short:
                value.short || key

            };

          }

          return {
            name:key,
            short:key
          };

        }
      );

  }


  return [];

}


function teamName(t){

  return (
    t?.name ||
    t?.team ||
    t?.short ||
    t?.tag ||
    "UNKNOWN"
  );

}


function teamShort(t){

  return (
    t?.short ||
    t?.tag ||
    t?.abbr ||
    teamName(t)
  );

}


function teamLogo(t){

  return (
    t?.logo ||
    t?.logo_url ||
    t?.image ||
    t?.image_url ||
    ""
  );

}


function teamPlayers(t){

  const p =
    t?.players ??
    t?.members ??
    t?.roster ??
    [];


  if(Array.isArray(p)){

    return p
      .map(
        x =>
          typeof x === "string"
          ? x
          : (
              x?.name ||
              x?.ign ||
              x?.player ||
              ""
            )
      )
      .filter(Boolean);

  }


  if(
    p &&
    typeof p === "object"
  ){

    return Object.values(p)
      .map(
        x =>
          typeof x === "string"
          ? x
          : (
              x?.name ||
              x?.ign ||
              ""
            )
      )
      .filter(Boolean);

  }


  return [];

}


function findTeam(c,player){

  const p =
    String(player || "")
      .trim()
      .toLowerCase();


  if(!p)
    return null;


  const teams =
    teamsFromConfig(c);


  return (

    teams.find(
      t =>
        teamPlayers(t)
          .some(
            x =>
              String(x)
                .trim()
                .toLowerCase()
              === p
          )
    )

    ||

    teams.find(
      t =>
        teamPlayers(t)
          .some(
            x => {

              const a =
                p;

              const b =
                String(x)
                  .trim()
                  .toLowerCase();

              return (
                a.includes(b) ||
                b.includes(a)
              );

            }
          )
    )

    ||

    null

  );

}


/* =========================
   EVENT HELPERS
========================= */

function eventTime(e){

  return (
    new Date(
      e?.time ||
      e?.created_at ||
      e?.timestamp ||
      0
    ).getTime()
    || 0
  );

}


function eventKiller(e){

  return (
    e?.killer ||
    e?.p_killer ||
    e?.killer_name ||
    e?.attacker ||
    ""
  );

}


function eventVictim(e){

  return (
    e?.victim ||
    e?.p_victim ||
    e?.victim_name ||
    e?.target ||
    ""
  );

}


function eventWeapon(e){

  return (
    e?.weapon ||
    e?.p_weapon ||
    e?.weapon_name ||
    "GUN"
  );

}


/* =========================
   KILL FEED
========================= */

function renderFeed(c,events){

  const feed =
    $("feed");


  if(
    !Array.isArray(events) ||
    !events.length
  ){

    feed.innerHTML =
      `<div class="empty">
        WAITING FOR KILLS...
      </div>`;

    return;

  }


  const sorted =
    [...events]
      .sort(
        (a,b) =>
          eventTime(b) -
          eventTime(a)
      )
      .slice(0,8);


  feed.innerHTML =
    sorted
      .map(
        e => {

          const killer =
            eventKiller(e);

          const victim =
            eventVictim(e);

          const weapon =
            eventWeapon(e);


          const kt =
            findTeam(
              c,
              killer
            );

          const vt =
            findTeam(
              c,
              victim
            );


          return `

            <div class="killRow">

              <img
                class="killLogo"
                src="${escapeHTML(
                  teamLogo(kt)
                )}"
                onerror="
                  this.style.visibility='hidden'
                "
              >

              <div class="player killer">
                ${escapeHTML(killer)}
              </div>

              <div class="weapon">

                <span class="weaponIcon">
                  ⚔
                </span>

                ${escapeHTML(
                  String(weapon)
                )}

              </div>

              <div class="player victim">
                ${escapeHTML(victim)}
              </div>

              <img
                class="killLogo"
                src="${escapeHTML(
                  teamLogo(vt)
                )}"
                onerror="
                  this.style.visibility='hidden'
                "
              >

            </div>

          `;

        }
      )
      .join("");

}


/* =========================
   KILL TOTALS
========================= */

const STORE =
  "bgmi_kills_" + ROOM;


let killTotals = {};

try{

  killTotals =
    JSON.parse(
      localStorage.getItem(
        STORE
      ) || "{}"
    ) || {};

}catch{

  killTotals = {};

}


function saveKills(){

  try{

    localStorage.setItem(
      STORE,
      JSON.stringify(
        killTotals
      )
    );

  }catch{}

}


function applyKills(c,events){

  if(!Array.isArray(events))
    return;


  events.forEach(
    e => {

      const killer =
        eventKiller(e);


      const team =
        findTeam(
          c,
          killer
        );


      if(!team)
        return;


      const name =
        teamName(team);


      const id =
        String(
          e?.id ||
          (
            eventTime(e)
            + "|" +
            killer
            + "|" +
            eventVictim(e)
          )
        );


      if(!killTotals[name]){

        killTotals[name] = {
          kills:0,
          ids:{}
        };

      }


      if(
        !killTotals[name].ids[id]
      ){

        killTotals[name].kills++;

        killTotals[name].ids[id]=1;

      }

    }
  );


  saveKills();

}


/* =========================
   POINTS TABLE
========================= */

function number(v){

  const n =
    Number(v);

  return Number.isFinite(n)
    ? n
    : 0;

}


function placement(t){

  return number(
    t?.placement ??
    t?.placement_points ??
    t?.place_points ??
    0
  );

}


function renderTable(c){

  const box =
    $("pointsTable");


  const rows =
    teamsFromConfig(c)
      .map(
        (t,index)=>{

          const name =
            teamName(t);


          const kills =
            killTotals[name]?.kills ||
            number(
              t?.kills ??
              0
            );


          const place =
            placement(t);


          const total =
            number(
              t?.total_points
              ??
              t?.total
              ??
              t?.points
            ) ||
            (kills + place);


          return {
            t,
            kills,
            place,
            total,
            index
          };

        }
      )
      .sort(
        (a,b) =>
          b.total-a.total ||
          b.kills-a.kills ||
          a.index-b.index
      )
      .slice(0,16);


  box.innerHTML =
    rows
      .map(
        (r,i)=>`

          <div class="tableRow">

            <div class="rank">
              ${i+1}
            </div>

            <div class="teamCell">

              ${
                teamLogo(r.t)
                ?
                `<img
                  class="tableLogo"
                  src="${escapeHTML(
                    teamLogo(r.t)
                  )}"
                  onerror="
                    this.style.visibility='hidden'
                  "
                >`
                :
                ""
              }

              <div class="tableTeamName">
                ${escapeHTML(
                  teamShort(r.t)
                )}
              </div>

            </div>

            <div class="num">
              ${r.kills}
            </div>

            <div class="num">
              ${r.place}
            </div>

            <div class="total">
              ${r.total}
            </div>

          </div>

        `
      )
      .join("");

}


/* =========================
   BROADCAST
========================= */

function renderBroadcast(c){

  const b =
    c?.broadcast || {};


  $("matchTitle")
    .textContent =
      b.match ||
      c?.match ||
      "MATCH 1";


  $("groupTitle")
    .textContent =
      b.group ||
      c?.group ||
      "GROUP A × B";


  $("dayTitle")
    .textContent =
      b.day ||
      c?.day ||
      "DAY 1";


  $("mapTitle")
    .textContent =
      b.map ||
      c?.map ||
      "ERANGEL";

}


/* =========================
   TEAM ELIMINATION
========================= */

let eliminatedShown =
  new Set();

let eliminationTimer =
  null;


function isEliminated(t){

  if(
    t?.eliminated === true ||
    t?.is_eliminated === true
  )
    return true;


  const status =
    String(
      t?.status || ""
    ).toLowerCase();


  if(
    status === "eliminated"
  )
    return true;


  const alive =
    t?.alive ??
    t?.alive_count ??
    t?.players_alive ??
    t?.alivePlayers;


  if(
    alive !== undefined &&
    alive !== null &&
    alive !== "" &&
    number(alive) <= 0
  )
    return true;


  return false;

}


function showElimination(t){

  const banner =
    $("elimination");


  const logo =
    $("elimLogo");


  const src =
    teamLogo(t);


  if(src){

    logo.src =
      src;

    logo.style.visibility =
      "visible";

  }else{

    logo.style.visibility =
      "hidden";

  }


  $("elimName")
    .textContent =
      teamName(t);


  banner.style.display =
    "flex";


  clearTimeout(
    eliminationTimer
  );


  eliminationTimer =
    setTimeout(
      ()=>{
        banner.style.display =
          "none";
      },
      5000
    );

}


function checkEliminations(c){

  const teams =
    teamsFromConfig(c);


  teams.forEach(
    t => {

      if(
        !isEliminated(t)
      )
        return;


      const name =
        teamName(t);


      if(
        eliminatedShown.has(name)
      )
        return;


      eliminatedShown.add(name);


      showElimination(t);

    }
  );

}


/* =========================
   MAIN LOOP
========================= */

async function update(){

  try{

    const [
      state,
      events
    ] =
      await Promise.all([
        getLiveState(),
        getLiveEvents()
      ]);


    renderBroadcast(
      state
    );


    applyKills(
      state,
      events
    );


    renderFeed(
      state,
      events
    );


    renderTable(
      state
    );


    checkEliminations(
      state
    );


  }catch(err){

    console.error(
      "OVERLAY ERROR:",
      err
    );

  }

}


update();

setInterval(
  update,
  1000
);

</script>

</body>
</html>
