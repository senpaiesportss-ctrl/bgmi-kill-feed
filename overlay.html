<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BGMI Esports Overlay</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:transparent !important;
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
}

#stage{
  position:relative;
  width:1920px;
  height:1080px;
  background:transparent;
  overflow:hidden;
}

/* =====================================================
   TOP CENTER MATCH INFO
===================================================== */

.topInfo{
  position:absolute;
  top:18px;
  left:50%;
  transform:translateX(-50%);

  height:42px;
  min-width:430px;

  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;

  padding:0 25px;

  background:rgba(3,12,25,.78);

  border:1px solid rgba(0,170,255,.65);

  box-shadow:
    0 0 16px rgba(0,140,255,.15),
    inset 0 0 15px rgba(0,100,255,.06);

  clip-path:polygon(
    4% 0,
    96% 0,
    100% 50%,
    96% 100%,
    4% 100%,
    0 50%
  );

  z-index:50;
}

.liveDot{
  width:8px;
  height:8px;
  border-radius:50%;

  background:#ff2448;

  box-shadow:0 0 10px #ff2448;

  animation:pulse 1s infinite;
}

@keyframes pulse{
  50%{opacity:.35}
}

.match{
  font-size:16px;
  font-weight:1000;
  letter-spacing:1.3px;
}

.gold{
  color:#ffd900;
}

.topBadge{
  color:#8eb9df;
  font-size:12px;
  font-weight:900;
  letter-spacing:1px;
}


/* =====================================================
   COMMON SIDE PANEL
===================================================== */

.panel{
  position:absolute;

  background:rgba(2,11,23,.72);

  border:1px solid rgba(0,153,255,.55);

  box-shadow:
    0 0 18px rgba(0,100,255,.12),
    inset 0 0 25px rgba(0,100,255,.035);

  overflow:hidden;
}


/* =====================================================
   KILL FEED
===================================================== */

.killPanel{
  left:20px;
  top:82px;

  width:365px;

  /* compact height */
  max-height:410px;
}

.panelTitle{
  height:40px;

  display:flex;
  align-items:center;

  padding:0 13px;

  background:rgba(4,25,47,.82);

  border-bottom:1px solid rgba(0,145,255,.3);

  font-size:14px;
  font-weight:1000;
  letter-spacing:1.5px;
}

.titleBar{
  width:4px;
  height:19px;

  margin-right:9px;

  background:#00aaff;

  box-shadow:0 0 10px #00aaff;
}

#feed{
  padding:8px;
}

.kill{
  position:relative;

  height:53px;

  margin-bottom:6px;

  display:grid;

  grid-template-columns:
    34px
    minmax(0,1fr)
    40px
    minmax(0,1fr)
    34px;

  align-items:center;

  padding:3px 5px;

  background:
    linear-gradient(
      90deg,
      rgba(5,28,53,.90),
      rgba(2,14,29,.82)
    );

  border:1px solid rgba(0,125,220,.30);

  animation:killIn .28s ease;
}

.kill::before{
  content:"";

  position:absolute;
  left:0;
  top:0;
  bottom:0;

  width:3px;

  background:#00aaff;

  box-shadow:0 0 8px #00aaff;
}

@keyframes killIn{
  from{
    opacity:0;
    transform:translateX(-12px);
  }

  to{
    opacity:1;
    transform:none;
  }
}

.killLogo{
  width:28px;
  height:28px;

  object-fit:contain;

  background:#020912;

  border:1px solid rgba(0,160,255,.4);

  padding:2px;
}

.player{
  min-width:0;

  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;

  font-size:11px;
  font-weight:1000;
}

.killer{
  text-align:right;
  padding-right:6px;
}

.victim{
  padding-left:6px;
}

.weapon{
  text-align:center;

  color:#ffd900;

  font-weight:1000;
}

.weaponIcon{
  font-size:16px;
  line-height:16px;
}

.weaponName{
  margin-top:1px;

  font-size:6px;

  color:#ffd900;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.killTime{
  position:absolute;

  right:4px;
  bottom:1px;

  font-size:6px;

  color:#5c7e9d;
}

.waiting{
  height:80px;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#557894;

  font-size:10px;
  font-weight:900;
  letter-spacing:1.2px;
}


/* =====================================================
   POINTS TABLE
===================================================== */

.pointsPanel{
  right:18px;
  top:185px;

  width:325px;

  /* only table height */
  max-height:710px;
}

.pointsTitle{
  height:40px;

  display:flex;
  align-items:center;

  padding:0 13px;

  background:
    linear-gradient(
      90deg,
      rgba(5,27,52,.94),
      rgba(3,15,30,.88)
    );

  border-bottom:1px solid rgba(0,145,255,.35);

  font-size:14px;
  font-weight:1000;
  letter-spacing:1.2px;
}

.tableHead,
.tableRow{
  display:grid;

  grid-template-columns:
    28px
    minmax(0,1fr)
    42px
    58px
    70px;

  align-items:center;
}

.tableHead{
  height:30px;

  padding:0 8px;

  color:#7eaed4;

  background:rgba(4,19,37,.90);

  font-size:8px;
  font-weight:1000;

  letter-spacing:.5px;
}

.tableRow{
  position:relative;

  height:39px;

  padding:0 8px;

  border-bottom:1px solid rgba(90,140,180,.10);

  background:rgba(2,13,26,.62);

  font-size:9px;
  font-weight:900;
}

.tableRow:nth-child(even){
  background:rgba(5,23,42,.64);
}

.rank{
  color:#86a9c8;
  font-size:12px;
}

.teamCell{
  min-width:0;

  display:flex;
  align-items:center;

  gap:6px;
}

.teamLogo{
  width:25px;
  height:25px;

  object-fit:contain;

  flex-shrink:0;

  padding:2px;

  background:#020912;

  border:1px solid rgba(0,150,255,.35);
}

.teamName{
  min-width:0;

  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;

  font-size:9px;
}

.stat{
  text-align:center;

  color:#fff;
}

.total{
  color:#ffd900;

  font-size:12px;
  font-weight:1000;
}

.top1{
  background:
    linear-gradient(
      90deg,
      rgba(255,213,0,.12),
      rgba(255,213,0,.025)
    ) !important;
}

.top1::before{
  content:"";

  position:absolute;

  left:0;
  top:0;
  bottom:0;

  width:3px;

  background:#ffd900;

  box-shadow:0 0 8px #ffd900;
}

.top2::before{
  content:"";

  position:absolute;

  left:0;
  top:0;
  bottom:0;

  width:3px;

  background:#cdd7e0;
}

.top3::before{
  content:"";

  position:absolute;

  left:0;
  top:0;
  bottom:0;

  width:3px;

  background:#bd783f;
}

.eliminatedRow{
  opacity:.38;

  background:
    rgba(160,10,30,.13) !important;
}

.eliminatedRow .teamName{
  color:#85909b;
  text-decoration:line-through;
}

.elimTag{
  position:absolute;

  right:4px;
  bottom:2px;

  color:#ff3152;

  font-size:5px;
  font-weight:1000;
}


/* =====================================================
   ELIMINATION ALERT
===================================================== */

#elimination{
  display:none;

  position:absolute;

  top:76px;
  left:50%;

  transform:translateX(-50%);

  min-width:500px;
  height:65px;

  align-items:center;

  padding:0 18px;

  background:
    linear-gradient(
      90deg,
      rgba(8,3,8,.95),
      rgba(35,5,13,.95),
      rgba(8,3,8,.95)
    );

  border:1px solid #ff2448;

  box-shadow:
    0 0 22px rgba(255,20,60,.42);

  z-index:100;

  animation:eliminateIn .4s ease;
}

@keyframes eliminateIn{
  from{
    opacity:0;
    transform:translate(-50%,-20px) scale(.92);
  }

  to{
    opacity:1;
    transform:translate(-50%,0) scale(1);
  }
}

.elimLogo{
  width:44px;
  height:44px;

  object-fit:contain;

  margin-right:12px;

  padding:2px;

  background:#02070d;
}

.elimInfo{
  display:flex;
  flex-direction:column;
}

.elimSmall{
  color:#ff3152;

  font-size:8px;
  font-weight:1000;

  letter-spacing:2px;
}

.elimTeam{
  margin-top:2px;

  font-size:17px;
  font-weight:1000;

  text-transform:uppercase;
}

.elimWord{
  margin-left:auto;

  color:#ff2448;

  font-size:18px;
  font-weight:1000;

  letter-spacing:1px;
}


/* =====================================================
   SMALL BLUE CORNERS
===================================================== */

.corner{
  position:absolute;

  width:22px;
  height:22px;

  pointer-events:none;
}

.cornerTL{
  left:0;
  top:0;

  border-left:2px solid #00aaff;
  border-top:2px solid #00aaff;
}

.cornerTR{
  right:0;
  top:0;

  border-right:2px solid #00aaff;
  border-top:2px solid #00aaff;
}

.cornerBL{
  left:0;
  bottom:0;

  border-left:2px solid #00aaff;
  border-bottom:2px solid #00aaff;
}

.cornerBR{
  right:0;
  bottom:0;

  border-right:2px solid #00aaff;
  border-bottom:2px solid #00aaff;
}

</style>
</head>


<body>

<div id="stage">

  <!-- ================================================
       SMALL TOP MATCH INFO
  ================================================= -->

  <div class="topInfo">

    <span class="liveDot"></span>

    <span class="match">
      <span id="matchTitle">MATCH 1</span>
      <span> | </span>
      <span id="groupTitle" class="gold">
        GROUP A × B
      </span>
    </span>

    <span class="topBadge" id="dayTitle">
      DAY 1
    </span>

    <span class="topBadge" id="mapTitle">
      ERANGEL
    </span>

  </div>


  <!-- ================================================
       LEFT KILL FEED
  ================================================= -->

  <section class="panel killPanel">

    <div class="panelTitle">
      <span class="titleBar"></span>
      KILL FEED
    </div>

    <div id="feed">

      <div class="waiting">
        WAITING FOR KILLS...
      </div>

    </div>

    <div class="corner cornerTL"></div>
    <div class="corner cornerBL"></div>

  </section>


  <!-- ================================================
       RIGHT POINTS TABLE
  ================================================= -->

  <section class="panel pointsPanel">

    <div class="pointsTitle">
      <span class="titleBar"></span>
      LIVE POINTS TABLE
    </div>

    <div class="tableHead">

      <div>#</div>
      <div>TEAM</div>
      <div class="stat">KILLS</div>
      <div class="stat">PLACEMENT</div>
      <div class="stat">TOTAL</div>

    </div>

    <div id="table"></div>

    <div class="corner cornerTR"></div>
    <div class="corner cornerBR"></div>

  </section>


  <!-- ================================================
       ELIMINATION
  ================================================= -->

  <div id="elimination">

    <img
      id="elimLogo"
      class="elimLogo"
      src=""
      onerror="this.style.display='none'"
    >

    <div class="elimInfo">

      <div class="elimSmall">
        TEAM ELIMINATED
      </div>

      <div
        id="elimTeam"
        class="elimTeam"
      >
        TEAM
      </div>

    </div>

    <div class="elimWord">
      ELIMINATED
    </div>

  </div>

</div>


<!-- ================================================
     EXISTING CONNECTION FILES
================================================= -->

<script src="config.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<script>

/* =====================================================
   BASIC HELPERS
===================================================== */

const $ = id =>
  document.getElementById(id);

const FALLBACK =
  "data:image/svg+xml;charset=UTF-8," +
  encodeURIComponent(`
    <svg xmlns="http://www.w3.org/2000/svg"
         width="100"
         height="100">
      <rect width="100"
            height="100"
            fill="#061321"/>
      <text x="50"
            y="60"
            text-anchor="middle"
            fill="#517492"
            font-size="30"
            font-family="Arial">
        —
      </text>
    </svg>
  `);


function esc(v){

  return String(v ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =====================================================
   TEAM DATA
===================================================== */

function getTeams(c){

  if(Array.isArray(c?.teams))
    return c.teams;

  if(Array.isArray(c?.roster))
    return c.roster;

  if(Array.isArray(c?.teamList))
    return c.teamList;

  return [];
}


function teamName(t){

  return (
    t?.name ||
    t?.team_name ||
    t?.title ||
    t?.short ||
    t?.tag ||
    "UNKNOWN TEAM"
  );

}


function teamLogo(t){

  return (
    t?.logo ||
    t?.logo_url ||
    t?.image ||
    t?.image_url ||
    FALLBACK
  );

}


function getPlayers(t){

  const p =
    t?.players ||
    t?.members ||
    t?.roster ||
    [];

  if(!Array.isArray(p))
    return [];

  return p.map(x => {

    if(typeof x === "string")
      return x;

    return (
      x?.name ||
      x?.ign ||
      x?.player_name ||
      x?.username ||
      ""
    );

  }).filter(Boolean);

}


/* =====================================================
   TEAM LOOKUP
===================================================== */

function findTeam(c,name){

  if(!name)
    return null;

  const target =
    String(name)
      .trim()
      .toLowerCase();


  for(const t of getTeams(c)){

    const possible = [

      teamName(t),
      t?.short,
      t?.tag,
      t?.abbr

    ].filter(Boolean);


    if(
      possible.some(x =>
        String(x)
          .trim()
          .toLowerCase()
        === target
      )
    ){
      return t;
    }


    const p =
      getPlayers(t);


    if(
      p.some(x =>
        String(x)
          .trim()
          .toLowerCase()
        === target
      )
    ){
      return t;
    }

  }

  return null;
}


/* =====================================================
   EVENT FIELDS
===================================================== */

function killer(e){

  return (
    e?.killer ||
    e?.killer_name ||
    e?.p_killer ||
    e?.attacker ||
    ""
  );

}


function victim(e){

  return (
    e?.victim ||
    e?.victim_name ||
    e?.p_victim ||
    e?.target ||
    ""
  );

}


function weapon(e){

  return (
    e?.weapon ||
    e?.weapon_name ||
    e?.p_weapon ||
    "GUN"
  );

}


function eventTime(e){

  return (
    e?.time ||
    e?.created_at ||
    e?.timestamp ||
    ""
  );

}


/* =====================================================
   WEAPON ICON
===================================================== */

function weaponIcon(w){

  w =
    String(w || "")
      .toLowerCase();


  if(
    w.includes("awm") ||
    w.includes("kar") ||
    w.includes("m24") ||
    w.includes("sniper")
  ){
    return "🎯";
  }


  if(
    w.includes("grenade") ||
    w.includes("frag")
  ){
    return "💥";
  }


  if(
    w.includes("uzi") ||
    w.includes("ump") ||
    w.includes("vector") ||
    w.includes("smg")
  ){
    return "⚡";
  }


  return "⚔";

}


/* =====================================================
   KILL FEED
===================================================== */

function renderFeed(c,events){

  const box =
    $("feed");


  if(
    !Array.isArray(events) ||
    !events.length
  ){

    box.innerHTML = `
      <div class="waiting">
        WAITING FOR KILLS...
      </div>
    `;

    return;
  }


  const latest =
    [...events]
      .sort(
        (a,b) =>
          new Date(eventTime(b) || 0)
          -
          new Date(eventTime(a) || 0)
      )
      .slice(0,6);


  box.innerHTML =
    latest.map(e => {

      const k =
        killer(e);

      const v =
        victim(e);

      const w =
        weapon(e);


      const kt =
        findTeam(c,k);

      const vt =
        findTeam(c,v);


      let tm = "";


      if(eventTime(e)){

        const d =
          new Date(
            eventTime(e)
          );

        if(!isNaN(d)){

          tm =
            d.toLocaleTimeString(
              [],
              {
                hour:"2-digit",
                minute:"2-digit",
                second:"2-digit"
              }
            );

        }

      }


      return `

        <div class="kill">

          <img
            class="killLogo"
            src="${esc(teamLogo(kt))}"
            onerror="
              this.src='${esc(FALLBACK)}'
            "
          >

          <div class="player killer">
            ${esc(k || "UNKNOWN")}
          </div>

          <div class="weapon">

            <div class="weaponIcon">
              ${weaponIcon(w)}
            </div>

            <div class="weaponName">
              ${esc(w)}
            </div>

          </div>

          <div class="player victim">
            ${esc(v || "UNKNOWN")}
          </div>

          <img
            class="killLogo"
            src="${esc(teamLogo(vt))}"
            onerror="
              this.src='${esc(FALLBACK)}'
            "
          >

          <div class="killTime">
            ${esc(tm)}
          </div>

        </div>

      `;

    }).join("");

}


/* =====================================================
   PERSISTENT KILL TOTALS
===================================================== */

/*
   kf_events currently returns recent events.
   We therefore remember event IDs locally so the
   displayed kill count doesn't immediately reset.
*/

const ROOM =
  localStorage.getItem("kf_room")
  || "ADITYA8029";

const TOTAL_KEY =
  "bgmi_overlay_kills_" + ROOM;


let killTotals = {};

try{

  killTotals =
    JSON.parse(
      localStorage.getItem(TOTAL_KEY)
      || "{}"
    );

}catch{

  killTotals = {};

}


function saveKills(){

  try{

    localStorage.setItem(
      TOTAL_KEY,
      JSON.stringify(killTotals)
    );

  }catch{}

}


function updateKillTotals(c,events){

  if(!Array.isArray(events))
    return;


  for(const e of events){

    const id =
      String(
        e?.id ??
        (
          eventTime(e)
          + "|" +
          killer(e)
          + "|" +
          victim(e)
        )
      );


    if(
      !killTotals[id]
    ){

      const kt =
        findTeam(
          c,
          killer(e)
        );


      if(kt){

        const name =
          teamName(kt);


        if(
          !killTotals[name]
        ){
          killTotals[name] = {
            kills:0,
            events:{}
          };
        }


        killTotals[name].kills++;


        killTotals[name].events[id] =
          true;

      }

    }

  }


  saveKills();

}


/* =====================================================
   TEAM KILLS
===================================================== */

function teamKills(c,t){

  const name =
    teamName(t);


  return Number(
    killTotals[name]?.kills
    || t?.kills
    || 0
  );

}


/* =====================================================
   PLACEMENT POINTS
===================================================== */

function placementPoints(t){

  return Number(
    t?.placement ??
    t?.placement_points ??
    t?.finish ??
    t?.finish_points ??
    t?.place_points ??
    t?.position_points ??
    0
  ) || 0;

}


/* =====================================================
   TOTAL POINTS
===================================================== */

function totalPoints(t,kills){

  /*
    If admin already supplies total points,
    use that.
  */

  if(
    t?.total_points !== undefined
  ){

    return Number(
      t.total_points
    ) || 0;

  }


  /*
    Otherwise:
    TOTAL = KILLS + PLACEMENT
  */

  return (
    kills +
    placementPoints(t)
  );

}


/* =====================================================
   ELIMINATED
===================================================== */

function isEliminated(t){

  return (

    t?.eliminated === true ||

    t?.is_eliminated === true ||

    String(
      t?.status || ""
    ).toLowerCase()
    === "eliminated"

  );

}


/* =====================================================
   POINTS TABLE
===================================================== */

function renderTable(c){

  const box =
    $("table");


  let rows =
    getTeams(c)
      .map(t => {

        const kills =
          teamKills(c,t);

        const placement =
          placementPoints(t);

        const total =
          totalPoints(
            t,
            kills
          );


        return {

          team:t,

          kills:kills,

          placement:placement,

          total:total,

          eliminated:
            isEliminated(t)

        };

      });


  /*
    Highest total first
  */

  rows.sort((a,b) => {

    if(
      b.total !== a.total
    ){
      return b.total - a.total;
    }

    return b.kills - a.kills;

  });


  /*
    Exactly maximum 16 teams
  */

  rows =
    rows.slice(0,16);


  if(!rows.length){

    box.innerHTML = `
      <div class="waiting">
        NO TEAMS
      </div>
    `;

    return;

  }


  box.innerHTML =
    rows.map((r,i) => {

      let rankClass = "";

      if(i === 0)
        rankClass = "top1";

      if(i === 1)
        rankClass = "top2";

      if(i === 2)
        rankClass = "top3";


      return `

        <div class="
          tableRow
          ${rankClass}
          ${r.eliminated
            ? "eliminatedRow"
            : ""}
        ">

          <div class="rank">
            ${i+1}
          </div>


          <div class="teamCell">

            <img
              class="teamLogo"
              src="${esc(teamLogo(r.team))}"
              onerror="
                this.src='${esc(FALLBACK)}'
              "
            >

            <div class="teamName">
              ${esc(
                teamName(r.team)
              )}
            </div>

            ${
              r.eliminated
              ?
              `<div class="elimTag">
                ELIMINATED
              </div>`
              :
              ""
            }

          </div>


          <div class="stat">
            ${r.kills}
          </div>


          <div class="stat">
            ${r.placement}
          </div>


          <div class="stat total">
            ${r.total}
          </div>

        </div>

      `;

    }).join("");

}


/* =====================================================
   BROADCAST SETTINGS
===================================================== */

function renderBroadcast(c){

  const b =
    c?.broadcast || {};


  $("matchTitle").textContent =
    b.match ||
    c?.match ||
    "MATCH 1";


  $("groupTitle").textContent =
    b.group ||
    c?.group ||
    "GROUP A × B";


  $("dayTitle").textContent =
    b.day ||
    c?.day ||
    "DAY 1";


  $("mapTitle").textContent =
    b.map ||
    c?.map ||
    "ERANGEL";

}


/* =====================================================
   ELIMINATION ALERT
===================================================== */

let shownEliminations =
  new Set();

let elimTimer =
  null;


function checkEliminations(c){

  const current =
    new Set();


  for(
    const t of getTeams(c)
  ){

    if(
      !isEliminated(t)
    ){
      continue;
    }


    const name =
      teamName(t);


    current.add(name);


    if(
      !shownEliminations
        .has(name)
    ){

      showElimination(t);

    }

  }


  shownEliminations =
    current;

}


function showElimination(t){

  const el =
    $("elimination");


  $("elimLogo").src =
    teamLogo(t);


  $("elimTeam").textContent =
    teamName(t);


  el.style.display =
    "flex";


  clearTimeout(
    elimTimer
  );


  elimTimer =
    setTimeout(() => {

      el.style.display =
        "none";

    },5000);

}


/* =====================================================
   UPDATE
===================================================== */

async function update(){

  try{

    const state =
      await getState();


    const events =
      await getEvents();


    renderBroadcast(
      state
    );


    updateKillTotals(
      state,
      events
    );


    renderFeed(
      state,
      events
    );


    renderTable(
      state
    );


    checkEliminations(
      state
    );


  }catch(err){

    console.error(
      "BGMI OVERLAY ERROR:",
      err
    );

  }

}


/* =====================================================
   START
===================================================== */

update();

setInterval(
  update,
  1000
);

</script>

</body>
</html>
