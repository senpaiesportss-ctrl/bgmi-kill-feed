<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920,height=1080">
<title>BGMI Esports Overlay</title>

<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:transparent;
  font-family:Arial,Helvetica,sans-serif;
  color:#fff
}

#stage{
  position:relative;
  width:1920px;
  height:1080px;
  transform-origin:top left
}

@media(max-width:1920px){
  #stage{transform:scale(calc(100vw / 1920))}
}

@media(max-height:1080px){
  #stage{
    transform:scale(
      min(
        calc(100vw / 1920),
        calc(100vh / 1080)
      )
    )
  }
}

:root{
  --blue:#087dff;
  --cyan:#19cfff;
  --gold:#ffd52b;
  --panel:rgba(5,12,25,.95);
  --muted:#7894b8;
}

/* ================= TOP BAR ================= */

.topbar{
  position:absolute;
  left:50%;
  top:24px;
  transform:translateX(-50%);

  width:520px;
  height:54px;

  display:flex;
  align-items:center;
  justify-content:center;
  gap:15px;

  padding:0 20px;

  background:
    linear-gradient(
      90deg,
      rgba(5,12,26,.98),
      rgba(7,18,38,.96),
      rgba(5,12,26,.98)
    );

  border:1px solid rgba(25,170,255,.45);

  clip-path:polygon(
    4% 0,
    96% 0,
    100% 50%,
    96% 100%,
    4% 100%,
    0 50%
  );

  box-shadow:
    0 0 18px rgba(0,150,255,.22);
}

.live{
  display:flex;
  align-items:center;
  gap:8px;

  background:#c91525;

  padding:7px 12px;

  font-size:15px;
  font-weight:1000;
  letter-spacing:2px;
}

.live i{
  width:8px;
  height:8px;
  background:#fff;
  border-radius:50%;
  box-shadow:0 0 9px #fff;
}

.matchblock{
  line-height:1;
  text-align:center;
  white-space:nowrap;
}

.matchtitle{
  font-size:20px;
  font-weight:1000;
  display:inline;
}

.group{
  font-size:14px;
  color:var(--gold);
  font-weight:900;
  letter-spacing:1.5px;
  margin-left:5px;
}

.day{
  font-size:10px;
  color:#8fa9c8;
  font-weight:900;
  margin-left:8px;
  letter-spacing:1px;
}

.map{
  font-size:10px;
  color:#8fa9c8;
  font-weight:900;
  margin-left:7px;
  letter-spacing:1px;
}

/* ================= KILL FEED ================= */

.killPanel{
  position:absolute;
  left:22px;
  top:82px;

  width:370px;

  background:rgba(5,12,25,.95);

  border:1px solid rgba(25,170,255,.55);

  box-shadow:
    0 0 18px rgba(0,150,255,.22);
}

.panelHeader{
  height:38px;

  display:flex;
  align-items:center;

  padding:0 12px;

  border-bottom:1px solid rgba(25,170,255,.35);

  position:relative;
}

.panelHeader:before{
  content:"";
  width:3px;
  height:17px;

  background:#19cfff;

  margin-right:8px;

  box-shadow:0 0 8px #19cfff;
}

.panelTitle{
  font-size:13px;
  font-weight:1000;
  letter-spacing:1.5px;
}

.killRows{
  padding:7px;
}

.killRow{
  height:48px;

  display:grid;

  grid-template-columns:
    31px
    minmax(0,1fr)
    42px
    minmax(0,1fr)
    31px;

  align-items:center;

  gap:5px;

  margin-bottom:5px;

  padding:0 5px;

  background:
    linear-gradient(
      90deg,
      rgba(12,28,49,.95),
      rgba(7,14,27,.88)
    );

  border:1px solid rgba(70,150,220,.15);
}

.killLogo{
  width:27px;
  height:27px;

  object-fit:contain;

  background:transparent;
}

.player{
  min-width:0;

  font-size:10px;
  font-weight:1000;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.killer{
  text-align:right;
}

.victim{
  text-align:left;
  color:#dbe7f5;
}

.weapon{
  display:flex;
  align-items:center;
  justify-content:center;

  font-size:8px;
  font-weight:1000;

  color:var(--gold);

  text-align:center;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.emptyFeed{
  height:48px;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#6683a7;

  font-size:9px;
  font-weight:1000;

  letter-spacing:2px;
}

/* ================= POINTS ================= */

.pointsPanel{
  position:absolute;

  right:22px;
  top:130px;

  width:390px;

  background:rgba(5,12,25,.95);

  border:1px solid rgba(25,170,255,.55);

  box-shadow:
    0 0 18px rgba(0,150,255,.22);

  overflow:hidden;
}

.pointsHeader{
  height:46px;

  display:flex;
  align-items:center;

  padding:0 12px;

  border-bottom:1px solid rgba(31,166,255,.35);
}

.pointsHeader:before{
  content:"";
  width:3px;
  height:18px;

  background:#19cfff;

  margin-right:8px;

  box-shadow:0 0 8px #19cfff;
}

.pointsTitle{
  font-size:13px;
  font-weight:1000;
  letter-spacing:1.3px;
}

.pointsMap{
  font-size:8px;
  color:#7797bd;
  font-weight:900;
  margin-top:2px;
  letter-spacing:1px;
}

.liveTag{
  margin-left:auto;

  color:#ff5360;

  font-size:8px;
  font-weight:1000;
  letter-spacing:1px;
}

.columns{
  height:27px;

  display:grid;

  grid-template-columns:
    28px
    1fr
    48px
    68px
    55px;

  align-items:center;

  color:#7797bd;

  font-size:8px;
  font-weight:1000;

  border-bottom:1px solid rgba(255,255,255,.08);
}

.columns div{
  text-align:center;
}

.columns div:nth-child(2){
  text-align:left;
}

.table{
  padding:5px 7px 7px;
}

.prow{
  height:38px;

  display:grid;

  grid-template-columns:
    28px
    1fr
    48px
    68px
    55px;

  align-items:center;

  margin:2px 0;

  padding:0 5px;

  background:
    linear-gradient(
      90deg,
      rgba(9,23,43,.95),
      rgba(7,14,28,.72)
    );

  border:1px solid rgba(70,150,220,.12);
}

.prow:first-child{
  border-color:rgba(255,213,43,.55);
}

.rank{
  text-align:center;

  font-size:10px;
  font-weight:1000;
}

.teamCell{
  display:flex;
  align-items:center;

  gap:7px;

  min-width:0;
}

.teamCell img{
  width:27px;
  height:27px;

  object-fit:contain;
}

.teamName{
  min-width:0;

  font-size:9px;
  font-weight:1000;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.number{
  text-align:center;

  font-size:10px;
  font-weight:1000;
}

.total{
  text-align:center;

  color:var(--gold);

  font-size:12px;
  font-weight:1000;
}

.noTeams{
  padding:20px;

  text-align:center;

  color:#6683a7;

  font-size:9px;
  font-weight:1000;

  letter-spacing:2px;
}

/* ================= ELIMINATION ================= */

#elimBanner{
  position:absolute;

  left:50%;
  top:92px;

  transform:translateX(-50%);

  width:620px;
  min-height:88px;

  display:none;

  align-items:center;

  padding:10px 24px;

  background:
    linear-gradient(
      90deg,
      rgba(65,5,12,.98),
      rgba(22,7,13,.97),
      rgba(65,5,12,.98)
    );

  border:1px solid rgba(255,45,65,.8);

  box-shadow:
    0 0 30px rgba(255,25,50,.45),
    inset 0 0 25px rgba(255,25,50,.12);

  z-index:100;
}

#elimLogo{
  width:62px;
  height:62px;

  object-fit:contain;

  margin-right:18px;
}

.elimContent{
  text-align:left;
}

.elimTag{
  color:#ff4057;

  font-size:9px;
  font-weight:1000;

  letter-spacing:3px;
}

#elimName{
  margin-top:3px;

  color:#fff;

  font-size:24px;
  font-weight:1000;

  letter-spacing:1px;

  text-shadow:0 2px 8px #000;
}

.elimWord{
  margin-left:auto;

  color:#ff304e;

  font-size:22px;
  font-weight:1000;

  letter-spacing:2px;
}

/* ================= STATUS ================= */

#status{
  position:absolute;

  left:22px;
  bottom:25px;

  font-size:9px;

  color:#587594;

  letter-spacing:1.5px;

  font-weight:800;
}

#loading{
  display:none!important;
}
</style>
</head>

<body>

<div id="stage">

  <!-- TOP BAR -->

  <div class="topbar">

    <div class="live">
      <i></i>
      LIVE
    </div>

    <div class="matchblock">

      <span
        class="matchtitle"
        id="matchTitle">
        MATCH 1
      </span>

      <span
        class="group"
        id="groupTitle">
        GROUP A × B
      </span>

      <span
        class="day"
        id="dayTitle">
        DAY 1
      </span>

      <span
        class="map"
        id="mapTitle">
        ERANGEL
      </span>

    </div>

  </div>


  <!-- ================= KILL FEED ================= -->

  <section class="killPanel">

    <div class="panelHeader">
      <div class="panelTitle">
        KILL FEED
      </div>
    </div>

    <div
      id="killRows"
      class="killRows">

      <div class="emptyFeed">
        WAITING FOR KILLS...
      </div>

    </div>

  </section>


  <!-- ================= POINTS TABLE ================= -->

  <section class="pointsPanel">

    <div class="pointsHeader">

      <div>
        <div class="pointsTitle">
          LIVE POINTS TABLE
        </div>

        <div class="pointsMap">
          BGMI •
          <span id="pointsMap">
            ERANGEL
          </span>
        </div>
      </div>

      <div class="liveTag">
        ● LIVE
      </div>

    </div>

    <div class="columns">

      <div>#</div>
      <div>TEAM</div>
      <div>KILLS</div>
      <div>PLACEMENT</div>
      <div>TOTAL</div>

    </div>

    <div
      id="table"
      class="table">

      <div class="noTeams">
        LOADING...
      </div>

    </div>

  </section>


  <!-- ================= TEAM ELIMINATED ================= -->

  <div id="elimBanner">

    <img
      id="elimLogo"
      src=""
    >

    <div class="elimContent">

      <div class="elimTag">
        TEAM ELIMINATED
      </div>

      <div id="elimName">
        TEAM NAME
      </div>

    </div>

    <div class="elimWord">
      ELIMINATED
    </div>

  </div>


  <div id="status">
    CONNECTING...
  </div>

</div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const CFG =
  window.KF_CONFIG || {};

const SUPABASE_URL =
  CFG.SUPABASE_URL ||
  "https://nuywberanlfvngjnjcpx.supabase.co";

const SUPABASE_KEY =
  CFG.SUPABASE_PUBLISHABLE_KEY || "";

const ROOM =
  localStorage.getItem("kf_room") ||
  "ADITYA8029";

const sb =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

const $ =
  id => document.getElementById(id);


/* =========================================================
   HELPERS
========================================================= */

function esc(s){
  return String(s ?? "")
    .replace(
      /[&<>"']/g,
      m => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[m])
    );
}

function arr(v){
  return Array.isArray(v)
    ? v
    : [];
}

async function rpc(name,params){

  const r =
    await sb.rpc(
      name,
      params
    );

  if(r.error)
    throw r.error;

  return r.data;
}


/* =========================================================
   CLOUD
========================================================= */

async function getState(){

  return rpc(
    "kf_get_state",
    {
      p_room_code:ROOM
    }
  );

}

async function getEvents(){

  return rpc(
    "kf_events",
    {
      p_room_code:ROOM
    }
  );

}


/* =========================================================
   TEAM DATA
========================================================= */

function teamsFromConfig(c){

  const t =
    c?.teams;

  if(Array.isArray(t))
    return t;

  if(
    t &&
    typeof t === "object"
  ){

    return Object.entries(t)
      .map(
        ([key,val]) => {

          if(
            val &&
            typeof val === "object"
          ){

            return {
              ...val,
              name:
                val.name ||
                key
            };

          }

          return {
            name:key,
            players:[]
          };

        }
      );

  }

  return [];
}


function teamName(t){

  return (
    t?.name ||
    t?.team ||
    t?.short ||
    t?.tag ||
    "UNKNOWN"
  );

}


function teamLogo(t){

  return (
    t?.logo ||
    t?.logo_url ||
    t?.image ||
    t?.image_url ||
    ""
  );

}


function teamPlayers(t){

  const p =
    t?.players ??
    t?.members ??
    t?.roster ??
    [];

  if(Array.isArray(p)){

    return p
      .map(
        x =>
          typeof x === "string"
          ? x
          : (
              x?.name ||
              x?.ign ||
              x?.player ||
              ""
            )
      )
      .filter(Boolean);

  }

  if(
    typeof p === "object"
  ){

    return Object.values(p)
      .map(
        x =>
          typeof x === "string"
          ? x
          : (
              x?.name ||
              x?.ign ||
              x?.player ||
              ""
            )
      )
      .filter(Boolean);

  }

  return [];
}


/* Find player's team */

function findTeam(c,player){

  const p =
    String(player || "")
      .trim()
      .toLowerCase();

  if(!p)
    return null;

  const teams =
    teamsFromConfig(c);

  /* exact match */

  let found =
    teams.find(
      t =>
        teamPlayers(t)
          .some(
            x =>
              String(x)
                .trim()
                .toLowerCase()
              === p
          )
    );

  if(found)
    return found;

  /* partial match */

  found =
    teams.find(
      t =>
        teamPlayers(t)
          .some(
            x => {

              const a =
                p;

              const b =
                String(x)
                  .trim()
                  .toLowerCase();

              return (
                a.includes(b) ||
                b.includes(a)
              );

            }
          )
    );

  return found || null;
}


/* =========================================================
   EVENT DATA
========================================================= */

function eventTime(e){

  return (
    new Date(
      e?.time ||
      e?.created_at ||
      e?.timestamp ||
      0
    ).getTime()
    || 0
  );

}

function eventKiller(e){

  return (
    e?.killer ||
    e?.p_killer ||
    e?.killer_name ||
    e?.attacker ||
    ""
  );

}

function eventVictim(e){

  return (
    e?.victim ||
    e?.p_victim ||
    e?.victim_name ||
    e?.target ||
    ""
  );

}

function eventWeapon(e){

  return (
    e?.weapon ||
    e?.p_weapon ||
    e?.weapon_name ||
    "GUN"
  );

}


/* =========================================================
   KILL TOTALS
========================================================= */

const STORE_KEY =
  "bgmi_overlay_kills_" +
  ROOM;

let totals = {};

try{

  totals =
    JSON.parse(
      localStorage.getItem(
        STORE_KEY
      ) || "{}"
    ) || {};

}catch{

  totals = {};

}


function saveTotals(){

  try{

    localStorage.setItem(
      STORE_KEY,
      JSON.stringify(totals)
    );

  }catch{}

}


function applyEvents(c,events){

  arr(events).forEach(e => {

    const id =
      String(
        e?.id ??
        `${eventTime(e)}|${eventKiller(e)}|${eventVictim(e)}`
      );

    const killer =
      eventKiller(e);

    const team =
      findTeam(
        c,
        killer
      );

    if(!team)
      return;

    const key =
      teamName(team);

    if(!totals[key]){

      totals[key] = {
        kills:0,
        ids:{}
      };

    }

    if(
      !totals[key].ids[id]
    ){

      totals[key].kills++;

      totals[key].ids[id] =
        true;

    }

  });

  saveTotals();

}


/* =========================================================
   RENDER KILL FEED
========================================================= */

function renderKillFeed(c,events){

  const list =
    arr(events)
      .slice(0,7);

  const box =
    $("killRows");

  if(!list.length){

    box.innerHTML = `
      <div class="emptyFeed">
        WAITING FOR KILLS...
      </div>
    `;

    return;
  }


  box.innerHTML =
    list.map(e => {

      const killer =
        eventKiller(e);

      const victim =
        eventVictim(e);

      const weapon =
        eventWeapon(e);

      const killerTeam =
        findTeam(
          c,
          killer
        );

      const victimTeam =
        findTeam(
          c,
          victim
        );

      const killerLogo =
        teamLogo(
          killerTeam
        );

      const victimLogo =
        teamLogo(
          victimTeam
        );


      return `

        <div class="killRow">

          ${
            killerLogo
            ?
            `
            <img
              class="killLogo"
              src="${esc(killerLogo)}"
              onerror="
                this.style.visibility='hidden'
              "
            >
            `
            :
            `<div></div>`
          }


          <div
            class="player killer"
            title="${esc(killer)}">

            ${esc(killer || "UNKNOWN")}

          </div>


          <div
            class="weapon"
            title="${esc(weapon)}">

            ${esc(weapon)}

          </div>


          <div
            class="player victim"
            title="${esc(victim)}">

            ${esc(victim || "UNKNOWN")}

          </div>


          ${
            victimLogo
            ?
            `
            <img
              class="killLogo"
              src="${esc(victimLogo)}"
              onerror="
                this.style.visibility='hidden'
              "
            >
            `
            :
            `<div></div>`
          }

        </div>

      `;

    }).join("");

}


/* =========================================================
   POINTS
========================================================= */

function number(v){

  const n =
    Number(v);

  return Number.isFinite(n)
    ? n
    : 0;
}


function getPlacement(t){

  return number(
    t?.placement ??
    t?.placement_points ??
    t?.place_points ??
    0
  );

}


function getKills(t){

  const key =
    teamName(t);

  return (
    totals[key]?.kills ||
    number(t?.kills) ||
    0
  );

}


function getTotal(t){

  return (
    getKills(t) +
    getPlacement(t)
  );

}


function renderTable(c){

  const teams =
    teamsFromConfig(c);

  if(!teams.length){

    $("table").innerHTML = `
      <div class="noTeams">
        NO TEAM DATA
      </div>
    `;

    return;
  }


  const rows =
    teams
      .map(
        (t,i) => ({

          t,

          index:i,

          kills:
            getKills(t),

          placement:
            getPlacement(t),

          total:
            getTotal(t)

        })
      )
      .sort(
        (a,b) =>
          b.total-a.total ||
          b.kills-a.kills ||
          a.index-b.index
      )
      .slice(0,16);


  $("table").innerHTML =
    rows.map(
      (r,i) => {

        const logo =
          teamLogo(r.t);

        return `

          <div class="prow">

            <div class="rank">
              ${i+1}
            </div>


            <div class="teamCell">

              ${
                logo
                ?
                `
                <img
                  src="${esc(logo)}"
                  onerror="
                    this.style.visibility='hidden'
                  "
                >
                `
                :
                ""
              }

              <div
                class="teamName"
                title="${esc(teamName(r.t))}">

                ${esc(teamName(r.t))}

              </div>

            </div>


            <div class="number">
              ${r.kills}
            </div>


            <div class="number">
              ${r.placement}
            </div>


            <div class="total">
              ${r.total}
            </div>

          </div>

        `;

      }
    ).join("");

}


/* =========================================================
   BROADCAST
========================================================= */

function broadcast(c){

  const b =
    c?.broadcast || {};

  return {

    match:
      b.match ||
      c?.match ||
      c?.match_name ||
      "MATCH 1",

    group:
      b.group ||
      c?.group ||
      c?.group_name ||
      "GROUP A × B",

    day:
      b.day ||
      c?.day ||
      "DAY 1",

    map:
      b.map ||
      c?.map ||
      "ERANGEL"

  };

}


/* =========================================================
   ELIMINATION
========================================================= */

let shownElims =
  new Set();

let elimTimer =
  null;


/* Direct elimination flag */

function directEliminated(t){

  if(t?.eliminated === true)
    return true;

  if(t?.is_eliminated === true)
    return true;

  if(
    String(
      t?.status || ""
    ).toLowerCase()
    === "eliminated"
  )
    return true;

  const alive =
    t?.alive ??
    t?.alive_count ??
    t?.players_alive ??
    t?.alivePlayers;

  if(
    alive !== undefined &&
    alive !== null &&
    alive !== "" &&
    Number(alive) <= 0
  )
    return true;

  return false;
}


/* Also detect elimination from all roster
   players appearing as victims */

function inferredEliminated(
  team,
  events
){

  const players =
    teamPlayers(team)
      .map(
        x =>
          String(x)
            .trim()
            .toLowerCase()
      )
      .filter(Boolean);

  if(
    players.length === 0
  )
    return false;


  const dead =
    new Set();

  arr(events).forEach(e => {

    const victim =
      String(
        eventVictim(e)
      )
      .trim()
      .toLowerCase();

    if(victim)
      dead.add(victim);

  });


  return players.every(
    p =>
      [...dead].some(
        d =>
          d === p ||
          d.includes(p) ||
          p.includes(d)
      )
  );

}


function showElimination(team){

  const name =
    teamName(team);

  const logo =
    teamLogo(team);

  const img =
    $("elimLogo");


  if(logo){

    img.src =
      logo;

    img.style.display =
      "block";

  }else{

    img.style.display =
      "none";

  }


  $("elimName")
    .textContent =
    name;


  $("elimBanner")
    .style.display =
    "flex";


  clearTimeout(
    elimTimer
  );


  elimTimer =
    setTimeout(
      () => {

        $("elimBanner")
          .style.display =
          "none";

      },
      5000
    );

}


function checkEliminations(
  c,
  events
){

  const teams =
    teamsFromConfig(c);

  teams.forEach(team => {

    const name =
      teamName(team);

    if(
      shownElims.has(name)
    )
      return;


    if(
      directEliminated(team) ||
      inferredEliminated(
        team,
        events
      )
    ){

      shownElims.add(name);

      showElimination(team);

    }

  });

}


/* =========================================================
   MAIN LOOP
========================================================= */

async function tick(){

  try{

    const [
      c,
      events
    ] =
      await Promise.all([
        getState(),
        getEvents()
      ]);


    /* KILLS */

    applyEvents(
      c,
      events
    );


    /* KILL FEED */

    renderKillFeed(
      c,
      events
    );


    /* BROADCAST */

    const b =
      broadcast(c);


    $("matchTitle")
      .textContent =
      b.match;

    $("groupTitle")
      .textContent =
      b.group;

    $("dayTitle")
      .textContent =
      b.day;

    $("mapTitle")
      .textContent =
      b.map;

    $("pointsMap")
      .textContent =
      b.map;


    /* POINTS TABLE */

    renderTable(c);


    /* ELIMINATION */

    checkEliminations(
      c,
      events
    );


    $("status")
      .textContent =
      `LIVE SYNC • ROOM ${ROOM} • AUTO UPDATE`;


  }catch(err){

    console.error(
      "OVERLAY ERROR:",
      err
    );

    $("status")
      .textContent =
      "LIVE DATA CONNECTION ERROR • RETRYING...";

  }

}


/* START */

tick();

setInterval(
  tick,
  1000
);

</script>
